<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行政書士試験 毎日30分トレーニング</title>
<style>
  :root {
    --main: #1a5276;
    --accent: #e67e22;
    --ok: #27ae60;
    --ng: #c0392b;
    --bg: #f4f6f7;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    margin: 0; background: var(--bg); color: #2c3e50;
    line-height: 1.7;
  }
  header {
    background: var(--main); color: #fff; padding: 14px 16px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .countdown { font-size: 12px; opacity: .9; margin-top: 2px; }
  main { max-width: 660px; margin: 0 auto; padding: 12px 12px 80px; }
  .card {
    background: var(--card); border-radius: 10px; padding: 16px;
    margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { font-size: 15px; margin: 0 0 8px; color: var(--main);
    border-left: 4px solid var(--accent); padding-left: 8px; }
  .card h3 { font-size: 14px; margin: 12px 0 4px; color: var(--main); }
  .muted { color: #7f8c8d; font-size: 12px; }
  button {
    font-family: inherit; font-size: 14px; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer; margin: 4px 4px 4px 0;
  }
  .btn-main { background: var(--main); color: #fff; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-ng { background: var(--ng); color: #fff; }
  .btn-ghost { background: #ecf0f1; color: #2c3e50; }
  .btn-big { width: 100%; padding: 14px; font-size: 16px; }
  nav.tabs {
    display: flex; background: #fff; border-top: 1px solid #ddd;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  }
  nav.tabs button {
    flex: 1; background: none; color: #7f8c8d; border-radius: 0;
    font-size: 11px; padding: 8px 2px; margin: 0;
  }
  nav.tabs button.active { color: var(--main); font-weight: bold; }
  nav.tabs button .ico { display: block; font-size: 18px; }
  .step-bar { display: flex; gap: 4px; margin-bottom: 10px; }
  .step-bar span {
    flex: 1; height: 6px; border-radius: 3px; background: #d5dbdb;
  }
  .step-bar span.done { background: var(--ok); }
  .step-bar span.now { background: var(--accent); }
  .term-box { border: 1px solid #d5dbdb; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .term-box .term { font-weight: bold; color: var(--main); font-size: 15px; }
  .term-box .ex { background: #fef9e7; border-radius: 6px; padding: 6px 10px; margin-top: 6px; font-size: 13px; }
  .quiz-q { font-size: 15px; font-weight: bold; margin-bottom: 10px; }
  .quiz-exp { background: #eaf2f8; border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
  .quiz-exp.correct { background: #e9f7ef; }
  .quiz-exp.wrong { background: #fdedec; }
  .badge { display: inline-block; background: #d6eaf8; color: var(--main);
    border-radius: 4px; font-size: 11px; padding: 1px 8px; margin-right: 6px; }
  textarea {
    width: 100%; min-height: 80px; font-family: inherit; font-size: 15px;
    border: 1px solid #bbb; border-radius: 8px; padding: 10px; line-height: 1.8;
  }
  .model-answer { background: #fef9e7; border: 1px solid #f1c40f; border-radius: 8px; padding: 12px; margin-top: 10px; }
  .kw-check label { display: block; padding: 6px 4px; border-bottom: 1px dashed #eee; font-size: 14px; }
  .kw-check input { transform: scale(1.3); margin-right: 8px; }
  .lecture-body p { margin: 8px 0; font-size: 14px; }
  .lecture-body ul { margin: 6px 0; padding-left: 22px; font-size: 14px; }
  .lecture-body li { margin: 4px 0; }
  .phrase-check { background: #f5eef8; border-left: 4px solid #8e44ad; border-radius: 0 8px 8px 0;
    padding: 10px 12px; margin-top: 12px; font-size: 13px; }
  .phrase-check b { color: #8e44ad; }
  .point-box { background: #fdf2e9; border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0;
    padding: 10px 12px; margin-top: 10px; font-size: 13px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #eaf2f8; border-radius: 8px; padding: 10px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: bold; color: var(--main); }
  .stat .lbl { font-size: 11px; color: #7f8c8d; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 4px 0; }
  .bar-row .lbl { width: 64px; }
  .bar-row .bar { flex: 1; background: #ecf0f1; border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-row .bar i { display: block; height: 100%; background: var(--main); }
  .timer { float: right; font-size: 12px; color: #7f8c8d; }
  .done-banner { text-align: center; padding: 24px 12px; }
  .done-banner .big { font-size: 40px; }
  details.dict { background: #fff; border-bottom: 1px solid #eee; padding: 8px 12px; }
  details.dict summary { font-weight: bold; color: var(--main); cursor: pointer; font-size: 14px; }
  details.dict .ex { background: #fef9e7; border-radius: 6px; padding: 6px 10px; margin-top: 6px; font-size: 13px; }
  .hidden { display: none; }
  .char-count { text-align: right; font-size: 12px; color: #7f8c8d; }
</style>
</head>
<body>
<header>
  <h1>行政書士試験 毎日30分トレーニング</h1>
  <div class="countdown" id="countdown"></div>
</header>
<main id="main"></main>
<nav class="tabs">
  <button id="tab-today" onclick="showTab('today')"><span class="ico">📖</span>今日の学習</button>
  <button id="tab-review" onclick="showTab('review')"><span class="ico">🔁</span>弱点復習</button>
  <button id="tab-dict" onclick="showTab('dict')"><span class="ico">📚</span>用語辞典</button>
  <button id="tab-progress" onclick="showTab('progress')"><span class="ico">📊</span>進捗</button>
</nav>

<script>
/* ============================================================
   データ: 法律用語・言い回し辞典
   {t: 用語, m: 意味, ex: 試験での使われ方・例}
   ============================================================ */
const TERMS = [
{t:"及び/並びに", m:"どちらも「AND」。小さい接続が「及び」、大きい接続が「並びに」。「A及びB並びにC」=(AとB)のグループと、C。", ex:"「国会議員及び国務大臣並びに裁判官」→ 国会議員と国務大臣がワンセット、裁判官は別グループ。"},
{t:"又は/若しくは", m:"どちらも「OR」。大きい選択が「又は」、小さい選択が「若しくは」。「A若しくはB又はC」=(AかB)か、C。", ex:"「懲役若しくは禁錮又は罰金」→ まず大きく「身体刑か罰金か」、身体刑の中で「懲役か禁錮か」。"},
{t:"みなす/推定する", m:"「みなす」=反証を許さず、そうだと確定的に扱う。「推定する」=一応そう扱うが、反対の証拠があればひっくり返せる。", ex:"「胎児は、相続については、既に生まれたものとみなす」→ 反証不可。「夫婦のいずれに属するか明らかでない財産は、共有に属するものと推定する」→ 反証できる。"},
{t:"直ちに/速やかに/遅滞なく", m:"急ぐ順に「直ちに(即時・最も厳しい)>速やかに(できるだけ早く)>遅滞なく(正当な理由があれば遅れてもよい)」。", ex:"「現行犯逮捕されたときは直ちに弁護人選任権を告げる」など、条文の語の使い分けがそのまま○×で問われる。"},
{t:"善意/悪意", m:"日常語と違い、道徳は無関係。「善意」=ある事実を知らないこと。「悪意」=知っていること。", ex:"「善意の第三者に対抗することができない」→「事情を知らない第三者には主張できない」という意味。"},
{t:"善意無過失", m:"知らず(善意)、かつ知らないことに落ち度もない(無過失)こと。保護の要件として頻出。", ex:"即時取得(民法192条)は「平穏・公然・善意・無過失」がそろって成立する。"},
{t:"対抗することができない", m:"その権利・事実を相手に主張できない、という意味。権利自体が消えるわけではない点に注意。", ex:"「登記をしなければ第三者に対抗することができない」→ 所有権はあるが、登記がないと第三者には主張できない。"},
{t:"課する/科する", m:"「課する」=税金や義務を負わせる。「科する」=刑罰や過料を負わせる。", ex:"「租税を課する」「懲役を科する」。漢字の使い分けが基礎法学で問われる。"},
{t:"適用/準用", m:"「適用」=その規定を本来の対象にそのまま当てはめる。「準用」=似た別の事柄に、必要な読み替えをして借りて使う。", ex:"「前条の規定は、〇〇について準用する」→ 条文を丸ごと書く手間を省くテクニック。"},
{t:"類推適用", m:"条文が直接予定していない場面に、趣旨が共通することを理由に裁判所が当てはめること。条文上の「準用」と違い、解釈で行う。", ex:"民法94条2項(虚偽表示)の類推適用は判例の超頻出テーマ。"},
{t:"時/とき/場合", m:"「時」=時点そのもの。「とき」=〜の場合(仮定条件)。「場合」も仮定条件で、二重になるときは大きい方が「場合」、小さい方が「とき」。", ex:"「相続開始の時」=その瞬間。「申請があったときは」=申請があった場合は。"},
{t:"者/物/もの", m:"「者」=人(法人含む)。「物」=物体。「もの」=人や物に当たらないもの、または直前の語句に条件を重ねるときに使う。", ex:"「学生であって、20歳未満のもの」→「もの」で条件を絞り込んでいる。"},
{t:"以上/超える・以下/未満", m:"「以上」「以下」はその数を含む。「超える」「未満」は含まない。", ex:"「5人以上」=5人もOK。「5人を超える」=6人から。数字の○×問題で頻出。"},
{t:"無効/取り消すことができる", m:"「無効」=はじめから当然に効力なし(誰でも主張可)。「取り消すことができる」=取り消すまでは有効で、取消権者が取り消すと遡って無効になる。", ex:"公序良俗違反は無効、詐欺による意思表示は取り消すことができる。この違いは記述でも問われる。"},
{t:"遡及する/遡って", m:"効力が過去にさかのぼること。", ex:"「取消しの効果は遡及する」「時効の効力は起算日に遡る」。"},
{t:"援用する", m:"自分の利益のために、ある事実や権利を持ち出して主張すること。", ex:"「時効は、当事者が援用しなければ、裁判所がこれによって裁判をすることができない」(民法145条)。"},
{t:"催告", m:"相手に対して一定の行為(履行など)を要求する通知。", ex:"「相当の期間を定めてその履行の催告をし」(民法541条)。記述式の答案でそのまま書かされる重要ワード。"},
{t:"瑕疵(かし)", m:"キズ・欠陥のこと。物の欠陥にも、手続や意思表示の欠陥にも使う。", ex:"「設置又は管理に瑕疵があったため」(国家賠償法2条)。"},
{t:"欠缺(けんけつ)", m:"欠けていること。「登記の欠缺」=登記がないこと。", ex:"「登記の欠缺を主張する正当の利益を有する第三者」という判例の言い回しで登場。"},
{t:"信義則(信義誠実の原則)", m:"権利の行使や義務の履行は、相手の信頼を裏切らないよう誠実に行うべきという民法の大原則(1条2項)。", ex:"条文がない場面の最後のよりどころとして判例に頻出。"},
{t:"善管注意義務", m:"「善良な管理者の注意義務」。その職業・地位にある人として一般に要求される水準の注意義務。自己の財産と同一の注意義務より重い。", ex:"受任者・有償の受寄者などが負う。「自己の財産に対するのと同一の注意」(無償の受寄者)との対比で出る。"},
{t:"債権/債務", m:"債権=特定の人に行為(給付)を請求できる権利。債務=その義務。お金の貸し借りに限らない。", ex:"売買では、売主は「引き渡す債務」と「代金を受け取る債権」を両方持つ。"},
{t:"物権/債権の違い", m:"物権=物を直接支配する権利で、誰に対しても主張できる(絶対性)。債権=特定の人にしか主張できない(相対性)。", ex:"「売買は賃貸借を破る」(賃借権=債権は新所有者に負ける)が原則。例外が対抗要件を備えた不動産賃借権。"},
{t:"抗弁(権)", m:"相手の請求を拒む言い分・権利。", ex:"同時履行の抗弁権(民法533条)、保証人の催告・検索の抗弁権(452・453条)。"},
{t:"連帯して", m:"複数人がそれぞれ全額(全部)の責任を負うこと。", ex:"「各自が連帯してその全額について賠償責任を負う」。連帯保証人には催告・検索の抗弁がない点とセットで覚える。"},
{t:"履行/弁済", m:"どちらも債務の内容を実行して債権を消滅させること。ほぼ同義で、行為の面からは「履行」、債権消滅の面からは「弁済」という。", ex:"「債務の本旨に従った履行をしないとき」(民法415条)=約束どおりにやらないとき。"},
{t:"債務の本旨", m:"債務の本来の趣旨・内容のこと。", ex:"「債務の本旨に従った履行の提供」=契約内容どおりの提供。記述式の頻出フレーズ。"},
{t:"解除/解約(告知)", m:"解除=契約を遡って消滅させる(原状回復義務が生じる)。賃貸借など継続的契約の解除は将来に向かってのみ効力(解約告知)。", ex:"「賃貸借の解除をした場合には、その解除は、将来に向かってのみその効力を生ずる」(民法620条)。"},
{t:"処分", m:"行政法では「行政庁が法律に基づき、国民の権利義務を一方的に決める行為」(行政行為)を指す。財産の売却などの意味の「処分」と区別する。", ex:"「処分その他公権力の行使に当たる行為」(行政事件訴訟法3条2項)。"},
{t:"行政庁", m:"行政主体(国・自治体)の意思を決定し外部に表示する機関。大臣・知事・市町村長など「人」の側を指し、役所の建物や組織全体ではない。", ex:"「行政庁の処分」「処分庁」「審査庁」など、〇〇庁=決定権限を持つ機関のこと。"},
{t:"公定力", m:"行政行為は、たとえ違法でも、取消権限のある機関が取り消すまでは一応有効として扱われる力。", ex:"だから違法な処分には取消訴訟や審査請求で争う必要がある。ただし「無効」の処分に公定力はない。"},
{t:"不可争力(形式的確定力)", m:"不服申立期間・出訴期間が過ぎると、国民の側からはもう争えなくなる力。", ex:"行政庁の側からの職権取消しは不可争力が生じた後でも可能、という対比で出題される。"},
{t:"不可変更力", m:"審査請求の裁決など、争いを裁断した行為は、行政庁自身も取り消したり変更したりできなくなる力。", ex:"すべての行政行為に生じるのではなく、裁決など「裁断行為」に限られる点がひっかけポイント。"},
{t:"羈束行為/裁量行為", m:"羈束(きそく)行為=法律が要件・効果を一義的に定め、行政庁に判断の余地がないもの。裁量行為=行政庁に判断の幅が認められるもの。", ex:"「裁量権の範囲を超え又はその濫用があった場合に限り、裁判所はその処分を取り消すことができる」(行訴法30条)。"},
{t:"教示", m:"行政庁が、不服申立てや取消訴訟ができること・その期間などを相手に教えること(義務)。", ex:"行政不服審査法82条・行政事件訴訟法46条。書面で処分をする場合は書面で教示する。"},
{t:"裁決/決定/判決", m:"裁決=審査請求に対する行政庁の判断。判決=裁判所の判断。行政不服審査と訴訟で言葉が違う。", ex:"「裁決の取消しの訴え」では原則として裁決固有の瑕疵しか主張できない(原処分主義)。"},
{t:"棄却/却下/認容", m:"却下=中身を審理せず門前払い(要件を満たさない)。棄却=中身を審理した上で理由なしと退ける。認容=言い分を認める。", ex:"「不適法な審査請求は却下する」「理由がないときは棄却する」。3つの区別は○×頻出。"},
{t:"原告適格", m:"その訴訟の原告となる資格。取消訴訟では「法律上の利益を有する者」に限られる。", ex:"「当該処分の取消しを求めるにつき法律上の利益を有する者」(行訴法9条)。記述式でそのまま書かされた実績あり。"},
{t:"訴えの利益", m:"判決を得る現実の必要性。処分の効果が消滅すると訴えの利益も失われるのが原則。", ex:"営業停止期間の経過後は処分取消しを求める訴えの利益が消える、など判例事例で問われる。"},
{t:"執行停止", m:"処分の取消訴訟や審査請求をしても処分の効力は止まらない(執行不停止の原則)。裁判所・行政庁が例外的に効力等を止めるのが執行停止。", ex:"「重大な損害を避けるため緊急の必要があるとき」(行訴法25条)。要件の文言が記述・○×両方で出る。"},
{t:"求償", m:"他人の代わりに支払った人が、本来負担すべき人に「払い戻せ」と請求すること。", ex:"国家賠償法1条2項「公務員に故意又は重大な過失があったときは、国又は公共団体は、その公務員に対して求償権を有する」。"},
{t:"公布/施行", m:"公布=成立した法令を国民に知らせること(官報掲載)。施行=法令の効力が現実に発生すること。", ex:"「この法律は、公布の日から起算して〇年を超えない範囲内において政令で定める日から施行する」。"},
{t:"政令/省令/条例/規則", m:"政令=内閣が定める命令。省令=各省大臣が定める命令。条例=地方議会が定める自治立法。規則=地方公共団体の長などが定める。", ex:"効力の上下(法律>政令>省令)と、条例で罰則を定められること(2年以下の懲役等)が頻出。"},
{t:"その他/その他の", m:"「A、B その他C」=A・BとCは並列(例示ではない)。「A、B その他のC」=A・BはCの例示(Cに含まれる)。", ex:"「賃金、給料その他の給与」→ 賃金・給料は給与の例示。1字の違いで意味が変わる、基礎法学の定番。"},
{t:"当該", m:"「その」「いま話題にしている、まさにその」という指示語。", ex:"「当該処分」=いま問題にしているその処分。条文を読むときは「その」と置き換えるとスムーズに読める。"},
];

/* ============================================================
   データ: ミニ講義 (1日1テーマ・約8分)
   {t: タイトル, s: 科目, body: 本文HTML, phrase: 言い回しチェック, point: 出題ポイント}
   ============================================================ */
const LECTURES = [
{t:"法令用語の基本ルール①接続詞", s:"基礎法学",
body:"<p>条文が読みにくい最大の原因は、日常語と違うルールで言葉が使われていることです。まず接続詞から押さえます。</p><ul><li><b>及び/並びに(AND)</b>:小さいまとまりに「及び」、大きいまとまりに「並びに」。「A及びB並びにC」=(A+B)とC。</li><li><b>又は/若しくは(OR)</b>:大きい選択に「又は」、小さい選択に「若しくは」。「A若しくはB又はC」=(AかB)かC。</li><li><b>その他/その他の</b>:「その他」は並列、「その他の」は例示。</li></ul><p>条文を読むときは、まず「並びに」「又は」で大きく区切り、次に「及び」「若しくは」で小さく区切ると構造が見えます。</p>",
phrase:"「懲役若しくは禁錮又は罰金」→ 大きな選択は「身体刑 or 罰金」。身体刑の中の選択が「懲役 or 禁錮」。外側が「又は」、内側が「若しくは」。",
point:"基礎法学・憲法・行政法の○×で、接続詞の解釈を変えたひっかけが毎年のように出ます。迷ったら図に書いて区切る習慣を。"},
{t:"法令用語の基本ルール②時間・効力の言葉", s:"基礎法学",
body:"<p>時間と効力に関する言葉は、厳密な使い分けがあります。</p><ul><li><b>直ちに>速やかに>遅滞なく</b>:急ぐ順。「遅滞なく」は正当な理由があれば遅れてもよい。</li><li><b>以上・以下</b>はその数を含む。<b>超える・未満</b>は含まない。</li><li><b>みなす</b>=反証不可で確定。<b>推定する</b>=反証があれば覆る。</li><li><b>無効</b>=はじめから効力なし。<b>取り消すことができる</b>=取り消すまでは有効。</li><li><b>公布</b>=知らせる。<b>施行</b>=効力発生。</li></ul><p>「みなす/推定する」と「無効/取消し」の区別は、民法でも行政法でも繰り返し登場する超重要概念です。</p>",
phrase:"「既に生まれたものとみなす」(胎児の相続)→「みなす」だから、実際には生まれていなくても法律上は生まれたものとして確定的に扱う。反証は許されない。",
point:"記述式でも「無効である」と「取り消すことができる」の書き分けで点差がつきます。どちらの効果かを常に意識して条文を読みましょう。"},
{t:"人権総論・幸福追求権・法の下の平等", s:"憲法",
body:"<p>憲法の人権問題は「誰に・どの人権が・どこまで保障されるか」の枠組みで考えます。</p><ul><li><b>外国人</b>:権利の性質上日本国民のみを対象とするものを除き保障(マクリーン事件)。入国の自由・参政権は保障されない。</li><li><b>法人</b>:性質上可能な限り保障(八幡製鉄事件・政治献金も会社の権利能力の範囲内)。</li><li><b>幸福追求権(13条)</b>:新しい人権の根拠。プライバシー権(京都府学連事件=承諾なしに容ぼうを撮影されない自由)など。</li><li><b>法の下の平等(14条)</b>:合理的な区別は許される。尊属殺重罰規定違憲判決、非嫡出子相続分違憲決定が代表判例。</li></ul>",
phrase:"判例の「権利の性質上許される限り」「合理的な理由のない差別」という言い回しは、結論を丸暗記するより「原則保障+性質による限界」という構造で覚えると応用が利きます。",
point:"憲法は判例の結論の正誤を問う出題が中心。「誰の」「何の自由が」「認められたか否か」を判例名とセットで。"},
{t:"精神的自由権(思想良心・信教・表現)", s:"憲法",
body:"<ul><li><b>思想良心の自由(19条)</b>:内心にとどまる限り絶対的に保障。謝罪広告の強制は単に事態の真相を告白し陳謝の意を表明する程度なら合憲(判例)。</li><li><b>信教の自由(20条)</b>:政教分離の判断は目的効果基準(津地鎮祭事件=合憲、愛媛玉串料事件=違憲)。空知太神社事件は総合判断で違憲。</li><li><b>表現の自由(21条)</b>:優越的地位。検閲は絶対的に禁止(税関検査は検閲に当たらない)。事前抑制は原則禁止(北方ジャーナル事件)。報道の自由は21条の保障のもとにあり、取材の自由も尊重に値する(博多駅事件)。</li></ul>",
phrase:"博多駅事件の「報道の自由は保障される/取材の自由は<b>尊重に値する</b>」の温度差は頻出。判例は語尾の強さを使い分けるので、そのまま覚えるのが正解です。",
point:"「検閲=行政権が主体・発表前・網羅的一般的審査」という判例の定義の要素を入れ替えるひっかけが定番。"},
{t:"経済的自由・人身の自由・社会権", s:"憲法",
body:"<ul><li><b>職業選択の自由(22条)</b>:規制目的二分論。消極目的(国民の安全)規制は厳しめに審査(薬局距離制限=違憲)、積極目的(経済政策)は明白の原則で緩やか(小売市場=合憲)。</li><li><b>財産権(29条)</b>:森林法共有林分割制限=違憲。「正当な補償」は相当補償説(農地改革事件)だが土地収用では完全補償に近い運用。</li><li><b>生存権(25条)</b>:プログラム規定的に解され、立法府の広い裁量(朝日訴訟・堀木訴訟)。</li><li><b>31条以下</b>:行政手続にも適用ないし準用され得る(成田新法事件=常に告知聴聞が必要なわけではない)。</li></ul>",
phrase:"「明白の原則」=「規制が著しく不合理であることが明白である場合に限り違憲」。二重否定に近い長い言い回しですが、これは「ほぼ合憲にする緩い基準」という意味です。",
point:"薬局=違憲/小売市場=合憲、森林法=違憲、の結論の組合せ問題が定番。目的(消極/積極)とセットで整理。"},
{t:"国会・内閣", s:"憲法",
body:"<ul><li><b>国会</b>:唯一の立法機関(41条)。衆議院の優越=法律(再可決2/3)、予算・条約・首相指名(両院協議会でも不一致なら衆議院の議決が国会の議決に)。</li><li><b>会期</b>:常会(年1回)・臨時会(いずれかの議院の総議員の1/4以上の要求で内閣は召集を決定しなければならない)・特別会(解散総選挙後30日以内)。</li><li><b>議員特権</b>:不逮捕特権(会期中。院外の現行犯を除く)、免責特権(院内での演説・討論・表決)。</li><li><b>内閣</b>:首相は国会議員の中から国会が指名。国務大臣の過半数は国会議員。首相は大臣を任意に罷免できる。衆議院で不信任決議→10日以内に解散か総辞職。</li></ul>",
phrase:"「国会の議決とする」「〜しなければならない」「〜することができる」── 統治の条文は義務(必須)か裁量(任意)かの語尾を変えるひっかけが大半です。",
point:"数字(1/4、2/3、10日、30日)と「衆議院の優越が働く場面」の正確な暗記で取れる分野。落とせません。"},
{t:"裁判所・違憲審査・財政", s:"憲法",
body:"<ul><li><b>司法権の限界</b>:統治行為論(砂川事件・苫米地事件)、部分社会の法理(大学の単位認定は司法審査の対象外、ただし専攻科修了認定は対象)。</li><li><b>裁判官の独立</b>:罷免は①心身の故障②公の弾劾③国民審査(最高裁裁判官)のみ。行政機関による懲戒は禁止。</li><li><b>違憲審査(81条)</b>:付随的違憲審査制。最高裁は抽象的審査はできない(警察予備隊訴訟)。</li><li><b>財政</b>:租税法律主義(84条)、国費支出は国会の議決(85条)、公金支出制限(89条)、予備費(87条)。</li></ul>",
phrase:"「一見極めて明白に違憲無効であると認められない限り、司法審査権の範囲外」(砂川事件)── 統治行為論でも完全に審査を放棄していない留保付きの言い回しに注意。",
point:"裁判官の罷免事由3つは限定列挙。「懲戒で罷免できる」は誤り、という定番ひっかけ。"},
{t:"制限行為能力者", s:"民法",
body:"<ul><li><b>未成年者</b>:法定代理人の同意なしの行為は取り消せる。例外=①単に権利を得、義務を免れる行為②処分を許された財産③許可された営業。</li><li><b>成年被後見人</b>:日用品の購入その他日常生活に関する行為以外は取り消せる(同意があっても取り消せる点が特徴)。</li><li><b>被保佐人</b>:借財・保証・不動産処分など13条1項の重要行為に同意が必要。</li><li><b>被補助人</b>:同意を要する行為は13条1項の一部から審判で定める。</li><li><b>詐術</b>:行為能力者であると信じさせるため詐術を用いたときは取り消せない(21条)。</li></ul>",
phrase:"「単に権利を得、又は義務を免れる法律行為」→ もらうだけ・タダで義務がなくなるだけの行為。「単に」が付くのは負担が一切ないことを示します。",
point:"成年被後見人は「同意を得てした行為も取り消せる」(同意どおり行動できる保証がないから)。ここが未成年者との最大の違い。"},
{t:"意思表示(心裡留保・虚偽表示・錯誤・詐欺強迫)", s:"民法",
body:"<ul><li><b>心裡留保(93条)</b>:原則有効。相手方が悪意または有過失なら無効。無効は善意の第三者に対抗できない。</li><li><b>虚偽表示(94条)</b>:当事者間では無効。ただし善意の第三者に対抗できない(第三者は無過失不要・登記不要が判例)。94条2項の類推適用も頻出。</li><li><b>錯誤(95条)</b>:重要な錯誤は取り消せる。動機(基礎事情)の錯誤は、その事情が表示されていたときに限る。表意者に重大な過失があれば原則取消し不可。善意無過失の第三者に対抗できない。</li><li><b>詐欺・強迫(96条)</b>:取り消せる。詐欺取消しは善意無過失の第三者に対抗できないが、<b>強迫取消しは誰にでも対抗できる</b>。</li></ul>",
phrase:"「善意の第三者に対抗することができない」── 94条は「善意」だけ、95・96条は「善意でかつ過失がない」。保護される第三者の要件の差が○×の急所。",
point:"強迫だけは第三者保護規定なし=被強迫者を最優先で守る。「詐欺と強迫の扱いは同じ」と書かれたら誤り。"},
{t:"代理(無権代理・表見代理)", s:"民法",
body:"<ul><li><b>代理の基本</b>:顕名+代理権。代理人は行為能力者であることを要しない(102条)。自己契約・双方代理は原則無権代理(108条)。</li><li><b>無権代理</b>:本人は追認できる(追認は契約時に遡って効力)。相手方の保護=①催告権(善意悪意不問。確答なければ拒絶とみなす)②取消権(善意のみ)③無権代理人への責任追及(117条:履行または損害賠償。相手方が悪意・有過失なら不可、ただし無権代理人が自分に権限がないことを知っていたときは有過失でも追及可)。</li><li><b>表見代理</b>:①代理権授与表示(109条)②権限外の行為(110条:正当な理由)③代理権消滅後(112条)。</li><li><b>無権代理と相続</b>:無権代理人が本人を単独相続→当然有効。本人が無権代理人を相続→追認拒絶できる(ただし117条責任は承継)。</li></ul>",
phrase:"110条の「第三者が代理人の権限があると信ずべき<b>正当な理由</b>があるとき」── 記述式で「正当な理由」という言葉をそのまま書かせる出題実績があります。",
point:"無権代理と相続のパターン(誰が誰を相続したか)で結論が変わる事例問題が頻出。"},
{t:"時効", s:"民法",
body:"<ul><li><b>取得時効(162条)</b>:所有の意思をもって平穏かつ公然と占有。善意無過失なら10年、それ以外は20年。善意無過失は占有開始時に判定。</li><li><b>消滅時効(166条)</b>:債権は「権利を行使できることを知った時から5年」または「権利を行使できる時から10年」。人の生命身体の侵害による損害賠償請求権は特則(知った時から5年/権利行使できる時から20年)。</li><li><b>完成猶予と更新</b>:裁判上の請求→終了まで完成猶予、確定判決で更新。催告→6か月の完成猶予(再度の催告は効力なし)。承認→更新。</li><li><b>援用(145条)</b>:当事者(保証人・物上保証人・第三取得者など正当な利益を有する者を含む)が援用しないと裁判所は時効で裁判できない。時効完成後の債務承認→援用できない(信義則)。</li></ul>",
phrase:"「完成猶予」=ストップウォッチの一時停止(完成しない)。「更新」=ゼロからやり直し。旧法の「中断・停止」から用語が変わった部分で、新旧の言葉を混ぜたひっかけに注意。",
point:"時効完成後に債務を承認した債務者は、完成を知らなかったとしてももはや援用できない(判例)── ○×の超定番。"},
{t:"物権変動(177条)", s:"民法",
body:"<ul><li><b>意思主義(176条)</b>:物権変動は意思表示のみで効力発生。登記は対抗要件(177条)。</li><li><b>177条の「第三者」</b>:当事者とその包括承継人以外の者で、登記の欠缺を主張する正当な利益を有する者。<b>背信的悪意者は含まれない</b>(単なる悪意者は含まれる=自由競争の範囲内)。不法占拠者・無権利者も含まれない。</li><li><b>取消しと登記</b>:取消し前の第三者→96条3項等の問題/取消し後の第三者→177条の対抗問題。</li><li><b>時効と登記</b>:時効完成前の第三者には登記なしで対抗可/完成後の第三者とは対抗問題。</li><li><b>相続と登記</b>:法定相続分は登記なしで対抗可。遺産分割による法定相続分を超える部分は登記が必要(899条の2)。</li></ul>",
phrase:"「登記の欠缺を主張する正当な利益を有する第三者」── 判例由来の定型句。記述式では「背信的悪意者は177条の第三者に当たらない」という形で書かせます。",
point:"「取消し・解除・時効の前か後か」で処理が変わる時系列問題が最頻出。図を描いて前後を確認する癖を。"},
{t:"占有権・所有権・共有", s:"民法",
body:"<ul><li><b>即時取得(192条)</b>:取引行為により、平穏・公然・善意・無過失で動産の占有を始めた者は権利を取得。対象は動産のみ(不動産・登録自動車は×)。盗品・遺失物は2年間回復請求可(193条)。</li><li><b>占有訴権</b>:占有保持・保全・回収の訴え。占有回収の訴えは「占有を奪われた」場合のみ(だまし取られた場合は×)。</li><li><b>相隣関係</b>:隣地使用、ライフライン設備設置権など(令和3年改正)。</li><li><b>共有</b>:保存行為=単独可/管理=持分価格の過半数(軽微でない変更は全員同意)。共有物全体の不法占拠者への明渡請求は単独で可能。共有物分割はいつでも請求可(不分割特約は5年まで)。</li></ul>",
phrase:"即時取得の条文は「占有を<b>始めた</b>者」── 現実の引渡し等が必要で、占有改定では即時取得は成立しない(判例)。条文の動詞まで読むのがコツ。",
point:"即時取得の成否(取引行為か?動産か?占有改定ではないか?)を問う事例○×が毎年級の頻出。"},
{t:"抵当権・留置権", s:"民法",
body:"<ul><li><b>抵当権</b>:占有を移さない約定担保物権。被担保債権の利息等は<b>最後の2年分</b>のみ優先弁済(375条)。</li><li><b>効力の及ぶ範囲</b>:付加一体物に及ぶ。抵当地上の建物には及ばない(土地と建物は別個の不動産)。</li><li><b>物上代位</b>:売却・賃貸・滅失による代金・賃料・保険金等に、<b>払渡し前の差押え</b>を条件に行使可。</li><li><b>法定地上権(388条)</b>:①抵当権設定時に土地上に建物が存在②土地と建物が同一所有者③土地・建物の一方または双方に抵当権④競売で所有者が別々に。</li><li><b>留置権</b>:他人の物の占有者が、その物に関して生じた債権の弁済を受けるまで物を留置できる。不動産にも成立。占有を失うと消滅。</li></ul>",
phrase:"「その払渡し又は引渡しの前に差押えをしなければならない」(304条)── 物上代位の条件。記述式で「払渡し前に差し押さえる」と書かせる定番フレーズ。",
point:"法定地上権の4要件は、設定時の状態を1つずつ変えた事例で問われます。「設定時に更地→法定地上権不成立」が基本形。"},
{t:"債務不履行・解除", s:"民法",
body:"<ul><li><b>債務不履行(415条)</b>:債務の本旨に従った履行をしないとき、債権者は損害賠償を請求できる。ただし債務者の責めに帰することができない事由によるときは不可。</li><li><b>催告解除(541条)</b>:相当の期間を定めて催告し、期間内に履行がないとき解除可。ただし不履行が軽微であるときは不可。</li><li><b>無催告解除(542条)</b>:履行不能、明確な履行拒絶、定期行為など。</li><li><b>解除に債務者の帰責事由は不要</b>(改正の重要点)。逆に<b>債権者に帰責事由があるときは解除できない</b>(543条)。</li><li><b>解除の効果</b>:原状回復義務(金銭は受領時からの利息付き)。第三者の権利を害することはできない(545条1項ただし書。第三者は登記が必要・善意悪意不問)。</li></ul>",
phrase:"「相当の期間を定めてその履行の催告をし、その期間内に履行がないとき」── 記述式の模範解答にそのまま入る黄金フレーズ。丸ごと書けるように。",
point:"改正で「解除に帰責事由不要」になった点と「軽微なら解除不可」のただし書が出題の中心。"},
{t:"債権者代位権・詐害行為取消権", s:"民法",
body:"<ul><li><b>債権者代位権(423条)</b>:自己の債権を保全するため必要があるとき、債務者に属する権利(被代位権利)を行使できる。要件=①保全の必要性(原則、債務者の無資力)②被保全債権の弁済期到来(保存行為は例外)③一身専属権・差押禁止債権でない。金銭等は<b>自己への直接の支払・引渡しを求められる</b>。登記請求権の代位行使(423条の7)も可。</li><li><b>詐害行為取消権(424条)</b>:債務者が債権者を害することを知ってした行為の取消しを<b>裁判所に請求</b>できる(裁判上の行使が必須)。受益者が善意なら不可。被保全債権は詐害行為の前の原因に基づくこと。財産権を目的としない行為(離婚など)は対象外。出訴期間=債務者が害することを知って行為をしたことを債権者が知った時から2年・行為の時から10年。</li></ul>",
phrase:"「自己の債権を保全するため必要があるとき」「債権者を害することを知ってしてした行為」── どちらも記述式で条文の文言どおり書かせる頻出フレーズ。",
point:"代位権は裁判外でも行使可/取消権は必ず裁判上。この対比が○×の定番。"},
{t:"連帯債務・保証", s:"民法",
body:"<ul><li><b>連帯債務</b>:債権者は誰にでも全部の請求可。<b>絶対的効力</b>=弁済・更改・相殺・混同。<b>相対的効力</b>=請求・免除・時効完成(改正で相対効に変わった3つ!)。</li><li><b>保証(446条)</b>:保証契約は<b>書面でしなければ効力を生じない</b>。付従性・補充性(催告の抗弁・検索の抗弁)。</li><li><b>連帯保証</b>:催告・検索の抗弁<b>なし</b>、分別の利益なし。</li><li><b>個人根保証</b>:極度額を定めなければ効力を生じない。</li><li><b>事業債務の個人保証</b>:原則、契約前1か月以内の公正証書による保証意思の表示が必要。</li><li><b>情報提供義務</b>:主債務の履行状況(458条の2)など。</li></ul>",
phrase:"「書面でしなければ、その効力を生じない」── 保証契約の要式性。「口頭でも有効」と書かれたら即誤り。記述式でも「書面」がキーワードになります。",
point:"改正で「請求・免除・時効完成」が相対的効力になったことを知らないと旧知識で間違える、作問者の大好物。"},
{t:"売買・賃貸借", s:"民法",
body:"<ul><li><b>契約不適合責任</b>:目的物が種類・品質・数量に関して契約の内容に適合しないとき、買主は①追完請求(修補・代替物)②代金減額請求(相当の期間を定めた催告後。追完不能等なら無催告)③損害賠償④解除。種類・品質の不適合は<b>知った時から1年以内に通知</b>しないと失権(数量・権利の不適合には適用なし)。</li><li><b>賃貸借</b>:不動産賃借権は登記または借地借家法の対抗要件(建物の引渡し・借地上建物の登記)で対抗可。不動産の譲渡で賃貸人たる地位は当然に移転(賃借人の承諾不要)。</li><li><b>敷金(622条の2)</b>:賃貸借が終了し<b>賃貸物の返還を受けたとき</b>に残額を返還=明渡しが先履行。</li><li><b>無断譲渡・転貸</b>:解除できるが、背信行為と認めるに足りない特段の事情があれば解除不可(判例)。</li></ul>",
phrase:"「契約の内容に適合しない」── 旧「瑕疵担保」から変わった現行法のキーフレーズ。記述式では「追完の催告→代金減額」の流れを40字で書かせます。",
point:"敷金返還と明渡しは同時履行ではない(明渡しが先)── 判例・条文ともに頻出の急所。"},
{t:"不法行為", s:"民法",
body:"<ul><li><b>一般不法行為(709条)</b>:故意または過失+権利・利益侵害+損害+因果関係。</li><li><b>使用者責任(715条)</b>:事業の執行について第三者に加えた損害を使用者が賠償。「事業の執行について」は外形標準説(外形から職務の範囲内と見えればよい)。使用者は被用者に<b>信義則上相当と認められる限度</b>で求償可。被用者から使用者への逆求償も可(判例)。</li><li><b>工作物責任(717条)</b>:占有者が一次責任(必要な注意をしたときは免責)→所有者が二次責任(<b>無過失責任</b>)。</li><li><b>共同不法行為(719条)</b>:連帯して賠償。</li><li><b>期間制限(724条)</b>:損害および加害者を知った時から3年(人の生命・身体は5年)/不法行為の時から20年。</li></ul>",
phrase:"「事業の執行について」── 単なる「事業の執行中」より広く、外形上職務に見える行為を含む。助詞一つの違いに判例の解釈が詰まっています。",
point:"工作物責任は「占有者は過失責任(免責あり)・所有者は無過失責任(免責なし)」の二段構造を問うのが定番。"},
{t:"親族・相続", s:"民法",
body:"<ul><li><b>婚姻</b>:詐欺・強迫による婚姻は取り消せる。日常家事債務の連帯責任(761条)。</li><li><b>親子</b>:嫡出推定(婚姻成立の日から200日経過後・解消の日から300日以内の出生)。認知は遺言でも可。</li><li><b>相続順位</b>:配偶者は常に相続人。第1順位=子、第2=直系尊属、第3=兄弟姉妹。代襲相続(子の代襲は再代襲あり、兄弟姉妹は甥姪まで)。</li><li><b>相続の承認・放棄</b>:自己のために相続の開始があったことを知った時から<b>3か月以内</b>に、放棄・限定承認は<b>家庭裁判所に申述</b>。放棄者は初めから相続人でなかったものとみなす(代襲原因にならない)。</li><li><b>遺言</b>:15歳から可。自筆証書は全文・日付・氏名を自書し押印(財産目録はパソコン可)。</li><li><b>遺留分</b>:兄弟姉妹以外の相続人。侵害額に相当する<b>金銭</b>の支払を請求(物の返還ではない)。</li></ul>",
phrase:"「自己のために相続の開始があったことを知った時から3箇月以内」── 記述式の定番。起算点が「死亡時」ではない点まで含めて1フレーズで覚える。",
point:"相続放棄=代襲相続は発生しない/欠格・廃除=代襲する。この対比は毎年どこかで問われます。"},
{t:"行政法の一般原則・行政行為の効力", s:"行政法",
body:"<ul><li><b>法律による行政の原理</b>:侵害留保説が実務の出発点。<b>平等原則・比例原則・信義則</b>も行政を拘束(ただし租税法律主義の下で信義則の適用は慎重=判例)。</li><li><b>行政行為の効力</b>:<b>公定力</b>(取り消されるまで有効)・<b>不可争力</b>(期間経過で国民から争えない)・<b>自力執行力</b>(法律の根拠がある場合に自ら強制)・<b>不可変更力</b>(裁決等の裁断行為のみ)。</li><li><b>無効な行政行為</b>:瑕疵が<b>重大かつ明白</b>なら公定力なし。期間制限なく無効確認訴訟等で争える。</li><li><b>取消しと撤回</b>:取消し=成立時の瑕疵を理由に遡って消す/撤回=後発的事情により将来に向かって消す。撤回は法律の根拠がなくても処分庁ができる(判例)。</li></ul>",
phrase:"「重大かつ明白な瑕疵」── 無効の基準となる定型句。記述式で「どのような瑕疵があれば無効か」と問われたらこの8文字が核になります。",
point:"取消し(遡及)と撤回(将来効)の区別、撤回に法律の根拠が不要なこと── ○×の超定番。"},
{t:"行政裁量と司法審査", s:"行政法",
body:"<ul><li><b>裁量の所在</b>:要件裁量・効果裁量。法の文言と趣旨から判断。</li><li><b>司法審査(行訴法30条)</b>:裁量処分は「裁量権の範囲を<b>超え</b>又はその<b>濫用</b>があった場合に限り」取り消せる。</li><li><b>審査手法</b>:判断過程統制(考慮すべき事項を考慮せず、考慮すべきでない事項を考慮した等=日光太郎杉事件)、社会観念審査(マクリーン事件=全く事実の基礎を欠くか、社会通念上著しく妥当性を欠くか)。</li><li><b>代表判例</b>:マクリーン事件(在留更新=広い裁量)、神戸税関事件(懲戒処分=裁量尊重)、伊方原発訴訟(専門技術的裁量・判断過程の合理性審査)。</li></ul>",
phrase:"「裁量権の範囲を超え又はその濫用があった場合に限り、裁判所は、その処分を取り消すことができる」── 行訴法30条はこのまま記述式に出ます。条文ごと暗唱推奨。",
point:"裁量処分でも司法審査が一切及ばないわけではない(逸脱・濫用は審査される)── この「限り」の理解を問うのが定番。"},
{t:"行政上の強制執行(代執行・強制徴収・即時強制)", s:"行政法",
body:"<ul><li><b>行政代執行法</b>:対象は<b>代替的作為義務</b>(他人が代わってできる義務)のみ。要件=①法律(条例含む)により直接命ぜられ、または法律に基づき行政庁により命ぜられた行為②<b>他の手段によってその履行を確保することが困難</b>③<b>その不履行を放置することが著しく公益に反する</b>。手続=戒告→代執行令書→実行→費用は国税滞納処分の例により徴収。</li><li><b>執行罰</b>:義務を履行するまで過料を課して心理的に強制(現行法では砂防法のみ)。</li><li><b>直接強制</b>:義務者の身体・財産に直接実力行使(個別法の根拠が必要)。</li><li><b>即時強制</b>:義務を命じる暇がないとき、義務を介さずに直接実力行使(例:違法駐車車両のレッカー移動)。</li></ul>",
phrase:"「他の手段によってその履行を確保することが困難であり、かつ、その不履行を放置することが著しく公益に反すると認められるとき」── 代執行の要件。記述式の出題実績がある最重要フレーズ。",
point:"代執行できるのは「代替的作為義務」だけ。非代替的義務(健康診断を受けよ等)や不作為義務は対象外、が定番のひっかけ。"},
{t:"行政手続法:申請に対する処分・不利益処分", s:"行政法",
body:"<ul><li><b>申請に対する処分</b>:審査基準=定めて公にしておく<b>義務</b>(できる限り具体的に)。標準処理期間=定めるよう<b>努め</b>、定めたら公にする義務。申請が事務所に到達したときは<b>遅滞なく審査を開始</b>(返戻・放置は不可)。拒否処分には理由の提示が必要。</li><li><b>不利益処分</b>:処分基準=定め、公にするよう<b>努める</b>(努力義務にとどまる点が審査基準との違い!)。意見陳述=許認可の取消し等の重い処分は<b>聴聞</b>、それ以外は<b>弁明の機会の付与</b>(原則書面)。処分と同時に理由の提示(差し迫った必要がある場合を除く)。</li><li><b>理由の提示の程度</b>:いかなる事実関係に基づきいかなる法規を適用したか、相手方が知り得る程度に(判例)。</li></ul>",
phrase:"「定め、かつ、公にしておかなければならない」(審査基準)vs「定め、かつ、公にしておくよう努めなければならない」(処分基準)── 語尾だけで義務と努力義務が分かれる、行政手続法最大の引っかけポイント。",
point:"審査基準=義務/処分基準=努力義務、聴聞と弁明の振り分け── 毎年必ずどこかで出る鉄板論点。"},
{t:"行政手続法:行政指導・届出・意見公募", s:"行政法",
body:"<ul><li><b>行政指導</b>:あくまで<b>任意の協力</b>によってのみ実現(32条)。従わなかったことを理由に<b>不利益な取扱いをしてはならない</b>。申請に関連する行政指導=申請者が従う意思がない旨を表明したのに継続して権利行使を妨げてはならない(33条)。趣旨・内容・責任者を明確に示す。書面の交付を求められたら原則交付。</li><li><b>中止等の求め(36条の2)</b>:法律の要件に適合しない行政指導(法律に基づくもの)を受けた者は、中止等を求めることができる。</li><li><b>処分等の求め(36条の3)</b>:<b>何人も</b>、法令違反の是正のためにされるべき処分・行政指導がされていないと思料するときは、処分等を求めることができる。</li><li><b>意見公募手続</b>:命令等を定めるときは案を公示し<b>30日以上</b>の意見提出期間。</li></ul>",
phrase:"「何人も(なんぴとも)」── 「誰でも」という意味の法律語。36条の3は「何人も」、36条の2は「行政指導の相手方」── 主体の違いがそのまま○×になります。",
point:"地方公共団体の機関がする処分のうち条例・規則に基づくもの、行政指導の全部には行政手続法は適用されない(3条3項)── 適用除外も頻出。"},
{t:"行政不服審査法:審査請求", s:"行政法",
body:"<ul><li><b>審査請求先</b>:原則、処分庁の<b>最上級行政庁</b>。上級行政庁がないときは処分庁自身。</li><li><b>期間</b>:処分があったことを知った日の翌日から起算して<b>3か月以内</b>、かつ処分の日の翌日から1年以内(正当な理由があれば例外)。</li><li><b>審理</b>:処分に関与しない<b>審理員</b>が審理し、意見書を提出→<b>行政不服審査会等への諮問</b>→裁決。口頭意見陳述の申立てが可能(審査請求人には処分庁への質問権)。</li><li><b>執行不停止の原則</b>:審査請求しても処分の効力は止まらない。重大な損害を避けるため緊急の必要があると認めるときは執行停止<b>しなければならない</b>(義務的執行停止)。</li><li><b>裁決</b>:却下・棄却(事情裁決あり)・認容。<b>不利益変更の禁止</b>。再調査の請求・再審査請求は個別法に定めがある場合のみ。</li></ul>",
phrase:"「処分があったことを知った日の<b>翌日から起算して</b>3月以内」── 初日不算入を明示する言い回し。「知った日から」と書き換えるひっかけが定番。",
point:"審理員+行政不服審査会という公正性確保の二段構えは平成26年改正の目玉で、出題が集中しています。"},
{t:"行政事件訴訟法:処分性・原告適格・訴えの利益", s:"行政法",
body:"<p>取消訴訟の三大訴訟要件です。</p><ul><li><b>処分性</b>:「公権力の主体たる国又は公共団体が行う行為のうち、その行為によって<b>直接国民の権利義務を形成しまたはその範囲を確定する</b>ことが法律上認められているもの」(判例)。肯定例=土地区画整理事業計画(判例変更)、二項道路の一括指定、病院開設中止勧告。否定例=通達、行政指導(原則)、公務員の採用内定取消し。</li><li><b>原告適格(9条)</b>:「法律上の利益を有する者」。第三者の原告適格は9条2項の考慮事項(法令の趣旨・目的、利益の内容・性質等)で判断。肯定例=新潟空港訴訟の周辺住民、もんじゅ訴訟の周辺住民。</li><li><b>訴えの利益</b>:処分の効果が消滅した後でも「回復すべき法律上の利益」があれば存続(例:運転免許停止期間経過後は消滅、再入国不許可で出国した外国人は消滅)。</li></ul>",
phrase:"「直接国民の権利義務を形成し又はその範囲を確定する」── 処分性の定義。長いですが、記述式で部分的に書かせる出題が現実にあるので音読して体に入れましょう。",
point:"処分性の肯定例・否定例の判例知識は、択一・多肢選択・記述のすべてで使う最重要ゾーン。"},
{t:"行政事件訴訟法:義務付け・差止め・執行停止", s:"行政法",
body:"<ul><li><b>非申請型義務付け訴訟(3条6項1号)</b>:一定の処分がされないことにより<b>重大な損害を生ずるおそれ</b>があり、かつ、<b>その損害を避けるため他に適当な方法がない</b>とき(補充性)。原告適格は法律上の利益を有する者。</li><li><b>申請型義務付け訴訟(同2号)</b>:申請・審査請求をした者が原告。不作為型=不作為の違法確認の訴えを併合提起/拒否処分型=取消訴訟または無効等確認訴訟を<b>併合提起</b>しなければならない。</li><li><b>差止訴訟(3条7項)</b>:一定の処分・裁決がされようとしている場合に、されることにより<b>重大な損害を生ずるおそれ</b>があるとき(他に適当な方法があるときを除く)。</li><li><b>執行停止(25条)</b>:取消訴訟の提起+<b>重大な損害を避けるため緊急の必要</b>。内閣総理大臣の異議の制度あり。<b>仮の義務付け・仮の差止め</b>=「償うことのできない損害を避けるため緊急の必要」(より厳格)。</li></ul>",
phrase:"「重大な損害」(義務付け・差止め・執行停止)と「償うことのできない損害」(仮の義務付け・仮の差止め)── 損害の程度を表す言い回しのランク差がそのまま試験に出ます。",
point:"申請型義務付け訴訟の「併合提起」は記述式の出題実績あり。非申請型との要件の違いを表で整理。"},
{t:"国家賠償法・損失補償", s:"行政法",
body:"<ul><li><b>国賠1条</b>:公権力の行使に当たる<b>公務員</b>が、<b>職務を行うについて</b>、故意または過失によって違法に損害を加えたとき、国または公共団体が賠償。公務員個人は被害者に対し責任を負わない(判例)。公務員に<b>故意または重大な過失</b>があったときは求償可。「職務を行うについて」は外形標準説(非番の警察官の制服着用強盗事件)。</li><li><b>国賠2条</b>:<b>公の営造物の設置又は管理に瑕疵</b>(=通常有すべき安全性を欠くこと)があったための損害。<b>無過失責任</b>。河川は道路と異なり過渡的な安全性で足りる(大東水害訴訟)。供用関連瑕疵(空港騒音)も含む。</li><li><b>損失補償</b>:適法な行為による特別の犠牲に対する補償(憲法29条3項)。法律に補償規定がなくても29条3項を直接根拠に請求し得る(河川附近地制限令事件)。</li></ul>",
phrase:"「公権力の行使に当る公務員が、その職務を行うについて」── 国賠1条の主語部分。記述式では「誰が・どんな場合に・誰に求償できるか」を40字で書かせた実績があります。",
point:"国賠=違法な行為への賠償/損失補償=適法な行為への補償。この対比軸を先に固めると全体が整理できます。"},
{t:"地方自治法:直接請求・住民監査請求・住民訴訟", s:"行政法",
body:"<ul><li><b>直接請求</b>:条例の制定改廃請求=有権者の<b>1/50以上</b>→長へ(地方税の賦課徴収等に関するものは対象外)。事務監査請求=1/50以上→監査委員へ。議会の解散請求・議員・長の解職請求=原則<b>1/3以上</b>→選挙管理委員会へ(住民投票で過半数の同意)。主要公務員の解職請求=1/3以上→長へ(議会で特別多数の同意)。</li><li><b>住民監査請求(242条)</b>:<b>住民であれば1人でも可</b>(選挙権不要・法人も可)。違法または不当な財務会計上の行為を対象に、行為のあった日から<b>1年以内</b>(正当な理由を除く)。</li><li><b>住民訴訟(242条の2)</b>:<b>監査請求を経た住民</b>が、違法な財務会計行為について提起(不当は対象外)。4号請求(長や職員への損害賠償請求等を求める請求)が中心。</li></ul>",
phrase:"「違法<b>又は不当</b>な財務会計上の行為」(監査請求)と「違法な行為」(住民訴訟)── 監査請求は不当まで争えるが、訴訟は違法のみ。1語の差が得点差になります。",
point:"数字(1/50と1/3)、請求先、監査請求前置主義── 地方自治法はこの3点セットの正確な暗記で確実に取れる分野。"},
{t:"地方自治法:条例・自治体の組織", s:"行政法",
body:"<ul><li><b>条例制定権</b>:「法律の範囲内」(憲法94条)=法令と条例の趣旨・目的・内容・効果を比較して矛盾抵触があるかで判断(徳島市公安条例事件)。上乗せ・横出し条例も法令の趣旨次第で適法。</li><li><b>罰則</b>:条例には<b>2年以下の懲役・禁錮、100万円以下の罰金</b>、拘留、科料、5万円以下の<b>過料</b>を設けられる。長の規則には5万円以下の過料のみ。</li><li><b>議会と長</b>:長は議決に異議があれば<b>再議</b>に付せる(一般的拒否権:再議決には出席議員の2/3)。議会の不信任議決(出席3/4以上の同意等)→長は10日以内に解散可、しなければ失職。</li><li><b>専決処分</b>:議会が成立しないとき等に長が議決すべき事件を処理→次の会議で報告し<b>承認を求める</b>。</li></ul>",
phrase:"「法律の範囲内で条例を制定することができる」── 単なる文言の一致ではなく「趣旨・目的・内容・効果の矛盾抵触」で判断するのが徳島市公安条例事件の言い回し。",
point:"再議・不信任・専決処分など議会と長の関係は数字込みで頻出。国の議院内閣制との違い(長も住民が直接選挙)を意識。"},
{t:"会社法:株式会社の機関", s:"商法",
body:"<ul><li><b>株主総会</b>:取締役会設置会社では、会社法と定款に定めた事項のみ決議(非設置会社は万能機関)。普通決議・特別決議(定款変更・事業譲渡・解散等=議決権の過半数出席+2/3以上)。</li><li><b>取締役・取締役会</b>:取締役会は<b>3人以上</b>。代表取締役の選定、重要な財産の処分等は取締役会の専決(取締役に委任不可)。利益相反取引・競業取引は取締役会(非設置では株主総会)の承認。</li><li><b>監査役</b>:業務監査+会計監査。任期は原則4年(短縮不可)。</li><li><b>公開会社</b>:発行する全部または一部の株式に譲渡制限が<b>ない</b>会社。公開会社は取締役会設置が義務。大会社(資本金5億円以上または負債200億円以上)は会計監査人が必須。</li></ul>",
phrase:"「公開会社」=上場会社のことではない!「譲渡制限のない株式を1株でも発行できる会社」という会社法独自の定義。日常語とのズレを問うのが商法の定番。",
point:"商法・会社法は5問中、機関設計と設立から3問程度。深追いせず「機関」と「設立」だけ確実に。"},
{t:"会社法:設立・株式/商法総則", s:"商法",
body:"<ul><li><b>設立</b>:発起設立(発起人が全株引受け)と募集設立。発起人は<b>1人でも可</b>、各自1株以上引受け義務。定款は公証人の認証が必要。<b>変態設立事項</b>(現物出資・財産引受け等)は定款に記載しないと効力を生じない。設立時の払込みを仮装した発起人は支払義務。</li><li><b>株式</b>:株主平等原則。<b>株主名簿の名義書換</b>が会社への対抗要件。単元株・種類株式。自己株式の取得は財源規制あり。</li><li><b>商法総則</b>:商人=自己の名をもって商行為をすることを業とする者。<b>商号</b>の不正目的使用の禁止。<b>名板貸し</b>=自己の商号の使用を許諾した者は、誤認して取引した相手に連帯責任。支配人=営業に関する包括的代理権(制限は善意の第三者に対抗不可)。</li></ul>",
phrase:"「自己の名をもって」=権利義務の帰属主体になること(自分の計算かどうかは別問題)。「名をもって/計算において」の対は商法・民法(問屋・委任)で繰り返し出る言い回し。",
point:"発起人は1人でもよい・定款認証が必要・現物出資は定款記載── 設立はこの基本だけで1問取れる年が多い。"},
];

{id:"q14", s:"憲法", q:"国会の臨時会は、いずれかの議院の総議員の4分の1以上の要求があれば、内閣はその召集を決定しなければならない。", a:1, e:"憲法53条。「4分の1」という数字と「決定しなければならない」という義務がポイント。"},

{id:"q19", s:"憲法", q:"裁判官は、裁判により心身の故障のために職務を執ることができないと決定された場合と公の弾劾による場合のほか、行政機関による懲戒処分によっても罷免され得る。", a:0, e:"行政機関は裁判官の懲戒処分すらできません(78条)。罷免事由は限定列挙です。"},

{id:"q38", s:"民法", q:"時効により不動産の所有権を取得した者は、時効完成前にその不動産を譲り受けて登記を備えた第三者に対し、登記がなくても所有権の取得を対抗できる。", a:1, e:"完成前の第三者は「当事者」類似の関係で、登記不要(判例)。完成後の第三者とは対抗問題になります。"},
{id:"q39", s:"民法", q:"即時取得は、不動産についても成立する。", a:0, e:"192条の対象は動産のみ。なお登記・登録で公示される登録自動車も対象外です。"},
{id:"q40", s:"民法", q:"占有改定による占有の取得では、即時取得は成立しない。", a:1, e:"判例。外観上の占有状態に変更がない占有改定では「占有を始めた」とはいえません。"},
{id:"q41", s:"民法", q:"共有物の不法占拠者に対する明渡請求は、各共有者が単独ですることができる。", a:1, e:"保存行為として単独で可能(判例)。"},
{id:"q42", s:"民法", q:"抵当権の被担保債権の利息は、登記をしていれば全額について優先弁済を受けられる。", a:0, e:"利息その他の定期金は満期となった最後の2年分のみ(375条)。後順位抵当権者等を保護する趣旨です。"},
{id:"q43", s:"民法", q:"抵当権者は、抵当不動産の賃料債権に物上代位することができるが、その払渡し前に差押えをしなければならない。", a:1, e:"372条・304条。「払渡し又は引渡しの前の差押え」が要件です。"},
{id:"q44", s:"民法", q:"更地に抵当権が設定された後、その土地上に建物が建築され、抵当権の実行により土地と建物の所有者が異なるに至った場合、法定地上権が成立する。", a:0, e:"法定地上権は「設定時に建物が存在」していることが要件。更地に設定した抵当権者の期待(更地としての価値)を保護します。"},
{id:"q45", s:"民法", q:"債務の不履行が契約その他の債務の発生原因および取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、債権者は損害賠償を請求できない。", a:1, e:"415条1項ただし書。改正で帰責事由の判断基準が明文化されました。"},
{id:"q46", s:"民法", q:"債務者に帰責事由がない場合、債権者は催告をしても契約を解除することができない。", a:0, e:"改正民法では解除に債務者の帰責事由は不要。解除は契約の拘束力からの解放の制度と整理されました。"},
{id:"q47", s:"民法", q:"催告解除において、催告期間が経過した時における債務の不履行が軽微であるときは、解除することができない。", a:1, e:"541条ただし書。軽微性の抗弁です。"},
{id:"q48", s:"民法", q:"債権者代位権は、裁判上でなければ行使することができない。", a:0, e:"代位権は裁判外でも行使できます。裁判上の行使が必須なのは詐害行為取消権(424条)。"},
{id:"q49", s:"民法", q:"債権者は、被代位権利が金銭の支払を目的とするものであるときは、相手方に対し、自己への直接の支払を求めることができる。", a:1, e:"423条の3。事実上の優先弁済機能が明文化されました。"},
{id:"q50", s:"民法", q:"詐害行為取消請求は、受益者が、その行為の時に債権者を害することを知らなかったときは、することができない。", a:1, e:"424条1項ただし書。債務者の悪意+受益者の悪意が必要です。"},
{id:"q51", s:"民法", q:"連帯債務者の一人に対する履行の請求は、他の連帯債務者に対しても効力を生ずる。", a:0, e:"改正で請求は相対的効力になりました。絶対的効力は弁済・更改・相殺・混同です。"},
{id:"q52", s:"民法", q:"保証契約は、書面でしなければその効力を生じない。", a:1, e:"446条2項。電磁的記録も書面とみなされます。"},
{id:"q53", s:"民法", q:"連帯保証人は、債権者から履行の請求を受けたとき、まず主たる債務者に催告すべき旨を請求することができる。", a:0, e:"連帯保証人には催告の抗弁・検索の抗弁がありません(454条)。"},
{id:"q54", s:"民法", q:"個人根保証契約は、極度額を定めなければその効力を生じない。", a:1, e:"465条の2。保証人保護の改正ポイントです。"},
{id:"q55", s:"民法", q:"売買の目的物の種類または品質に関する契約不適合について、買主がその不適合を知った時から1年以内にその旨を売主に通知しないときは、原則として買主は担保責任を追及できない。", a:1, e:"566条。「通知」でよく、1年以内の請求・訴え提起までは不要です。数量・権利の不適合には適用なし。"},
{id:"q56", s:"民法", q:"賃借人は、賃貸借が終了し賃借物を明け渡す前であっても、敷金の返還と明渡しの同時履行を主張できる。", a:0, e:"敷金返還は「賃貸借が終了し、かつ、賃貸物の返還を受けたとき」(622条の2)。明渡しが先履行です。"},
{id:"q57", s:"民法", q:"賃借人が賃貸人の承諾なく賃借権を譲渡した場合でも、背信行為と認めるに足りない特段の事情があるときは、賃貸人は解除できない。", a:1, e:"判例の信頼関係破壊の法理です。612条の解除権が制限されます。"},
{id:"q58", s:"民法", q:"使用者責任が成立する場合、使用者は損害を賠償した後、被用者に対してその全額を常に求償できる。", a:0, e:"判例は信義則上相当と認められる限度に求償を制限しています。"},
{id:"q59", s:"民法", q:"土地の工作物の設置または保存の瑕疵による損害について、占有者が損害の発生を防止するのに必要な注意をしたときは、所有者がその損害を賠償しなければならない。", a:1, e:"717条。占有者=中間責任(免責あり)、所有者=無過失責任の二段構造です。"},
{id:"q60", s:"民法", q:"人の生命または身体を害する不法行為による損害賠償請求権の消滅時効は、被害者が損害および加害者を知った時から3年である。", a:0, e:"生命・身体侵害の場合は5年に伸長されています(724条の2)。通常の不法行為が3年。"},
{id:"q61", s:"民法", q:"相続の放棄をするには、自己のために相続の開始があったことを知った時から3か月以内に、家庭裁判所に申述しなければならない。", a:1, e:"915条・938条。起算点は「死亡時」ではなく「知った時」です。"},
{id:"q62", s:"民法", q:"相続を放棄した者の子は、その者を代襲して相続人となる。", a:0, e:"放棄は代襲原因になりません(初めから相続人でなかったとみなされる)。代襲原因は死亡・欠格・廃除です。"},
{id:"q63", s:"民法", q:"遺留分を侵害された相続人は、受遺者に対し、遺贈された財産そのものの返還を請求することができる。", a:0, e:"改正により遺留分侵害額に相当する金銭の支払請求権になりました(1046条)。現物返還ではありません。"},
{id:"q64", s:"民法", q:"自筆証書遺言に添付する財産目録は、自書することを要しない。", a:1, e:"968条2項。目録はパソコン作成等が可能(毎葉に署名押印が必要)。本文は自書が必要です。"},
{id:"q65", s:"民法", q:"夫婦の一方が日常の家事に関して第三者と法律行為をしたときは、他の一方は、これによって生じた債務について連帯してその責任を負う。", a:1, e:"761条。日常家事債務の連帯責任です。"},
{id:"q66", s:"民法", q:"受任者は、委任の本旨に従い、自己の財産に対するのと同一の注意をもって委任事務を処理する義務を負う。", a:0, e:"受任者は善良な管理者の注意義務(644条)。「自己の財産と同一の注意」は無償受寄者(659条)です。"},
// ---- 行政法 ----
{id:"q67", s:"行政法", q:"行政行為には公定力が認められるため、当然無効の行政行為であっても、取消訴訟等で取り消されるまでは有効なものとして扱われる。", a:0, e:"瑕疵が重大かつ明白で無効の行政行為には公定力は認められず、誰でもいつでも無効を主張できます。"},
{id:"q68", s:"行政法", q:"不可変更力は、すべての行政行為に認められる効力である。", a:0, e:"不可変更力は審査請求の裁決など紛争を裁断する行為にのみ認められます。"},
{id:"q69", s:"行政法", q:"行政行為の撤回は、法律にこれを認める明文の根拠がなければ行うことができない。", a:0, e:"判例(菊田医師事件等)は、処分庁は法律の根拠がなくても撤回できるとしています。"},
{id:"q70", s:"行政法", q:"裁量処分については、裁量権の範囲を超え、またはその濫用があった場合に限り、裁判所はこれを取り消すことができる。", a:1, e:"行訴法30条の条文どおり。裁量でも逸脱・濫用は司法審査の対象です。"},
{id:"q71", s:"行政法", q:"行政代執行の対象となる義務は、他人が代わってすることのできる代替的作為義務に限られる。", a:1, e:"代執行法2条。不作為義務や非代替的作為義務は対象外です。"},
{id:"q72", s:"行政法", q:"行政代執行に要した費用は、義務者から国税滞納処分の例により徴収することができる。", a:1, e:"代執行法6条。費用は義務者負担で、強制徴収できます。"},
{id:"q73", s:"行政法", q:"即時強制とは、義務の不履行を前提として、義務者の身体または財産に直接実力を加える作用をいう。", a:0, e:"即時強制は義務を命じる暇がない場合に義務を介さず行う実力行使。義務の不履行を前提とするのは直接強制です。"},
{id:"q74", s:"行政法", q:"行政庁は、申請に対する処分の審査基準を定め、行政上特別の支障があるときを除き、これを公にしておかなければならない。", a:1, e:"行手法5条。審査基準は設定・公表とも法的義務です。"},
{id:"q75", s:"行政法", q:"行政庁は、不利益処分の処分基準を定め、かつ、これを公にしておかなければならない。", a:0, e:"処分基準の設定・公表は努力義務です(12条)。審査基準(義務)との対比が最頻出ポイント。"},
{id:"q76", s:"行政法", q:"行政庁は、申請がその事務所に到達したときは遅滞なく審査を開始しなければならず、申請書の記載に不備がある場合には、速やかに補正を求めるか、申請を拒否しなければならない。", a:1, e:"行手法7条。申請の受理拒否や放置(返戻)を許さない趣旨です。"},
{id:"q77", s:"行政法", q:"許認可を取り消す不利益処分をしようとする場合、行政庁は原則として弁明の機会を付与すれば足りる。", a:0, e:"許認可の取消し等の重い不利益処分は原則「聴聞」(13条1項1号)。弁明の機会はそれ以外の処分です。"},
{id:"q78", s:"行政法", q:"行政指導に携わる者は、その相手方が行政指導に従わなかったことを理由として、不利益な取扱いをしてはならない。", a:1, e:"行手法32条2項。行政指導は任意の協力が大前提です。"},
{id:"q79", s:"行政法", q:"法令に違反する事実があり、その是正のためにされるべき処分がされていないと思料する者は、当該処分をする権限を有する行政庁に対し、処分をすることを求めることができるが、この申出ができるのは利害関係人に限られる。", a:0, e:"処分等の求め(36条の3)は「何人も」できます。利害関係は不要です。"},
{id:"q80", s:"行政法", q:"命令等制定機関は、命令等を定めようとする場合、原則として案を公示し、30日以上の意見提出期間を定めて意見公募手続を実施しなければならない。", a:1, e:"行手法39条。30日以上という数字も頻出です。"},
{id:"q81", s:"行政法", q:"地方公共団体の機関がする処分のうち、その根拠となる規定が条例または規則に置かれているものについては、行政手続法の処分に関する規定は適用されない。", a:1, e:"行手法3条3項。根拠が法律なら適用、条例・規則なら適用除外(各自治体の行政手続条例による)。"},
{id:"q82", s:"行政法", q:"審査請求は、処分庁に上級行政庁がある場合、原則として処分庁の最上級行政庁に対してする。", a:1, e:"行審法4条。原則は最上級行政庁です。"},
{id:"q83", s:"行政法", q:"審査請求は、処分があったことを知った日の翌日から起算して60日以内にしなければならない。", a:0, e:"3か月以内です(行審法18条)。平成26年改正で60日から3か月に伸長されました。"},
{id:"q84", s:"行政法", q:"審査請求の審理は、原則として、審査庁に所属する職員のうち処分に関与しない者の中から指名された審理員が行う。", a:1, e:"行審法9条。公正性確保のための審理員制度です。"},
{id:"q85", s:"行政法", q:"審査庁は、審査請求人の不利益に当該処分を変更する裁決をすることができる。", a:0, e:"不利益変更は禁止されています(行審法48条)。"},
{id:"q86", s:"行政法", q:"再調査の請求は、法律に再調査の請求ができる旨の定めがない場合でも、処分庁に対してすることができる。", a:0, e:"再調査の請求は個別の法律に定めがある場合のみ(行審法5条)。再審査請求も同様です。"},
{id:"q87", s:"行政法", q:"判例によれば、行政処分とは、公権力の主体たる国または公共団体が行う行為のうち、その行為によって直接国民の権利義務を形成し、またはその範囲を確定することが法律上認められているものをいう。", a:1, e:"処分性の定義(東京都ごみ焼却場事件)。定義の文言は記述式対策としても必須です。"},
{id:"q88", s:"行政法", q:"判例によれば、土地区画整理事業の事業計画の決定には処分性が認められない。", a:0, e:"平成20年大法廷判決が判例変更し、処分性を肯定しました(いわゆる「青写真」判決の変更)。"},
{id:"q89", s:"行政法", q:"取消訴訟の原告適格を有する「法律上の利益を有する者」に当たるかの判断にあたり、処分の相手方以外の第三者については、処分の根拠法令の趣旨・目的や、処分において考慮されるべき利益の内容・性質等を考慮する。", a:1, e:"行訴法9条2項。小田急高架化訴訟大法廷判決を受けた明文化です。"},
{id:"q90", s:"行政法", q:"運転免許停止処分の停止期間が経過し、かつ無違反・無処分で1年を経過した後は、当該処分の取消しを求める訴えの利益は失われる。", a:1, e:"判例。処分の法的効果が消滅し、回復すべき法律上の利益もないとされました。"},
{id:"q91", s:"行政法", q:"取消訴訟は、処分があったことを知った日から6か月以内に提起しなければならず、この期間を過ぎた場合は正当な理由があっても提起できない。", a:0, e:"出訴期間は知った日から6か月ですが、「正当な理由があるとき」は例外が認められます(行訴法14条)。"},
{id:"q92", s:"行政法", q:"取消訴訟の提起があった場合、処分の執行は当然に停止される。", a:0, e:"執行不停止が原則(行訴法25条1項)。執行停止には申立てと「重大な損害を避けるため緊急の必要」が必要です。"},
{id:"q93", s:"行政法", q:"処分がされようとしている場合の差止訴訟は、処分がされることにより償うことのできない損害を生ずるおそれがあるときに限り提起できる。", a:0, e:"差止訴訟の要件は「重大な損害」(37条の4)。「償うことのできない損害」は仮の義務付け・仮の差止めの要件です。"},
{id:"q94", s:"行政法", q:"申請に対する拒否処分がされた場合に提起する義務付け訴訟(申請型)には、当該拒否処分の取消訴訟または無効等確認訴訟を併合して提起しなければならない。", a:1, e:"行訴法37条の3。併合提起が訴訟要件です。"},
{id:"q95", s:"行政法", q:"国家賠償法1条に基づき国が損害を賠償した場合、公務員に過失があれば、国はその公務員に対して求償することができる。", a:0, e:"求償できるのは公務員に「故意又は重大な過失」があったとき(1条2項)。軽過失では求償できません。"},
{id:"q96", s:"行政法", q:"判例によれば、国家賠償法1条が適用される場合、被害者は加害公務員個人に対して直接損害賠償を請求することはできない。", a:1, e:"判例は公務員個人の責任を否定しています。"},
{id:"q97", s:"行政法", q:"国家賠償法2条の営造物責任は、営造物の管理者に過失がなければ成立しない。", a:0, e:"2条は無過失責任です。「設置又は管理の瑕疵」=通常有すべき安全性の欠如があれば足ります。"},
{id:"q98", s:"行政法", q:"条例の制定または改廃の請求は、選挙権を有する者の総数の50分の1以上の連署をもって、地方公共団体の長に対して行う。", a:1, e:"地自法74条。ただし地方税の賦課徴収等に関する条例は対象外という点も頻出。"},
{id:"q99", s:"行政法", q:"住民監査請求は、当該地方公共団体の選挙権を有する者でなければすることができない。", a:0, e:"住民監査請求は住民であれば1人でも、選挙権がなくても、法人でもできます。直接請求(1/50)との混同を狙うひっかけ。"},
{id:"q100", s:"行政法", q:"住民訴訟は、住民監査請求をした住民でなければ提起できず、また、財務会計上の行為の「不当」を理由として提起することはできない。", a:1, e:"監査請求前置主義+住民訴訟は「違法」のみが対象(不当は監査請求まで)。"},
{id:"q101", s:"行政法", q:"普通地方公共団体は、条例で、2年以下の懲役・禁錮、100万円以下の罰金等の刑罰を科する旨の規定を設けることができる。", a:1, e:"地自法14条3項。長の規則は5万円以下の過料のみ、との対比も覚えましょう。"},
{id:"q102", s:"行政法", q:"判例によれば、条例が国の法令と同一の目的で規制を行う場合、法令より厳しい規制を定める条例は常に違法である。", a:0, e:"徳島市公安条例事件は、法令が全国一律の規制で満足する趣旨でなければ、いわゆる上乗せ条例も許容され得るとしました。"},
// ---- 商法 ----
{id:"q103", s:"商法", q:"株式会社の発起人は、2人以上でなければならない。", a:0, e:"発起人は1人でも設立できます。各発起人は1株以上を引き受ける義務があります。"},
{id:"q104", s:"商法", q:"株式会社の定款は、公証人の認証を受けなければ効力を生じない。", a:1, e:"会社法30条。設立時の原始定款には認証が必要です。"},

  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

/* --- 今日のメニューを決定(進捗回数ベースで順番に進む) --- */
function buildMenu(n) {
  const lecture = LECTURES[n % LECTURES.length];
  const cycle = Math.floor(n / LECTURES.length) + 1;
  // 用語3つ(順番にローテーション)
  const terms = [];
  for (let i = 0; i < 3; i++) terms.push(TERMS[(n*3 + i) % TERMS.length]);
  // ○×6問: 講義と同じ科目から優先的に
  const pool = QUIZ.filter(q => q.s === lecture.s);
  const quiz = [];
  for (let i = 0; i < 6 && i < pool.length; i++) quiz.push(pool[(n*6 + i) % pool.length]);
  // 弱点復習問題を最大2問追加
  const wrongPool = QUIZ.filter(q => state.wrong.includes(q.id) && !quiz.includes(q));
  for (let i = 0; i < 2 && i < wrongPool.length; i++) quiz.push(wrongPool[(n + i) % wrongPool.length]);
  // 記述1問
  const kijutsu = KIJUTSU[n % KIJUTSU.length];
  return { lecture, cycle, terms, quiz, kijutsu };
}

/* --- セッション進行管理 --- */
let session = null; // {menu, step, quizIdx, quizCorrect, startTime}

function startSession() {
  session = {
    menu: buildMenu(state.sessionCount),
    step: 0, quizIdx: 0, quizCorrect: 0,
    startTime: Date.now()
  };
  render();
}

const STEP_NAMES = ["用語ドリル(3分)", "今日の講義(8分)", "○×一問一答(12分)", "記述式トレーニング(7分)"];

function elapsedMin() {
  if (!session) return 0;
  return Math.floor((Date.now() - session.startTime) / 60000);
}

function stepBar(cur) {
  let h = '<div class="step-bar">';
  for (let i = 0; i < 4; i++) {
    h += '<span class="' + (i < cur ? "done" : i === cur ? "now" : "") + '"></span>';
  }
  return h + '</div><div class="muted">STEP' + (cur+1) + '/4: ' + STEP_NAMES[cur] +
    '<span class="timer">経過 ' + elapsedMin() + '分</span></div>';
}

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* --- 各画面の描画 --- */
let tab = "today";
function showTab(t) { tab = t; render(); window.scrollTo(0,0); }

function render() {
  ["today","review","dict","progress"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("active", t === tab);
  });
  const m = document.getElementById("main");
  if (tab === "today") m.innerHTML = renderToday();
  else if (tab === "review") m.innerHTML = renderReview();
  else if (tab === "dict") m.innerHTML = renderDict();
  else m.innerHTML = renderProgress();
  renderCountdown();
}

function renderCountdown() {
  const now = new Date();
  const days = Math.ceil((EXAM_DATE - now) / 86400000);
  document.getElementById("countdown").textContent =
    "令和8年度試験(2026年11月8日(日)想定)まで あと" + days + "日";
}

function renderToday() {
  const done = state.days[todayKey()];
  if (!session) {
    let h = "";
    if (done) {
      h += '<div class="card done-banner"><div class="big">✅</div>' +
        '<p><b>今日の学習は完了しています。おつかれさまでした!</b></p>' +
        '<p class="muted">○× ' + done.quizCorrect + '/' + done.quizTotal + '問正解 / 記述 ' + done.kijutsuScore + '/20点</p>' +
        '<button class="btn-ghost" onclick="startSession()">もう1セットやる(先取り学習)</button></div>';
    } else {
      const menu = buildMenu(state.sessionCount);
      h += '<div class="card"><h2>今日のメニュー(30分)</h2>' +
        '<p><span class="badge">' + menu.lecture.s + '</span><b>' + menu.lecture.t + '</b>' +
        (menu.cycle > 1 ? ' <span class="muted">(' + menu.cycle + '周目・復習)</span>' : '') + '</p>' +
        '<ul style="font-size:13px;margin:6px 0;padding-left:20px;">' +
        '<li>📝 用語ドリル 3語(3分)</li>' +
        '<li>📖 ミニ講義(8分)</li>' +
        '<li>⭕ ○×一問一答 ' + menu.quiz.length + '問(12分)</li>' +
        '<li>✍️ 記述式 1問(7分)← <b>最重要</b></li></ul>' +
        '<button class="btn-main btn-big" onclick="startSession()">▶ 今日の30分を始める</button></div>';
    }
    h += '<div class="card"><h2>このプログラムの方針</h2>' +
      '<ul style="font-size:13px;padding-left:20px;">' +
      '<li>記述式(60点分)を<b>毎日1問</b>。昨年0点 → ここが最大の伸びしろです。</li>' +
      '<li>法律特有の言い回しは<b>毎日3語</b>ずつ。講義にも「言い回しチェック」付き。</li>' +
      '<li>配点の大きい<b>行政法・民法</b>を中心に32テーマを繰り返します。</li></ul></div>';
    return h;
  }
  const st = session.step;
  if (st === 0) return renderStepTerms();
  if (st === 1) return renderStepLecture();
  if (st === 2) return renderStepQuiz();
  if (st === 3) return renderStepKijutsu();
  return renderStepDone();
}

function renderStepTerms() {
  let h = '<div class="card">' + stepBar(0) + '<h2>今日の法律用語・言い回し</h2>';
  session.menu.terms.forEach(t => {
    h += '<div class="term-box"><div class="term">' + t.t + '</div>' +
      '<div style="font-size:14px;">' + t.m + '</div>' +
      '<div class="ex">💡 ' + t.ex + '</div></div>';
  });
  h += '<p class="muted">声に出して読むと定着しやすいです。</p>' +
    '<button class="btn-main btn-big" onclick="session.step=1;render();window.scrollTo(0,0)">覚えた → 講義へ</button></div>';
  return h;
}

function renderStepLecture() {
  const L = session.menu.lecture;
  let h = '<div class="card">' + stepBar(1) +
    '<h2><span class="badge">' + L.s + '</span>' + L.t + '</h2>' +
    '<div class="lecture-body">' + L.body + '</div>' +
    '<div class="phrase-check"><b>🗣 言い回しチェック</b><br>' + L.phrase + '</div>' +
    '<div class="point-box"><b>🎯 試験ではここが出る</b><br>' + L.point + '</div>' +
    '<button class="btn-main btn-big" onclick="session.step=2;render();window.scrollTo(0,0)">読んだ → ○×問題へ</button></div>';
  return h;
}

let quizAnswered = false;
function renderStepQuiz() {
  const qs = session.menu.quiz;
  const i = session.quizIdx;
  if (i >= qs.length) { session.step = 3; return renderStepKijutsu(); }
  const q = qs[i];
  let h = '<div class="card">' + stepBar(2) +
    '<p class="muted">第' + (i+1) + '問 / 全' + qs.length + '問' +
    (state.wrong.includes(q.id) ? ' <span style="color:var(--ng)">★前回間違えた問題</span>' : '') + '</p>' +
    '<p><span class="badge">' + q.s + '</span></p>' +
    '<div class="quiz-q">' + q.q + '</div>';
  if (!quizAnswered) {
    h += '<button class="btn-ok" style="width:48%" onclick="answerQuiz(1)">⭕ 正しい</button>' +
      '<button class="btn-ng" style="width:48%" onclick="answerQuiz(0)">❌ 誤り</button>';
  } else {
    const wasCorrect = window._lastCorrect;
    h += '<div class="quiz-exp ' + (wasCorrect ? "correct" : "wrong") + '">' +
      '<b>' + (wasCorrect ? "✅ 正解!" : "❌ 不正解") + ' 答えは「' + (q.a ? "正しい" : "誤り") + '」</b><br>' + q.e + '</div>' +
      '<button class="btn-main btn-big" onclick="nextQuiz()">次へ</button>';
  }
  return h + '</div>';
}

function answerQuiz(ans) {
  const q = session.menu.quiz[session.quizIdx];
  const correct = (ans === q.a);
  window._lastCorrect = correct;
  if (correct) {
    session.quizCorrect++;
    state.wrong = state.wrong.filter(id => id !== q.id);
  } else {
    if (!state.wrong.includes(q.id)) state.wrong.push(q.id);
  }
  if (!state.subjStats[q.s]) state.subjStats[q.s] = { c: 0, t: 0 };
  state.subjStats[q.s].t++;
  if (correct) state.subjStats[q.s].c++;
  saveState();
  quizAnswered = true;
  render();
}
function nextQuiz() {
  quizAnswered = false;
  session.quizIdx++;
  render();
  window.scrollTo(0,0);
}

let kijutsuRevealed = false;
function renderStepKijutsu() {
  const k = session.menu.kijutsu;
  let h = '<div class="card">' + stepBar(3) +
    '<h2><span class="badge">' + k.s + '</span>記述式トレーニング(40字)</h2>' +
    '<div class="quiz-q" style="font-weight:normal;">' + k.q + '</div>' +
    '<p class="muted">頭の中で考えるだけでなく、<b>必ず書いて</b>ください。記述は書いた量だけ伸びます。</p>' +
    '<textarea id="kijutsu-input" oninput="countChars()" placeholder="ここに40字程度で書く"' + (kijutsuRevealed ? " readonly" : "") + '></textarea>' +
    '<div class="char-count" id="char-count">0字</div>';
  if (!kijutsuRevealed) {
    h += '<button class="btn-accent btn-big" onclick="revealKijutsu()">書けた → 模範解答を見る</button>';
  } else {
    h += '<div class="model-answer"><b>📋 模範解答</b><br>' + k.model +
      '<br><span class="muted">(' + k.model.length + '字)</span><br><br>' + k.e + '</div>' +
      '<h3>自己採点: 自分の答案に入っていたキーワードにチェック</h3>' +
      '<div class="kw-check">';
    k.kw.forEach((kw, i) => {
      h += '<label><input type="checkbox" id="kw' + i + '">' + kw + '</label>';
    });
    h += '</div><button class="btn-main btn-big" onclick="finishSession()">採点して今日の学習を終える</button>';
  }
  return h + '</div>';
}
function countChars() {
  const v = document.getElementById("kijutsu-input").value;
  document.getElementById("char-count").textContent = v.length + "字";
}
function revealKijutsu() {
  const v = document.getElementById("kijutsu-input").value;
  window._kijutsuDraft = v;
  kijutsuRevealed = true;
  render();
  document.getElementById("kijutsu-input").value = v;
  countChars();
  window.scrollTo(0, document.body.scrollHeight);
}

function finishSession() {
  const k = session.menu.kijutsu;
  let hit = 0;
  k.kw.forEach((kw, i) => { if (document.getElementById("kw" + i).checked) hit++; });
  const score = Math.round(20 * hit / k.kw.length);
  state.kijutsuScores.push(score);
  state.days[todayKey()] = {
    quizCorrect: session.quizCorrect,
    quizTotal: session.menu.quiz.length,
    kijutsuScore: score
  };
  state.sessionCount++;
  saveState();
  session.step = 4;
  window._finalScore = score;
  kijutsuRevealed = false;
  render();
  window.scrollTo(0,0);
}

function renderStepDone() {
  const d = state.days[todayKey()];
  const mins = elapsedMin();
  session = null;
  return '<div class="card done-banner"><div class="big">🎉</div>' +
    '<p><b>今日の30分、完了です!</b></p>' +
    '<p>○× ' + d.quizCorrect + '/' + d.quizTotal + '問正解<br>記述 ' + d.kijutsuScore + '/20点<br>所要時間 約' + mins + '分</p>' +
    '<p class="muted">連続学習 ' + calcStreak() + '日目</p>' +
    '<button class="btn-main" onclick="showTab(\'progress\')">進捗を見る</button></div>';
}

/* --- 弱点復習タブ --- */
let reviewIdx = -1, reviewAnswered = false;
function renderReview() {
  const pool = QUIZ.filter(q => state.wrong.includes(q.id));
  if (pool.length === 0) {
    return '<div class="card done-banner"><div class="big">💮</div><p><b>復習が必要な問題はありません。</b></p>' +
      '<p class="muted">○×で間違えた問題が自動的にここに溜まり、正解するまで出題されます。</p></div>';
  }
  if (reviewIdx < 0 || reviewIdx >= pool.length) reviewIdx = 0;
  const q = pool[reviewIdx];
  let h = '<div class="card"><h2>弱点復習(残り' + pool.length + '問)</h2>' +
    '<p><span class="badge">' + q.s + '</span></p>' +
    '<div class="quiz-q">' + q.q + '</div>';
  if (!reviewAnswered) {
    h += '<button class="btn-ok" style="width:48%" onclick="answerReview(1)">⭕ 正しい</button>' +
      '<button class="btn-ng" style="width:48%" onclick="answerReview(0)">❌ 誤り</button>';
  } else {
    const ok = window._lastCorrect;
    h += '<div class="quiz-exp ' + (ok ? "correct" : "wrong") + '"><b>' +
      (ok ? "✅ 正解!リストから外しました" : "❌ 不正解。また出題されます") +
      ' 答えは「' + (q.a ? "正しい" : "誤り") + '」</b><br>' + q.e + '</div>' +
      '<button class="btn-main btn-big" onclick="reviewAnswered=false;reviewIdx++;render();window.scrollTo(0,0)">次へ</button>';
  }
  return h + '</div>';
}
function answerReview(ans) {
  const pool = QUIZ.filter(q => state.wrong.includes(q.id));
  const q = pool[reviewIdx];
  const ok = (ans === q.a);
  window._lastCorrect = ok;
  if (ok) {
    state.wrong = state.wrong.filter(id => id !== q.id);
    reviewIdx--; // プールが縮むのでインデックス調整
  }
  saveState();
  reviewAnswered = true;
  render();
}

/* --- 用語辞典タブ --- */
function renderDict() {
  let h = '<div class="card"><h2>法律用語・言い回し辞典(全' + TERMS.length + '語)</h2>' +
    '<p class="muted">苦手な「法律の言い回し」をいつでも確認できます。タップで開きます。</p></div>';
  TERMS.forEach(t => {
    h += '<details class="dict"><summary>' + t.t + '</summary>' +
      '<div style="font-size:14px;margin-top:4px;">' + t.m + '</div>' +
      '<div class="ex">💡 ' + t.ex + '</div></details>';
  });
  return h;
}

/* --- 進捗タブ --- */
function calcStreak() {
  const d = new Date();
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    const dow = d.getDay();
    if (state.days[key]) streak++;
    else if (dow === 0 || dow === 6) { /* 土日はノーカウントで継続 */ }
    else if (i === 0) { /* 今日まだやっていなくても切れない */ }
    else break;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderProgress() {
  const total = state.sessionCount;
  const streak = calcStreak();
  const kj = state.kijutsuScores;
  const kjAvg = kj.length ? Math.round(kj.reduce((a,b)=>a+b,0) / kj.length) : 0;
  const kjRecent = kj.slice(-5);
  const kjRecentAvg = kjRecent.length ? Math.round(kjRecent.reduce((a,b)=>a+b,0) / kjRecent.length) : 0;
  let allC = 0, allT = 0;
  Object.values(state.subjStats).forEach(s => { allC += s.c; allT += s.t; });
  let h = '<div class="card"><h2>学習の記録</h2><div class="stat-grid">' +
    '<div class="stat"><div class="num">' + total + '</div><div class="lbl">累計セッション</div></div>' +
    '<div class="stat"><div class="num">' + streak + '日</div><div class="lbl">連続学習(平日)</div></div>' +
    '<div class="stat"><div class="num">' + (allT ? Math.round(100*allC/allT) : 0) + '%</div><div class="lbl">○×正答率(累計)</div></div>' +
    '<div class="stat"><div class="num">' + kjRecentAvg + '<span style="font-size:12px;">/20</span></div><div class="lbl">記述 直近5回平均</div></div>' +
    '</div></div>';
  h += '<div class="card"><h2>科目別の正答率</h2>';
  const subjects = ["基礎法学","憲法","民法","行政法","商法"];
  subjects.forEach(s => {
    const st = state.subjStats[s] || { c: 0, t: 0 };
    const pct = st.t ? Math.round(100 * st.c / st.t) : 0;
    h += '<div class="bar-row"><span class="lbl">' + s + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
      '<span style="width:70px;text-align:right;">' + pct + '%(' + st.c + '/' + st.t + ')</span></div>';
  });
  h += '<p class="muted">正答率70%未満の科目は、用語辞典と講義の読み直しを優先してください。</p></div>';
  h += '<div class="card"><h2>記述式の伸び</h2>' +
    '<p style="font-size:14px;">累計平均 <b>' + kjAvg + '/20点</b> → 直近5回平均 <b>' + kjRecentAvg + '/20点</b></p>' +
    '<p class="muted">本試験の記述は1問20点×3問=60点。1問あたり12点(キーワード6割)が当面の目標です。</p></div>';
  h += '<div class="card"><h2>📅 受験の手続き</h2>' +
    '<p style="font-size:13px;">受験申込は<b>例年7月下旬〜8月下旬</b>です。忘れると1年待ちになります。' +
    '「一般財団法人 行政書士試験研究センター」の公式サイトで日程を必ず確認してください。</p></div>';
  h += '<div class="card"><h2>データ管理</h2>' +
    '<p class="muted">学習記録はこの端末のブラウザに保存されています。</p>' +
    '<button class="btn-ghost" onclick="if(confirm(\'本当に学習記録をすべて消しますか?\')){localStorage.removeItem(LS_KEY);state=loadState();render();}">記録をリセット</button></div>';
  return h;
}

render();
</script>
</body>
</html>
