が譲渡制限株式である会社を非公開会社という。種類株式として剰余金配当、議決権制限、取得請求権付株式等がある（108条）。","ref":"会社法107条・108条","field":"商法・会社法"},{"id":"SHO-010","topic":"株主の権利","type":"ox","q":"株主は、その有する株式につき、剰余金の配当を受ける権利、残余財産の分配を受ける権利および株主総会における議決権を有するが、これらの権利の全部を与えない旨の定款の定めは効力を有しない。","a":true,"exp":"会社法105条2項。剰余金配当請求権と残余財産分配請求権の全部を与えない定めは無効である。","ref":"会社法105条","field":"商法・会社法"},{"id":"SHO-011","topic":"株主総会","type":"ox","q":"取締役会設置会社においては、株主総会は会社法に規定する事項および定款で定めた事項に限り決議をすることができる。","a":true,"exp":"会社法295条2項。取締役会を設置しない会社では、株主総会は会社に関する一切の事項について決議できる（同条1項）。","ref":"会社法295条","field":"商法・会社法"},{"id":"SHO-012","topic":"株主総会","type":"ox","q":"定款の変更、事業の全部の譲渡、資本金の額の減少および解散は、いずれも株主総会の特別決議を要する。","a":true,"exp":"会社法309条2項。特別決議は議決権の過半数を有する株主が出席し、出席株主の議決権の3分の2以上の多数による。","ref":"会社法309条2項","field":"商法・会社法"},{"id":"SHO-013","topic":"株主総会","type":"ox","q":"総株主の議決権の100分の3以上の議決権を6か月前から引き続き有する株主は、取締役に対し株主総会の招集を請求することができる。","a":true,"exp":"会社法297条1項。公開会社でない株式会社では6か月の保有期間要件は不要である（同条2項）。","ref":"会社法297条","field":"商法・会社法"},{"id":"SHO-014","topic":"機関設計","type":"ox","q":"公開会社は取締役会を置かなければならず、監査役会設置会社および監査等委員会設置会社も取締役会を置かなければならない。","a":true,"exp":"会社法327条1項。公開会社は原則として監査役を置かなければならないが、監査等委員会設置会社および指名委員会等設置会社はこの限りでない（327条2項）。","ref":"会社法327条","field":"商法・会社法"},{"id":"SHO-015","topic":"取締役","type":"ox","q":"取締役の任期は、原則として選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであるが、非公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）では定款により10年まで伸長できる。","a":true,"exp":"会社法332条。監査役の任期は原則4年で、非公開会社では10年まで伸長できる（336条）。","ref":"会社法332条・336条","field":"商法・会社法"},{"id":"SHO-016","topic":"取締役","type":"ox","q":"取締役が自己または第三者のために株式会社の事業の部類に属する取引をしようとするときは、株主総会（取締役会設置会社では取締役会）において重要な事実を開示し、その承認を受けなければならない。","a":true,"exp":"会社法356条1項1号（競業取引）、同項2号・3号（利益相反取引）。取締役会設置会社では取引後遅滞なく重要な事実を取締役会に報告しなければならない（365条2項）。","ref":"会社法356条・365条","field":"商法・会社法"},{"id":"SHO-017","topic":"取締役の責任","type":"ox","q":"取締役がその任務を怠ったときは会社に対し損害賠償責任を負い、この責任は総株主の同意がなければ免除することができない。","a":true,"exp":"会社法423条1項・424条。一部免除の制度（425条〜427条）もある。第三者に対しては悪意または重大な過失があるときに責任を負う（429条）。","ref":"会社法423条・424条・429条","field":"商法・会社法"},{"id":"SHO-018","topic":"株主代表訴訟","type":"ox","q":"6か月前から引き続き株式を有する株主は、株式会社に対し書面その他の方法により取締役の責任を追及する訴えの提起を請求することができ、請求の日から60日以内に会社が訴えを提起しないときは自ら訴えを提起することができる。","a":true,"exp":"会社法847条。公開会社でない株式会社では6か月の保有期間要件は不要である。多重代表訴訟（847条の3）の制度もある。","ref":"会社法847条","field":"商法・会社法"},{"id":"SHO-019","topic":"監査役","type":"ox","q":"監査役は取締役の職務の執行を監査するが、非公開会社（監査役会設置会社および会計監査人設置会社を除く）では、定款で監査役の監査の範囲を会計に関するものに限定することができる。","a":true,"exp":"会社法389条1項。監査役は取締役・支配人その他の使用人を兼ねることができない（335条2項）。","ref":"会社法389条・335条","field":"商法・会社法"},{"id":"SHO-020","topic":"募集株式","type":"ox","q":"公開会社が募集株式を引き受ける者の募集をする場合、募集事項の決定は原則として取締役会の決議による。","a":true,"exp":"会社法201条1項。ただし払込金額が募集株式を引き受ける者に特に有利な金額である場合は株主総会の特別決議を要する（199条3項、309条2項5号）。非公開会社では原則として株主総会の特別決議による。","ref":"会社法199条・201条","field":"商法・会社法"},{"id":"SHO-021","topic":"剰余金の配当","type":"ox","q":"株式会社は、純資産額が300万円を下回る場合には、剰余金の配当をすることができない。","a":true,"exp":"会社法458条。分配可能額を超える配当はできず（461条）、違反した場合、業務執行者等は交付を受けた金銭等の帳簿価額に相当する金銭を支払う義務を負う（462条）。","ref":"会社法458条・461条","field":"商法・会社法"},{"id":"SHO-022","topic":"持分会社","type":"ox","q":"合同会社の社員は、全員が有限責任社員である。","a":true,"exp":"会社法576条4項。合名会社は無限責任社員のみ、合資会社は無限責任社員と有限責任社員からなる。持分会社の業務執行は原則として社員が行う（590条）。","ref":"会社法576条・590条","field":"商法・会社法"},{"id":"SHO-023","topic":"組織再編","type":"ox","q":"吸収合併において消滅会社の権利義務は存続会社に包括的に承継され、消滅会社は清算手続を経ることなく解散する。","a":true,"exp":"会社法750条1項。組織再編には債権者異議手続が必要となる場合がある（789条等）。反対株主には株式買取請求権が認められる（785条等）。","ref":"会社法750条","field":"商法・会社法"},{"id":"SHO-024","topic":"設立の瑕疵","type":"ox","q":"株式会社の設立の無効は、会社成立の日から2年以内に訴えをもってのみ主張することができる。","a":true,"exp":"会社法828条1項1号。設立無効判決には対世効があるが遡及効はない（838条・839条）。","ref":"会社法828条・839条","field":"商法・会社法"},{"id":"GSH-001","topic":"業務","type":"ox","q":"行政書士は、他人の依頼を受け報酬を得て、官公署に提出する書類その他権利義務または事実証明に関する書類を作成することを業とする。","a":true,"exp":"行政書士法1条の2第1項。ただし他の法律において制限されているものについては業務を行うことができない（同条2項）。","ref":"行政書士法1条の2","field":"基礎知識（行政書士法等）"},{"id":"GSH-002","topic":"業務","type":"ox","q":"行政書士は、行政書士が作成した官公署に提出する書類に係る許認可等に関する審査請求等について、すべての行政書士が代理することができる。","a":false,"exp":"行政書士法1条の3第1項1号の不服申立て代理は、日本行政書士会連合会が実施する研修課程を修了した行政書士（特定行政書士）に限られる（同条2項）。","ref":"行政書士法1条の3","field":"基礎知識（行政書士法等）"},{"id":"GSH-003","topic":"業務の制限","type":"ox","q":"行政書士でない者は、業として行政書士法1条の2に規定する業務を行うことができないが、他の法律に別段の定めがある場合はこの限りでない。","a":true,"exp":"行政書士法19条1項（業務の制限）。違反すると1年以下の拘禁刑または100万円以下の罰金に処せられる（21条2号）。","ref":"行政書士法19条・21条","field":"基礎知識（行政書士法等）"},{"id":"GSH-004","topic":"資格","type":"ox","q":"行政書士試験に合格した者のほか、弁護士、弁理士、公認会計士、税理士となる資格を有する者は行政書士となる資格を有する。","a":true,"exp":"行政書士法2条。国または地方公共団体の公務員として行政事務を担当した期間が通算して20年（高等学校卒業者等は17年）以上になる者も資格を有する。","ref":"行政書士法2条","field":"基礎知識（行政書士法等）"},{"id":"GSH-005","topic":"登録","type":"ox","q":"行政書士となる資格を有する者が行政書士となるには、日本行政書士会連合会に備える行政書士名簿に登録を受けなければならない。","a":true,"exp":"行政書士法6条1項。登録の申請は事務所の所在地の都道府県の行政書士会を経由して行う（6条の2）。登録を受けた者は当然にその都道府県の行政書士会の会員となる（16条の5）。","ref":"行政書士法6条","field":"基礎知識（行政書士法等）"},{"id":"GSH-006","topic":"事務所","type":"ox","q":"行政書士は、その業務を行うための事務所を二以上設けることができる。","a":false,"exp":"行政書士法8条3項により、行政書士は二以上の事務所を設けてはならない。行政書士法人にはこの制限はなく、従たる事務所を設けることができる。","ref":"行政書士法8条","field":"基礎知識（行政書士法等）"},{"id":"GSH-007","topic":"義務","type":"ox","q":"行政書士は、正当な事由がある場合でなければ、依頼を拒むことができない。","a":true,"exp":"行政書士法11条（依頼に応ずる義務）。違反した場合、懲戒処分の対象となりうる。","ref":"行政書士法11条","field":"基礎知識（行政書士法等）"},{"id":"GSH-008","topic":"義務","type":"ox","q":"行政書士は、正当な理由がなく、その業務上取り扱った事項について知り得た秘密を漏らしてはならないが、行政書士でなくなった後はこの義務を負わない。","a":false,"exp":"行政書士法12条は「行政書士でなくなつた後も、また同様とする」と定めており、資格を失った後も守秘義務は存続する。違反には罰則がある（22条、親告罪）。","ref":"行政書士法12条・22条","field":"基礎知識（行政書士法等）"},{"id":"GSH-009","topic":"義務","type":"ox","q":"行政書士は、業務に関する帳簿を備え、これに事件の名称、年月日、受けた報酬の額、依頼者の住所氏名等を記載し、帳簿を閉鎖した後2年間保存しなければならない。","a":true,"exp":"行政書士法9条。また依頼に応じて作成した書類の写しの保存義務も同条に定められている。","ref":"行政書士法9条","field":"基礎知識（行政書士法等）"},{"id":"GSH-010","topic":"義務","type":"ox","q":"行政書士は、その業務に関し依頼人から受ける報酬の額を事務所の見やすい場所に掲示しなければならない。","a":true,"exp":"行政書士法10条の2第1項。報酬額は各行政書士が自由に定めるが、掲示は義務である。","ref":"行政書士法10条の2","field":"基礎知識（行政書士法等）"},{"id":"GSH-011","topic":"義務","type":"ox","q":"行政書士は、依頼人の求めがあったときは、その業務上作成した書類に職印を押さなければならない。","a":false,"exp":"行政書士法施行規則11条は、行政書士が作成した書類には記名し職印を押さなければならないと定めており、依頼人の求めの有無にかかわらず押印が必要である。","ref":"行政書士法施行規則11条","field":"基礎知識（行政書士法等）"},{"id":"GSH-012","topic":"行政書士法人","type":"ox","q":"行政書士法人の社員は、行政書士でなければならない。","a":true,"exp":"行政書士法13条の5第1項。社員は原則として法人の業務について競業避止義務を負い（13条の16）、法人の債務については無限連帯責任を負う（13条の21）。","ref":"行政書士法13条の5","field":"基礎知識（行政書士法等）"},{"id":"GSH-013","topic":"懲戒","type":"ox","q":"行政書士が行政書士法その他行政書士の業務に関する法令に違反したときは、都道府県知事は戒告、2年以内の業務の停止または業務の禁止の処分をすることができる。","a":true,"exp":"行政書士法14条。何人も違反の事実があると認めるときは都道府県知事に対し適当な措置をとることを求めることができる（14条の3）。業務の停止または禁止の処分をするには聴聞を行わなければならない（14条の4）。","ref":"行政書士法14条","field":"基礎知識（行政書士法等）"},{"id":"GSH-014","topic":"名称","type":"ox","q":"行政書士でない者は、行政書士またはこれと紛らわしい名称を用いてはならない。","a":true,"exp":"行政書士法19条の2（名称の使用制限）。違反すると100万円以下の罰金に処せられる（22条の4）。","ref":"行政書士法19条の2","field":"基礎知識（行政書士法等）"},{"id":"GSH-015","topic":"戸籍法","type":"ox","q":"出生の届出は、出生の日から14日以内（国外で出生があったときは3か月以内）にしなければならない。","a":true,"exp":"戸籍法49条1項。死亡の届出は死亡の事実を知った日から7日以内（国外にあるときは3か月以内）である（86条1項）。令和6年3月1日から戸籍に氏名の振り仮名を記載する制度が段階的に導入されている。","ref":"戸籍法49条・86条","field":"基礎知識（行政書士法等）"},{"id":"GSH-016","topic":"住民基本台帳法","type":"ox","q":"転入をした者は、転入をした日から14日以内に、転入届を市町村長に提出しなければならない。","a":true,"exp":"住民基本台帳法22条。転出届は転出をする前にあらかじめ（24条）、転居届は転居をした日から14日以内（23条）である。","ref":"住民基本台帳法22条〜24条","field":"基礎知識（行政書士法等）"},{"id":"JHK-001","topic":"個人情報の定義","type":"ox","q":"個人情報とは生存する個人に関する情報であって、当該情報に含まれる氏名、生年月日その他の記述等により特定の個人を識別することができるもの、または個人識別符号が含まれるものをいう。","a":true,"exp":"個人情報保護法2条1項。他の情報と容易に照合することができ、それにより特定の個人を識別できるものも含まれる。死者に関する情報は原則として個人情報に当たらない。","ref":"個人情報保護法2条1項","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-002","topic":"個人識別符号","type":"ox","q":"旅券番号、基礎年金番号、運転免許証番号、マイナンバーはいずれも個人識別符号に当たる。","a":true,"exp":"個人情報保護法2条2項2号および政令。指紋データ、顔認識データ、DNAの塩基配列などの身体的特徴を変換した符号も個人識別符号である（同項1号）。","ref":"個人情報保護法2条2項","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-003","topic":"要配慮個人情報","type":"ox","q":"要配慮個人情報には、人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実が含まれるが、本籍地は含まれない。","a":true,"exp":"個人情報保護法2条3項。本籍地や国籍は要配慮個人情報に当たらない。要配慮個人情報の取得には原則として本人の同意が必要であり、オプトアウトによる第三者提供もできない。","ref":"個人情報保護法2条3項・20条2項","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-004","topic":"利用目的","type":"ox","q":"個人情報取扱事業者は、個人情報を取り扱うにあたってはその利用目的をできる限り特定しなければならず、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて変更してはならない。","a":true,"exp":"個人情報保護法17条。あらかじめ本人の同意を得ないで特定された利用目的の達成に必要な範囲を超えて取り扱ってはならない（18条1項）。","ref":"個人情報保護法17条・18条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-005","topic":"第三者提供","type":"ox","q":"個人情報取扱事業者は、法令に基づく場合や人の生命・身体・財産の保護のために必要がある場合で本人の同意を得ることが困難であるときなどを除き、あらかじめ本人の同意を得ないで個人データを第三者に提供してはならない。","a":true,"exp":"個人情報保護法27条1項。委託先への提供、事業の承継に伴う提供、共同利用は第三者提供に当たらない（同条5項）。","ref":"個人情報保護法27条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-006","topic":"オプトアウト","type":"ox","q":"要配慮個人情報および不正取得された個人データは、オプトアウトの手続によって第三者に提供することができない。","a":true,"exp":"令和2年改正により、オプトアウトによる第三者提供の対象から、要配慮個人情報に加え、不正取得された個人データおよびオプトアウトにより提供された個人データが除外された（個人情報保護法27条2項）。","ref":"個人情報保護法27条2項","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-007","topic":"仮名加工情報","type":"ox","q":"仮名加工情報は、他の情報と照合しない限り特定の個人を識別することができないように加工した個人に関する情報であり、原則として第三者提供が禁止される。","a":true,"exp":"個人情報保護法2条5項・41条・42条。これに対し匿名加工情報は特定の個人を識別することができず、かつ個人情報を復元できないように加工したもので、一定の手続の下で第三者提供が可能である。","ref":"個人情報保護法2条5項・41条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-008","topic":"本人の権利","type":"ox","q":"本人は、個人情報取扱事業者に対し、保有個人データの電磁的記録の提供による方法その他事業者の定める方法による開示を請求することができる。","a":true,"exp":"個人情報保護法33条1項。令和2年改正により、開示方法を本人が指示できることとされ、第三者提供記録の開示請求も認められた（同条5項）。","ref":"個人情報保護法33条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-009","topic":"本人の権利","type":"ox","q":"本人は、保有個人データを個人情報取扱事業者が利用する必要がなくなった場合や、本人の権利または正当な利益が害されるおそれがある場合にも、利用停止等を請求することができる。","a":true,"exp":"個人情報保護法35条5項。令和2年改正により利用停止・消去等の請求権の要件が緩和された。","ref":"個人情報保護法35条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-010","topic":"漏えい報告","type":"ox","q":"個人情報取扱事業者は、個人データの漏えい等が生じ、個人の権利利益を害するおそれが大きいものとして規則で定めるものが生じたときは、個人情報保護委員会に報告するとともに本人に通知しなければならない。","a":true,"exp":"個人情報保護法26条。令和2年改正で義務化された。要配慮個人情報の漏えい、財産的被害のおそれがあるもの、不正目的によるもの、1000人を超える漏えいが対象である。","ref":"個人情報保護法26条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-011","topic":"行政機関等","type":"ox","q":"令和3年改正により、行政機関個人情報保護法および独立行政法人等個人情報保護法は個人情報保護法に統合され、地方公共団体の個人情報保護制度についても同法に共通ルールが定められた。","a":true,"exp":"デジタル社会形成整備法による令和3年改正。監督権限は個人情報保護委員会に一元化された。行政機関等については第5章に規定が置かれている。","ref":"個人情報保護法第5章","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-012","topic":"情報公開法","type":"ox","q":"行政機関情報公開法に基づく開示決定等は、開示請求があった日から30日以内にしなければならない。","a":true,"exp":"行政機関情報公開法10条1項。事務処理上の困難その他正当な理由があるときは30日以内に限り延長でき（同条2項）、著しく大量である場合の特例もある（11条）。","ref":"行政機関情報公開法10条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-013","topic":"情報公開法","type":"ox","q":"開示請求に係る行政文書に不開示情報が記録されている場合であっても、公益上特に必要があると認めるときは、行政機関の長は当該文書を開示することができる。","a":true,"exp":"行政機関情報公開法7条（公益上の理由による裁量的開示）。文書の存否を答えるだけで不開示情報を開示することとなるときは、存否を明らかにしないで拒否できる（8条、グローマー拒否）。","ref":"行政機関情報公開法7条・8条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-014","topic":"公文書管理法","type":"ox","q":"行政機関の職員は、行政機関における経緯も含めた意思決定に至る過程等を合理的に跡付け、検証することができるよう文書を作成しなければならない。","a":true,"exp":"公文書管理法4条。保存期間満了後は国立公文書館等への移管または廃棄が行われ、廃棄には内閣総理大臣の同意が必要である（8条2項）。","ref":"公文書管理法4条・8条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-015","topic":"マイナンバー","type":"ox","q":"個人番号は、社会保障、税および災害対策の分野で法律または条例に定められた事務に限って利用することができる。","a":true,"exp":"番号法9条。本人の同意があっても法定された利用目的以外に利用することはできない点が個人情報保護法と異なる。特定個人情報の提供も原則として禁止される（19条）。","ref":"番号法9条・19条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"JHK-016","topic":"情報通信用語","type":"ox","q":"電子署名法により、電磁的記録は本人による一定の要件を満たす電子署名が行われているときは、真正に成立したものと推定される。","a":true,"exp":"電子署名法3条。ほかにデジタル社会形成基本法、官民データ活用推進基本法、プロバイダ責任制限法を改組した情報流通プラットフォーム対処法などが出題範囲となる。","ref":"電子署名法3条","field":"基礎知識（情報通信・個人情報保護）"},{"id":"IPN-001","topic":"選挙制度","type":"ox","q":"衆議院議員総選挙は小選挙区比例代表並立制で行われ、小選挙区と比例代表への重複立候補が認められている。","a":true,"exp":"重複立候補者の比例名簿順位が同一の場合、小選挙区での惜敗率により当選順位が決まる。参議院は選挙区制と非拘束名簿式比例代表制（特定枠を含む）である。","ref":"公職選挙法","field":"基礎知識（一般知識）"},{"id":"IPN-002","topic":"選挙制度","type":"ox","q":"選挙権は満18歳以上の日本国民に認められ、被選挙権は衆議院議員および市町村長が満25歳以上、参議院議員および都道府県知事が満30歳以上である。","a":true,"exp":"公職選挙法9条・10条。平成27年改正により選挙権年齢が18歳以上に引き下げられた。","ref":"公職選挙法9条・10条","field":"基礎知識（一般知識）"},{"id":"IPN-003","topic":"国際機構","type":"ox","q":"国際連合の安全保障理事会は常任理事国5か国と非常任理事国10か国からなり、実質事項の決定には常任理事国すべてを含む9か国以上の賛成が必要である。","a":true,"exp":"常任理事国はアメリカ、イギリス、フランス、ロシア、中国である。常任理事国の反対（拒否権）があれば決議は成立しない。手続事項は9か国以上の賛成で足りる。","ref":"国連憲章27条","field":"基礎知識（一般知識）"},{"id":"IPN-004","topic":"国際関係","type":"ox","q":"世界貿易機関（WTO）は関税及び貿易に関する一般協定（GATT）を発展的に引き継いで1995年に設立され、紛争解決手続を備えている。","a":true,"exp":"WTOはサービス貿易（GATS）や知的財産（TRIPS）も対象とする。地域的な枠組みとしてCPTPP、RCEP、日EU経済連携協定などがある。","ref":"国際経済","field":"基礎知識（一般知識）"},{"id":"IPN-005","topic":"社会保障","type":"ox","q":"日本の公的年金は国民年金（基礎年金）と厚生年金の二階建てであり、20歳以上60歳未満のすべての居住者が国民年金の被保険者となる。","a":true,"exp":"第1号被保険者は自営業者等、第2号は被用者、第3号は第2号の被扶養配偶者である。年金財政は基本的に賦課方式で運営されている。","ref":"国民年金法","field":"基礎知識（一般知識）"},{"id":"IPN-006","topic":"社会保障","type":"ox","q":"介護保険の保険者は都道府県であり、被保険者は40歳以上の者である。","a":false,"exp":"介護保険の保険者は市町村および特別区である（介護保険法3条）。被保険者は65歳以上の第1号被保険者と、40歳以上65歳未満の医療保険加入者である第2号被保険者に分かれる。","ref":"介護保険法3条・9条","field":"基礎知識（一般知識）"},{"id":"IPN-007","topic":"財政","type":"ox","q":"日本の国の予算は一般会計と特別会計からなり、歳入不足を補うための特例公債（赤字国債）の発行には特例法の制定が必要である。","a":true,"exp":"財政法4条は原則として公債発行を禁じ、公共事業費等に充てる建設公債のみを例外的に認めている。日銀引受けも原則禁止である（財政法5条）。","ref":"財政法4条・5条","field":"基礎知識（一般知識）"},{"id":"IPN-008","topic":"租税","type":"ox","q":"消費税は間接税であり、その使途は法律上、年金、医療、介護および少子化対策の社会保障4経費に充てるものとされている。","a":true,"exp":"消費税法1条2項。所得税・法人税は直接税、酒税・たばこ税・関税は間接税である。","ref":"消費税法1条","field":"基礎知識（一般知識）"},{"id":"IPN-009","topic":"経済","type":"ox","q":"日本銀行の金融政策は政策委員会の金融政策決定会合で決定され、その目的は物価の安定を図ることを通じて国民経済の健全な発展に資することにある。","a":true,"exp":"日本銀行法1条・2条。日本銀行の役割は発券銀行、銀行の銀行、政府の銀行の三つである。","ref":"日本銀行法1条・2条","field":"基礎知識（一般知識）"},{"id":"IPN-010","topic":"環境","type":"ox","q":"パリ協定は、産業革命前からの世界の平均気温上昇を2度より十分低く保ち、1.5度に抑える努力を追求することを目標として掲げ、すべての締約国が削減目標を提出・更新する義務を負う。","a":true,"exp":"2015年に採択され2016年発効。先進国のみに削減義務を課した京都議定書と異なる。日本は2050年カーボンニュートラルを表明している。","ref":"パリ協定","field":"基礎知識（一般知識）"},{"id":"IPN-011","topic":"環境","type":"ox","q":"環境影響評価法に基づく環境アセスメントは、事業の実施前に環境への影響を調査・予測・評価し、その結果を公表して意見を聴く手続である。","a":true,"exp":"平成23年改正により、事業の位置・規模等の検討段階における配慮書手続が導入された。方法書、準備書、評価書、報告書の各段階がある。","ref":"環境影響評価法","field":"基礎知識（一般知識）"},{"id":"IPN-012","topic":"社会","type":"ox","q":"日本の人口は2008年をピークに減少局面に入っており、65歳以上人口の割合が21パーセントを超える超高齢社会に該当する。","a":true,"exp":"高齢化率7パーセント超で高齢化社会、14パーセント超で高齢社会、21パーセント超で超高齢社会と呼ばれる。合計特殊出生率の低下と生産年齢人口の減少が課題である。","ref":"人口統計","field":"基礎知識（一般知識）"},{"id":"IPN-013","topic":"行政改革","type":"ox","q":"独立行政法人は中期目標管理法人、国立研究開発法人および行政執行法人の三つに分類される。","a":true,"exp":"独立行政法人通則法。行政執行法人の役職員は国家公務員の身分を有する。指定管理者制度、PFI、市場化テストなども行政の民間活用の手法である。","ref":"独立行政法人通則法","field":"基礎知識（一般知識）"},{"id":"IPN-014","topic":"デジタル行政","type":"ox","q":"デジタル手続法（情報通信技術を活用した行政の推進等に関する法律）は、デジタルファースト、ワンスオンリー、コネクテッド・ワンストップを基本原則としている。","a":true,"exp":"令和元年制定。デジタル庁は令和3年9月にデジタル庁設置法に基づき設置された。デジタル社会形成基本法が基本理念を定めている。","ref":"デジタル手続法","field":"基礎知識（一般知識）"},{"id":"BNR-001","topic":"並べ替え","type":"mc","q":"次の文章を並べ替えて意味の通る文章にするとき、3番目にくるものはどれか。\nア　しかし、その前提には、住民が行政の活動を知りうるという条件が欠かせない。\nイ　地方自治は、住民が自らの地域のことを自ら決めるという理念に支えられている。\nウ　情報公開制度が地方公共団体において先行して整備されたのは、こうした事情による。\nエ　情報が行政の側に偏在したままでは、参加は形だけのものに終わるからである。","choices":["ア","イ","ウ","エ"],"a":3,"exp":"イ（理念の提示）→ア（しかし、前提条件）→エ（その理由）→ウ（結論）の順となる。3番目はエである。接続語「しかし」「からである」「こうした事情」が手がかりになる。","ref":"文章理解・並べ替え","field":"基礎知識（文章理解）"},{"id":"BNR-002","topic":"空欄補充","type":"mc","q":"次の文章の空欄に入る語として最も適切なものはどれか。\n「法律による行政の原理は、行政権の恣意を抑え、国民の予測可能性を確保することに意義がある。もっとも、社会の複雑化に伴い、法律ですべてを一義的に定めることは困難となり、行政に一定の（　　）を認めざるをえない場面が増えている。」","choices":["裁量","義務","責任","権限"],"a":0,"exp":"法律が一義的に定めきれない場合に行政の判断余地を認めるという文脈であるから「裁量」が入る。行政裁量の存在理由を述べた典型的な記述である。","ref":"文章理解・空欄補充","field":"基礎知識（文章理解）"},{"id":"BNR-003","topic":"要旨把握","type":"mc","q":"次の文章の趣旨として最も適切なものはどれか。\n「行政手続の整備は、処分の内容そのものを直ちに適正にするわけではない。しかし、判断の過程を可視化し、相手方に反論の機会を与えることによって、結果としてより妥当な判断が導かれる可能性を高める。手続の価値は、この間接的な作用にこそ求められるべきである。」","choices":["行政手続の整備は処分内容を直接適正化する点に価値がある","行政手続は判断過程を可視化することで結果の妥当性を高める点に価値がある","行政手続の整備は行政の負担を増やすだけで実益に乏しい","行政手続よりも事後の救済手続を充実させるべきである"],"a":1,"exp":"筆者は手続の価値を「間接的な作用」に求めている。直接適正化を否定し、可視化と反論機会を通じた結果の妥当性向上を述べているので2番目が適切である。","ref":"文章理解・要旨把握","field":"基礎知識（文章理解）"},{"id":"BNR-004","topic":"空欄補充","type":"mc","q":"次の文章の空欄に入る接続語として最も適切なものはどれか。\n「行政不服審査は簡易迅速な救済手段である。（　　）、審理の公正さを欠けば、その簡易迅速さはかえって国民の不信を招くことになる。」","choices":["したがって","ところが","もっとも","たとえば"],"a":2,"exp":"前段の長所を認めつつ留保を付け加える文脈であるから「もっとも」が適切である。「ところが」は予想外の事実を述べる場合、「したがって」は順接の帰結を述べる場合に用いる。","ref":"文章理解・接続語","field":"基礎知識（文章理解）"},{"id":"BNR-005","topic":"並べ替え","type":"mc","q":"次の文章を並べ替えて意味の通る文章にするとき、最後にくるものはどれか。\nア　その結果、権利の実現までに長い時間を要することになる。\nイ　行政処分の取消しを求める者は、まず出訴期間内に訴えを提起しなければならない。\nウ　仮の救済制度が用意されているのは、このような不都合に対処するためである。\nエ　しかも、訴えを提起しても処分の効力は当然には停止されない。","choices":["ア","イ","ウ","エ"],"a":2,"exp":"イ（前提）→エ（しかも、追加の不利益）→ア（その結果）→ウ（制度の趣旨）の順である。最後はウとなる。「このような不都合」が前文を受けている点が手がかりである。","ref":"文章理解・並べ替え","field":"基礎知識（文章理解）"},{"id":"KJT-001","topic":"行政法","type":"desc","sec":300,"q":"Aは、B県知事から営業許可の取消処分を受けた。判決が確定するまでの間、処分の効力を暫定的に止めるには、行政事件訴訟法上どのような申立てをすればよいか。制度の名称、申立先、中心的な要件を40字程度で記述しなさい。","kata":"〔どこに〕〔何を申し立て〕、〔要件〕ことを要する。","keys":["執行停止","裁判所","重大な損害","緊急の必要"],"model":"裁判所に執行停止を申し立て、重大な損害を避けるため緊急の必要があることを要する。","exp":"行政事件訴訟法25条2項。職権ではできず申立てが必要な点、「重大な損害」「緊急の必要」の2語が得点源である。「償うことのできない損害」と書くと仮の義務付けの要件になってしまい失点する。","ref":"行政事件訴訟法25条","field":"記述式"},{"id":"KJT-002","topic":"行政法","type":"desc","sec":300,"q":"行政庁が申請により求められた許認可等を拒否する処分をする場合、行政手続法上何をしなければならないか。例外に触れつつ40字程度で記述しなさい。","kata":"〔誰に〕〔いつ〕〔何を〕しなければならない。","keys":["申請者","同時","理由","示さ"],"model":"申請者に対し、原則として当該処分と同時にその理由を示さなければならない。","exp":"行政手続法8条1項。理由提示の趣旨は、行政庁の判断の慎重合理性を担保して恣意を抑制し、あわせて不服申立ての便宜を図る点にある。「同時に」を落とさないこと。","ref":"行政手続法8条","field":"記述式"},{"id":"KJT-003","topic":"行政法","type":"desc","sec":300,"q":"行政代執行法に基づく代執行の要件について、対象となる義務の性質を含め40字程度で記述しなさい。","kata":"〔どんな義務〕の不履行について、〔要件1〕、〔要件2〕場合に行う。","keys":["代替的作為義務","著しく公益に反","他の手段","困難"],"model":"代替的作為義務の不履行を他の手段で確保することが困難で、放置が著しく公益に反する場合に行う。","exp":"行政代執行法2条。3要件のうち「代替的作為義務」「他の手段では困難」「著しく公益に反する」の3語が配点要素である。金銭納付義務や不作為義務は対象外。","ref":"行政代執行法2条","field":"記述式"},{"id":"KJT-004","topic":"行政法","type":"desc","sec":300,"q":"Aは市長に対し情報公開条例に基づく公文書の開示請求をしたが、相当期間を経ても応答がない。Aが行政事件訴訟法上とりうる訴訟を、提起の仕方を含め40字程度で記述しなさい。","kata":"〔訴訟A〕と〔訴訟B〕を〔どう〕提起すべきである。","keys":["不作為の違法確認","義務付け","併合"],"model":"不作為の違法確認訴訟と申請型義務付け訴訟を併合して提起すべきである。","exp":"行政事件訴訟法37条の3第3項1号。申請型義務付け訴訟は単独では提起できず、併合提起が訴訟要件になる。「併合」の2文字が配点の核である。","ref":"行政事件訴訟法37条の3","field":"記述式"},{"id":"KJT-005","topic":"行政法","type":"desc","sec":300,"q":"行政不服審査法において、処分庁の上級行政庁でも処分庁でもない審査庁が執行停止をする場合の特徴を、職権の可否に触れて40字程度で記述しなさい。","kata":"〔誰の〕〔何〕がある場合に限られ、〔できないこと〕。","keys":["審査請求人","申立て","職権","できない"],"model":"審査請求人の申立てがある場合に限られ、職権で執行停止をすることはできない。","exp":"行政不服審査法25条3項。この審査庁は、処分の効力等の停止以外の措置をとることもできない。上級行政庁または処分庁である場合は職権でもできる点と対比する。","ref":"行政不服審査法25条3項","field":"記述式"},{"id":"KJT-006","topic":"行政法","type":"desc","sec":300,"q":"取消訴訟の原告適格について、行政事件訴訟法9条2項が処分の相手方以外の者に関して定める考慮事項を40字程度で記述しなさい。","kata":"〔考慮事項1〕および〔考慮事項2〕を考慮して判断する。","keys":["趣旨","目的","利益の内容","性質"],"model":"当該法令の趣旨目的および処分において考慮されるべき利益の内容性質を考慮して判断する。","exp":"行政事件訴訟法9条2項。趣旨目的の考慮にあたっては関係法令の趣旨目的を参酌し、利益の考慮にあたっては害される態様程度をも勘案する。小田急高架訴訟が代表例である。","ref":"行政事件訴訟法9条2項","field":"記述式"},{"id":"KJT-007","topic":"行政法","type":"desc","sec":300,"q":"国家賠償法1条1項に基づく損害賠償責任が認められるための要件を40字程度で記述しなさい。","kata":"〔主体〕が〔場面〕、〔主観〕により〔評価〕損害を加えたこと。","keys":["公権力の行使","公務員","職務","故意","過失","違法"],"model":"公権力の行使に当たる公務員が職務を行うにつき、故意過失により違法に損害を加えたこと。","exp":"国家賠償法1条1項。公務員個人は被害者に対し直接責任を負わず、故意または重過失があるときに国等が求償できるにとどまる（同条2項）。","ref":"国家賠償法1条","field":"記述式"},{"id":"KJT-008","topic":"行政法","type":"desc","sec":300,"q":"行政手続法上、許認可等を取り消す不利益処分をしようとする場合に執るべき手続の名称と、その手続において当事者に認められる主な権利を40字程度で記述しなさい。","kata":"〔手続名〕を執る必要があり、当事者は〔権利1〕〔権利2〕ができる。","keys":["聴聞","意見","文書","閲覧"],"model":"聴聞を執る必要があり、当事者は意見を述べ、証拠書類の提出や文書等の閲覧ができる。","exp":"行政手続法13条1項1号イ、18条、20条。聴聞と弁明の振り分けは記述でも択一でも頻出である。主宰者の許可を得て行政庁の職員に質問できる点も書ける。","ref":"行政手続法13条・18条・20条","field":"記述式"},{"id":"KJT-009","topic":"行政法","type":"desc","sec":300,"q":"行政行為の職権取消しと撤回について、それぞれの理由と効果の違いを40字程度で記述しなさい。","kata":"取消しは〔理由〕により〔効果〕、撤回は〔理由〕により〔効果〕。","keys":["原始的","遡","後発","将来"],"model":"取消しは原始的瑕疵を理由に遡及して、撤回は後発的事情を理由に将来に向かって効力を失わせる。","exp":"撤回は処分庁のみが行いうる。菊田医師事件は、授益的行政行為の撤回に法令上の明文の根拠は不要とした。","ref":"行政行為の取消しと撤回","field":"記述式"},{"id":"KJT-010","topic":"行政法","type":"desc","sec":300,"q":"行政事件訴訟法が定める事情判決について、その要件と、判決において示すべき事項を40字程度で記述しなさい。","kata":"〔要件〕場合に請求を棄却し、主文で〔何を〕宣言する。","keys":["公の利益","著しい障害","棄却","主文","違法"],"model":"取消しが公の利益に著しい障害を生ずる場合に請求を棄却し、主文で処分が違法と宣言する。","exp":"行政事件訴訟法31条1項。主文で違法を宣言する点が配点要素である。無効等確認訴訟には準用されない。行政不服審査法45条3項の事情裁決と対応する。","ref":"行政事件訴訟法31条","field":"記述式"},{"id":"KJT-011","topic":"行政法","type":"desc","sec":300,"q":"Aは、X市が設置する公の施設の使用許可申請を拒否された。Aがこの拒否処分を争い、かつ使用許可を得るためにとるべき訴訟を40字程度で記述しなさい。","kata":"〔訴訟A〕と〔訴訟B〕を併合提起する。","keys":["拒否処分","取消","義務付け","併合"],"model":"拒否処分の取消訴訟と、申請型義務付け訴訟を併合して提起する。","exp":"行政事件訴訟法37条の3第1項2号・3項2号。不作為の場合は不作為の違法確認訴訟と併合、拒否処分の場合は取消訴訟または無効等確認訴訟と併合、という場合分けを書き分ける。","ref":"行政事件訴訟法37条の3","field":"記述式"},{"id":"KJT-012","topic":"行政法","type":"desc","sec":300,"q":"行政手続法が定める行政指導の中止等の求めについて、誰が、どのような場合に、何を求めることができるかを40字程度で記述しなさい。","kata":"〔誰が〕〔どんな場合に〕〔誰に〕〔何を〕求めることができる。","keys":["相手方","法律","要件に適合","中止"],"model":"行政指導の相手方は、法律に定める要件に適合しないと思料するとき、中止等を求めることができる。","exp":"行政手続法36条の2。平成26年改正の新設規定。対象は法令違反行為の是正を求める行政指導で、その根拠が法律に置かれているものに限られる。36条の3の処分等の求め（何人も可能）と対比する。","ref":"行政手続法36条の2","field":"記述式"},{"id":"KJT-013","topic":"民法","type":"desc","sec":300,"q":"AはBに対する金銭債権を有するが、Bは無資力でありながらCに対する債権を行使しない。Aがとりうる民法上の手段の名称と、行使できる範囲を40字程度で記述しなさい。","kata":"〔名称〕を行使でき、〔範囲〕に限られる。","keys":["債権者代位権","可分","自己の債権","限度"],"model":"債権者代位権を行使でき、目的が可分なときは自己の債権額の限度に限られる。","exp":"民法423条、423条の2。金銭債権の保全では債務者の無資力が要件となる。登記請求権の代位のような転用型では無資力要件は不要である。","ref":"民法423条・423条の2","field":"記述式"},{"id":"KJT-014","topic":"民法","type":"desc","sec":300,"q":"引き渡された目的物が種類または品質に関して契約の内容に適合しない場合、買主が売主に対して請求できる内容を40字程度で記述しなさい。","kata":"〔請求1〕〔請求2〕〔請求3〕〔請求4〕を請求できる。","keys":["追完","代金減額","損害賠償","解除"],"model":"履行の追完、代金の減額、損害賠償の請求および契約の解除をすることができる。","exp":"民法562条〜564条。追完が原則で、催告してなお追完がないときに代金減額ができる順序関係も書けるとよい。種類品質の不適合は知った時から1年以内の通知が必要（566条）。","ref":"民法562条〜566条","field":"記述式"},{"id":"KJT-015","topic":"民法","type":"desc","sec":300,"q":"Aが所有する甲土地をBが長期間占有した場合に、Bが所有権を時効取得するための要件を、期間の違いを含め40字程度で記述しなさい。","kata":"〔態様〕で〔期間〕占有すること。〔条件〕なら〔短い期間〕で足りる。","keys":["所有の意思","平穏","公然","20年","善意","無過失","10年"],"model":"所有の意思をもって平穏公然に20年占有すること。開始時に善意無過失なら10年で足りる。","exp":"民法162条。所有の意思、平穏、公然、継続は186条により推定される。善意無過失は占有開始時に存すれば足り、途中で悪意になっても10年で足りる。","ref":"民法162条・186条","field":"記述式"},{"id":"KJT-016","topic":"民法","type":"desc","sec":300,"q":"無権代理人AがBの代理人と称してCと契約した。Bがまだこれに対し追認も追認拒絶もしていない段階で、Cがとりうる手段を二つ、要件に触れて40字程度で記述しなさい。","kata":"〔手段1〕ができ、〔条件〕であれば〔手段2〕もできる。","keys":["催告","相当の期間","善意","取り消す"],"model":"相当の期間を定めて本人に催告でき、契約時に善意であれば契約を取り消すこともできる。","exp":"民法114条、115条。催告は善意悪意を問わずできるが、取消しは善意の相手方に限られる。確答がなければ追認を拒絶したものとみなされる点も重要である。","ref":"民法114条・115条","field":"記述式"},{"id":"KJT-017","topic":"民法","type":"desc","sec":300,"q":"Aが所有する建物の外壁が落下して通行人Bが負傷した。この建物をAから賃借して居住しているCがいる場合、民法上誰がどのような責任を負うかを40字程度で記述しなさい。","kata":"まず〔誰が〕責任を負い、〔条件〕のときは〔誰が〕〔性質〕責任を負う。","keys":["占有者","必要な注意","所有者","無過失"],"model":"まず占有者Cが責任を負い、必要な注意をしたときは所有者Aが無過失責任を負う。","exp":"民法717条1項。占有者は免責の立証ができるが、所有者の責任は免責事由のない無過失責任である。「無過失責任」の語が配点要素になる。","ref":"民法717条","field":"記述式"},{"id":"KJT-018","topic":"民法","type":"desc","sec":300,"q":"Aが所有する甲土地にBのために抵当権が設定された後、Aが甲土地上に乙建物を建築した。抵当権が実行され甲土地がCに売却された場合、乙建物について法定地上権が成立するか、理由とともに40字程度で記述しなさい。","kata":"〔結論〕。〔理由となる要件〕を欠くからである。","keys":["成立しない","設定","当時","建物","存在"],"model":"成立しない。抵当権設定当時に土地上に建物が存在していたという要件を欠くからである。","exp":"民法388条。法定地上権の第1要件である。更地に抵当権を設定した後に建物が築造された場合は成立せず、抵当権者は更地としての担保価値を把握していたことがその根拠である。","ref":"民法388条","field":"記述式"},{"id":"KJT-019","topic":"民法","type":"desc","sec":300,"q":"AはBに甲建物を賃貸していたが、Bは A の承諾を得ずにCに転貸した。Aが契約を解除できない場合があるとすれば、それはどのような場合か、判例に照らし40字程度で記述しなさい。","kata":"〔誰に対する〕〔何〕と認めるに足りない〔何〕があるとき。","keys":["背信","行為","認めるに足りない","特段の事情"],"model":"賃貸人に対する背信的行為と認めるに足りない特段の事情があるときは解除できない。","exp":"民法612条、最判昭28.9.25の信頼関係破壊の法理。「背信的行為と認めるに足りない特段の事情」という判例の言い回しをそのまま書けるかが勝負になる。","ref":"民法612条、最判昭28.9.25","field":"記述式"},{"id":"KJT-020","topic":"民法","type":"desc","sec":300,"q":"遺留分を侵害された相続人がとりうる手段について、令和元年施行の改正後の民法に基づき、請求の相手方と請求の内容を40字程度で記述しなさい。","kata":"〔誰に対し〕〔何〕に相当する〔何〕の支払を請求できる。","keys":["受遺者","受贈者","遺留分侵害額","金銭"],"model":"受遺者または受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。","exp":"民法1046条。改正前の遺留分減殺請求は物権的効果を生じたが、改正により金銭債権化された。「金銭」の語を落とすと改正前の答案になり失点する。","ref":"民法1046条","field":"記述式"},{"id":"KJT-021","topic":"民法","type":"desc","sec":300,"q":"AがBに甲土地を売却したが登記を移転しないうちに、AがCにも甲土地を売却しCが登記を備えた。BがCに所有権取得を対抗できる場合があるとすれば、Cがどのような者であるときか、40字程度で記述しなさい。","kata":"Cが〔どのような者〕であるとき。〔理由〕から〔条文〕の第三者に当たらない。","keys":["背信的悪意者","信義則","177条","第三者"],"model":"Cが背信的悪意者であるとき。信義則に反し民法177条の第三者に当たらないからである。","exp":"民法177条、最判昭43.8.2。単なる悪意者は第三者に含まれる点と区別する。背信的悪意者からの転得者は、その者自身が背信的悪意者でない限り保護される（最判平8.10.29）。","ref":"民法177条、最判昭43.8.2","field":"記述式"},{"id":"KJT-022","topic":"民法","type":"desc","sec":300,"q":"契約の解除について、改正後の民法における債務者の帰責事由の要否と、債権者に帰責事由がある場合の扱いを40字程度で記述しなさい。","kata":"〔要否〕。ただし〔条件〕のときは〔効果〕。","keys":["帰責事由","不要","債権者","解除","できない"],"model":"債務者の帰責事由は不要である。ただし債権者に帰責事由があるときは解除できない。","exp":"民法541条、543条。解除は債権者を契約の拘束力から解放する制度と位置づけ直されたため帰責事由が不要になった。損害賠償（415条）には帰責事由が必要な点と対比する。","ref":"民法541条・543条","field":"記述式"},{"id":"KJT-023","topic":"民法","type":"desc","sec":300,"q":"債権譲渡について、債務者に対する対抗要件と、債務者以外の第三者に対する対抗要件をそれぞれ40字程度で記述しなさい。","kata":"債務者には〔要件〕、第三者には〔要件〕が必要である。","keys":["譲渡人","通知","承諾","確定日付"],"model":"債務者には譲渡人の通知か債務者の承諾、第三者にはさらに確定日付のある証書が必要である。","exp":"民法467条。通知は譲渡人がするもので、譲受人がしても効力がない点が重要である。確定日付のある証書とは内容証明郵便などを指す。","ref":"民法467条","field":"記述式"},{"id":"KJT-024","topic":"民法","type":"desc","sec":300,"q":"Aの不法行為によりBが負傷した。Bにも過失があった場合の損害賠償額の調整について、債務不履行の場合との違いを含め40字程度で記述しなさい。","kata":"裁判所は〔どのように〕できる。債務不履行では〔どのように〕。","keys":["過失","考慮","任意","必要","定める"],"model":"裁判所は過失を考慮して賠償額を定めることができる。債務不履行では考慮が必要的である。","exp":"民法722条2項、418条。不法行為の過失相殺は裁量的で賠償額の減額にとどまり、責任の免除まではできない。債務不履行は必要的で責任の免除もありうる。","ref":"民法418条・722条","field":"記述式"},{"id":"TSN-001","topic":"憲法（検閲）","type":"multi","q":"次の文章の空欄ア〜エに当てはまる語句を選びなさい。\n「憲法21条2項にいう『検閲』とは、［ア］が主体となって、思想内容等の表現物を対象とし、その全部または一部の発表の禁止を目的として、対象とされる表現物を［イ］に発表前に審査したうえ、不適当と認めるものの発表を禁止することを、その特質として備えるものを指すと解すべきである。そして、憲法21条2項前段は、検閲の禁止について［ウ］を認めない趣旨を明らかにしたものと解される。これに対し、裁判所の仮処分による事前差止めは、［エ］が主体となるものであるから検閲に当たらない。」","blanks":["ア","イ","ウ","エ"],"choices":["行政権","立法権","司法権","国民","網羅的一般的","個別具体的","例外","制限","公共の福祉","私人","裁判所","警察","事後的","部分的","一切の例外","原則","国会","内閣","抽象的","選択的"],"a":[0,4,14,10],"exp":"税関検査事件（最大判昭59.12.12）。検閲の主体は行政権、審査は網羅的一般的、禁止は絶対的で一切の例外を認めない。裁判所が主体の事前差止めは検閲に当たらない（北方ジャーナル事件）。","ref":"最大判昭59.12.12","field":"多肢選択式"},{"id":"TSN-002","topic":"行政法（取消しと撤回）","type":"multi","q":"次の文章の空欄ア〜エに当てはまる語句を選びなさい。\n「行政行為の［ア］とは、行政行為に当初から瑕疵があることを理由に、その効力を行為時に［イ］して失わせることをいう。これに対し［ウ］とは、当初は適法であった行政行為について、その後に生じた事情を理由に［エ］に向かってその効力を失わせることをいい、原則として処分庁のみがこれを行うことができる。」","blanks":["ア","イ","ウ","エ"],"choices":["職権取消し","撤回","無効確認","失効","遡及","停止","将来","過去","上級庁","処分庁","変更","更新","追認","確認","中止","現在","一部","全部","公示","代執行"],"a":[0,4,1,6],"exp":"取消しは原始的瑕疵を理由とし遡及効を有し、撤回は後発的事情を理由とし将来効を有する。撤回は処分庁のみが行いうる。","ref":"行政行為の取消しと撤回","field":"多肢選択式"},{"id":"TSN-003","topic":"行政法（処分性）","type":"multi","q":"次の文章の空欄ア〜エに当てはまる語句を選びなさい。\n「行政事件訴訟法3条2項にいう行政庁の処分とは、公権力の主体たる国または公共団体が行う行為のうち、その行為によって直接［ア］の権利義務を形成しまたはその範囲を確定することが法律上認められているものをいう。この要件は一般に［イ］と呼ばれる。土地区画整理事業の事業計画の決定については、かつて［ウ］にすぎないとしてこれを否定する判例があったが、最高裁は平成20年の大法廷判決でこれを［エ］し、施行地区内の宅地所有者等の法的地位に直接的な影響が生ずることを理由に肯定した。」","blanks":["ア","イ","ウ","エ"],"choices":["国民","行政機関","原告適格","処分性","訴えの利益","青写真","確定計画","変更","維持","拡張","被告適格","公定力","抽象的","第三者","事業者","住民","否定","承認","覊束行為","裁量行為"],"a":[0,3,5,7],"exp":"処分性の定義は最判昭39.10.29（東京都ごみ焼却場事件）による。土地区画整理事業計画については最大判平20.9.10が青写真判決（最大判昭41.2.23）を変更した。","ref":"最大判平20.9.10","field":"多肢選択式"},{"id":"TSN-004","topic":"行政法（国家賠償）","type":"multi","q":"次の文章の空欄ア〜エに当てはまる語句を選びなさい。\n「国家賠償法2条1項にいう営造物の設置または管理の［ア］とは、営造物が通常有すべき［イ］を欠いていることをいい、同項の責任は［ウ］責任であると解されている。したがって、道路の管理について予算が不足していたことは［エ］とならない。」","blanks":["ア","イ","ウ","エ"],"choices":["瑕疵","欠陥","安全性","効用","無過失","過失","免責事由","違法性","故意","減額事由","抗弁","責任原因","中間責任","無過失責任の例外","不可抗力","相当性","経済性","公共性","正当事由","比例原則"],"a":[0,2,4,6],"exp":"高知落石事件（最判昭45.8.20）。営造物責任は無過失責任であり、予算不足は免責事由とならない。機能的瑕疵（供用関連瑕疵）も認められる。","ref":"最判昭45.8.20","field":"多肢選択式"},{"id":"TSN-005","topic":"憲法（違憲審査）","type":"multi","q":"次の文章の空欄ア〜エに当てはまる語句を選びなさい。\n「わが国の違憲審査制は、［ア］を前提としてその解決に必要な限度で法令の違憲審査を行う［イ］審査制であると解されている。したがって、［ウ］に法令の合憲性を判断する権限は認められない。この点を明らかにしたのが［エ］である。」","blanks":["ア","イ","ウ","エ"],"choices":["具体的事件","抽象的紛争","付随的","抽象的","客観的","抽象的一般的","警察予備隊違憲訴訟","苫米地事件","砂川事件","朝日訴訟","憲法訴訟","憲法裁判所","国民審査","統治行為","部分社会","事情判決","主観訴訟","客観訴訟","司法権","立法権"],"a":[0,2,5,6],"exp":"警察予備隊違憲訴訟（最大判昭27.10.8）。わが国の違憲審査制は具体的事件を前提とする付随的審査制であり、抽象的一般的に法令の合憲性を判断することはできない。","ref":"最大判昭27.10.8","field":"多肢選択式"},{"id":"TSN-006","topic":"行政法（行政裁量）","type":"multi","q":"次の文章の空欄ア〜エに当てはまる語句を選びなさい。\n「行政庁の裁量処分については、裁量権の範囲をこえまたはその［ア］があった場合に限り、裁判所はその処分を取り消すことができる（行政事件訴訟法30条）。裁量統制の手法としては、考慮すべき事項を考慮せず、考慮すべきでない事項を考慮したかを問う［イ］審査と、処分が社会通念上著しく妥当性を欠くかを問う［ウ］審査が知られている。前者の代表例が［エ］である。」","blanks":["ア","イ","ウ","エ"],"choices":["濫用","逸脱","懈怠","判断過程","手続","社会観念","比例原則","日光太郎杉事件","マクリーン事件","神戸税関事件","伊方原発訴訟","実体","形式","目的","効果","裁量基準","平等原則","信義則","明白性","合理性"],"a":[0,3,5,7],"exp":"行政事件訴訟法30条。判断過程統制の代表例が日光太郎杉事件（東京高判昭48.7.13）、社会観念審査の代表例が神戸税関事件（最判昭52.12.20）である。","ref":"行政事件訴訟法30条","field":"多肢選択式"},{"id":"G5A-001","topic":"外国人の人権","type":"mc5","sec":150,"q":"外国人の人権に関する次の記述のうち、最高裁判所の判例に照らし、正しいものはどれか。","choices":["外国人には、わが国の政治的意思決定またはその実施に影響を及ぼす活動等を除き、政治活動の自由の保障が及ぶ。","地方公共団体の長および議会の議員の選挙権は、永住者等の定住外国人にも憲法上保障されており、これを法律で認めないことは違憲である。","地方公共団体が、公権力行使等地方公務員への昇任が予定される管理職選考の受験資格を日本国籍を有する職員に限ることは、憲法14条1項に違反する。","社会保障上の施策において在留外国人をどのように処遇するかは憲法上一義的に定まっており、立法府に裁量の余地はない。","わが国に在留する外国人は、憲法上、外国へ一時旅行し再入国する自由を保障されている。"],"a":0,"each":["正しい。マクリーン事件（最大判昭53.10.4）。ただし在留制度の枠内で与えられているにすぎず、在留期間中の政治活動を更新の際に消極的事情として考慮することも許される。","誤り。憲法上保障されてはいない。ただし法律で付与することは憲法上禁止されていない（最判平7.2.28）。","誤り。東京都管理職試験事件（最大判平17.1.26）は、合理的な理由に基づく区別であり14条1項に違反しないとした。","誤り。塩見訴訟（最判平元.3.2）は、限られた財源の下での配分において在留外国人をどう処遇するかは立法府の広い裁量に委ねられるとした。","誤り。森川キャサリーン事件（最判平4.11.16）は、外国人に憲法上の再入国の自由は保障されないとした。"],"read":"外国人の人権は5つの判例（マクリーン・地方選挙権・管理職試験・塩見・森川）の組合せで必ず作られる。どの判例の話かを1秒で識別できれば、肢を全部読まずに切れる。","ref":"最大判昭53.10.4ほか","field":"5肢択一（憲法・行政法）"},{"id":"G5A-002","topic":"政教分離","type":"mc5","sec":150,"q":"政教分離原則に関する次の記述のうち、最高裁判所の判例に照らし、妥当でないものはどれか。","choices":["市が体育館の起工式を神式の地鎮祭として挙行し公金を支出した行為は、その目的が世俗的で効果も特定の宗教を援助助長するものではなく、宗教的活動に当たらない。","県が靖國神社等の挙行する例大祭等に際し玉串料等を公金から支出した行為は、憲法20条3項にいう宗教的活動に当たる。","市が連合町内会に対し神社の敷地として市有地を無償で使用させていた行為は、憲法89条および20条1項後段に違反する。","市が孔子等を祀る施設の敷地の使用料を全額免除した行為は、施設の性格や免除の経緯に照らし、政教分離原則に違反しない。","市が遺族会に対し忠魂碑の移設用地を無償で貸与した行為は、その目的が世俗的であり、宗教的活動に当たらない。"],"a":3,"each":["妥当。津地鎮祭事件（最大判昭52.7.13）。目的効果基準により合憲とした。","妥当。愛媛玉串料訴訟（最大判平9.4.2）。目的効果基準により違憲とした。","妥当。空知太神社事件（最大判平22.1.20）。諸般の事情を考慮し社会通念に照らして総合判断し違憲とした。","妥当でない。孔子廟訴訟（最大判令3.2.24）は、同様の総合判断の枠組みにより憲法20条3項に違反するとした。これが正解肢である。","妥当。箕面忠魂碑訴訟（最判平5.2.16）。忠魂碑は戦没者記念碑的な性格のものであるとした。"],"read":"政教分離は「合憲か違憲か」の二択で整理する。合憲は津地鎮祭・箕面忠魂碑・自衛官合祀。違憲は愛媛玉串料・空知太・孔子廟。暗記した側に入っていない肢が答えになる。","ref":"最大判令3.2.24ほか","field":"5肢択一（憲法・行政法）"},{"id":"G5A-003","topic":"表現の自由","type":"mc5","sec":150,"q":"表現の自由に関する次の記述のうち、最高裁判所の判例に照らし、正しいものはどれか。","choices":["検閲とは公権力が主体となって表現物を発表前に審査し不適当と認めるものの発表を禁止することをいい、裁判所による出版物の事前差止めもこれに含まれる。","輸入される表現物に対する税関検査は、それがすでに国外で発表済みであること等から、憲法21条2項にいう検閲に当たらない。","教科書検定は、検定不合格となった図書を一般図書として発行することをも妨げるものであるから、検閲に当たる。","報道機関の報道の自由は憲法21条の保障のもとにあるが、取材の自由は憲法上なんら尊重に値しない。","名誉侵害を理由とする出版物の事前差止めは、その対象が公職選挙の候補者に対する評価に関するものであっても、被害者の請求があれば原則として認められる。"],"a":1,"each":["誤り。税関検査事件（最大判昭59.12.12）の定義では主体は行政権であり、裁判所による事前差止めは検閲に当たらない（北方ジャーナル事件）。","正しい。税関検査事件。国外ですでに発表済みであること、発表の機会が全面的に奪われるわけではないこと、司法審査の機会があることを理由とする。","誤り。第一次家永訴訟（最判平5.3.16）は、一般図書としての発行は何ら妨げられないから検閲に当たらないとした。","誤り。博多駅事件（最大決昭44.11.26）は、取材の自由も憲法21条の精神に照らし十分尊重に値するとした。","誤り。北方ジャーナル事件（最大判昭61.6.11）は、公務員または公職選挙の候補者に対する評価に関するものについては原則として許されないとした。"],"read":"検閲の定義は「行政権が主体」「発表前」「網羅的一般的」の3要素。肢に裁判所が出てきたら検閲ではない、と機械的に処理してよい。","ref":"最大判昭59.12.12","field":"5肢択一（憲法・行政法）"},{"id":"G5A-004","topic":"国会と議員の特権","type":"mc5","sec":150,"q":"国会および国会議員に関する次の記述のうち、正しいものはどれか。","choices":["国会議員は院外における現行犯の場合を除き会期中逮捕されないが、その議院の許諾があるときは会期中であっても逮捕される。","国会議員が議院で行った演説について、所属する議院が懲罰を科すことは、憲法51条の免責特権により許されない。","内閣は、いずれかの議院の総議員の3分の1以上の要求があったときは、臨時会の召集を決定しなければならない。","参議院の緊急集会において採られた措置は、次の国会開会の後30日以内に衆議院の同意がない場合には、将来に向かって効力を失う。","法律案について参議院が衆議院と異なった議決をしたときは、両院協議会を開かなければ衆議院は再議決をすることができない。"],"a":0,"each":["正しい。憲法50条および国会法33条。院外の現行犯と議院の許諾が例外である。","誤り。免責特権は院外での民事刑事責任等を対象とし、議院内部の懲罰権（58条2項）や政党による制裁には及ばない。","誤り。憲法53条後段は「いづれかの議院の総議員の四分の一以上の要求」と定める。","誤り。憲法54条3項は「次の国会開会の後十日以内に、衆議院の同意がない場合には、その効力を失ふ」と定める。","誤り。法律案の場合、両院協議会の開催は衆議院の任意である（憲法59条3項）。必要的なのは予算、条約の承認、内閣総理大臣の指名である。"],"read":"統治の数字問題は、数字だけを拾って照合する。4分の1（臨時会）、3分の2（法律案再議決・憲法改正発議）、10日（緊急集会の同意・解散）、30日（予算の自然成立）。肢の文章は読まなくてよい。","ref":"憲法50条・53条・54条・59条","field":"5肢択一（憲法・行政法）"},{"id":"G5A-005","topic":"司法権の限界","type":"mc5","sec":150,"q":"司法権に関する次の記述のうち、最高裁判所の判例に照らし、妥当でないものはどれか。","choices":["わが国の違憲審査制は具体的事件を前提とする付随的審査制であり、裁判所が具体的事件を離れて抽象的に法令の合憲性を判断することはできない。","衆議院の解散のように直接国家統治の基本に関する高度に政治性のある国家行為については、裁判所の審査権が及ばない。","政党が党員に対して行った除名処分は政党の内部的自律に属する事項であるから、一般市民としての権利利益を侵害する場合であっても一切司法審査の対象とならない。","大学による単位授与（認定）行為は、一般市民法秩序と直接の関係を有しない内部的な問題であり、特段の事情のない限り司法審査の対象とならない。","普通地方公共団体の議会が議員に対して行う出席停止の懲罰は、司法審査の対象となる。"],"a":2,"each":["妥当。警察予備隊違憲訴訟（最大判昭27.10.8）。","妥当。苫米地事件（最大判昭35.6.8）の統治行為論である。","妥当でない。共産党袴田事件（最判昭63.12.20）は、一般市民としての権利利益を侵害する場合には、適正な手続に則ってされたか否かという点に限り司法審査が及ぶとした。これが正解肢である。","妥当。富山大学事件（最判昭52.3.15）。ただし専攻科修了の認定は司法審査の対象となる。","妥当。最大判令2.11.25が従来の判例を変更し、出席停止の懲罰も司法審査の対象となるとした。除名だけでなく出席停止も対象になった点が改正論点である。"],"read":"部分社会の法理は「原則として審査が及ばない／例外として及ぶ」の線引きを問う。肢に『一切』『常に』『まったく』があれば例外を否定しており、たいてい誤り。","ref":"最大判令2.11.25ほか","field":"5肢択一（憲法・行政法）"},{"id":"G5A-006","topic":"行政行為の効力","type":"mc5","sec":150,"q":"行政行為の効力に関する次の記述のうち、正しいものはどれか。","choices":["行政行為に重大かつ明白な瑕疵がある場合であっても、取消訴訟によらなければその効力を否定することはできない。","行政行為の違法を理由として国家賠償請求訴訟を提起するには、あらかじめ当該行政行為について取消判決または無効確認判決を得ていなければならない。","出訴期間の経過により不可争力が生じた行政行為については、処分庁が職権でこれを取り消すこともできなくなる。","審査請求に対する裁決のような争訟裁断的行為については、処分庁が自らこれを取り消すことができないという不可変更力が認められる。","行政行為には、行政庁が自ら義務の内容を強制的に実現しうるという執行力が、法律の根拠がなくても当然に認められる。"],"a":3,"each":["誤り。重大かつ明白な瑕疵がある行政行為は無効であり、公定力も出訴期間の制限も及ばない。","誤り。最判昭36.4.21は、あらかじめ取消しまたは無効確認の判決を得る必要はないとした。国家賠償は行政行為の効力を否定するものではないからである。","誤り。不可争力は私人の側から争えなくなる効力にすぎず、処分庁による職権取消しを妨げない。","正しい。不可変更力である。争訟裁断的行為の性質上、紛争を蒸し返すことが許されないことに基づく。","誤り。執行力は当然に認められるものではなく、行政代執行法などの法律の根拠を必要とする。"],"read":"行政行為の効力は4つ（公定力・不可争力・不可変更力・執行力）しかない。肢がどの効力の話かを先に決め、その効力の定義に当てはめる。定義の取り違えを狙う問題がほとんどである。","ref":"行政行為の効力","field":"5肢択一（憲法・行政法）"},{"id":"G5A-007","topic":"行政上の強制手段","type":"mc5","sec":150,"q":"行政上の強制手段に関する次の記述のうち、正しいものはどれか。","choices":["行政代執行は、代替的作為義務のほか、不作為義務の不履行に対しても直接に行うことができる。","執行罰は義務の履行があるまで反復して科すことができるが、現行法上は砂防法に例が残るにとどまる。","直接強制は、一般法である行政代執行法に基づいて行うことができる。","即時強制は、あらかじめ義務を命じ、その不履行があったことを要件として行われる。","同一の行為に対し行政刑罰と秩序罰としての過料を併科することは、憲法39条の二重処罰の禁止に違反する。"],"a":1,"each":["誤り。代執行の対象は代替的作為義務に限られる。不作為義務は、法令等により代替的作為義務に転換されない限り代執行できない。","正しい。執行罰は将来の義務履行を強制する手段であり一事不再理が妥当しないため反復科しうる。現行法上の例は砂防法36条である。","誤り。行政代執行法1条は、行政上の義務の履行確保に関しては別に法律で定めるものを除き同法の定めるところによるとしており、直接強制には個別法の根拠が必要である。","誤り。即時強制は義務の存在を前提としない点で強制執行と異なる。消防法29条の破壊消防などが例である。","誤り。最判昭39.6.5は、両者は目的・性質を異にするとして併科を認めている。"],"read":"強制手段は5つ（代執行・執行罰・直接強制・即時強制・行政罰）。各肢の冒頭の語で分類し、その手段の定義と根拠法の有無だけを照合する。全文を読む必要はない。","ref":"行政代執行法1条・2条","field":"5肢択一（憲法・行政法）"},{"id":"G5A-008","topic":"行政裁量","type":"mc5","sec":150,"q":"行政裁量に関する次の記述のうち、最高裁判所の判例に照らし、妥当でないものはどれか。","choices":["裁判所は、行政庁の裁量処分については、裁量権の範囲をこえまたはその濫用があった場合に限り、これを取り消すことができる。","個人タクシー事業の免許申請の審査にあたり、法の趣旨にそう具体的な審査基準を設定せず、申請者に主張と証拠提出の機会を与えないでされた処分は違法である。","公務員に対する懲戒処分については懲戒権者の裁量が認められ、社会観念上著しく妥当を欠いて裁量権を濫用したと認められる場合に違法となる。","原子炉設置許可処分の司法審査においては、現在の科学技術水準に照らし、調査審議に用いられた具体的審査基準に不合理な点があるかどうかを審査すべきである。","外国人の在留期間の更新の許否は法務大臣の裁量に委ねられているが、在留期間中に行った憲法上保障される政治活動を消極的な事情として考慮することは許されない。"],"a":4,"each":["妥当。行政事件訴訟法30条の定めるところである。","妥当。個人タクシー事件（最判昭46.10.28）。手続的な瑕疵を理由に裁量処分を違法とした代表例である。","妥当。神戸税関事件（最判昭52.12.20）。社会観念審査と呼ばれる。","妥当。伊方原発訴訟（最判平4.10.29）。判断過程の合理性を審査する枠組みである。","妥当でない。マクリーン事件（最大判昭53.10.4）は、在留中の合憲合法な政治活動であっても消極的な事情として考慮することが許されないわけではないとした。これが正解肢である。"],"read":"裁量の問題は事件名と結論（違法とした／適法とした）の対応だけで解ける。日光太郎杉・個人タクシー・伊方は違法または厳格審査、神戸税関・マクリーンは行政側を是認、と覚える。","ref":"行政事件訴訟法30条ほか","field":"5肢択一（憲法・行政法）"},{"id":"G5A-009","topic":"行政指導","type":"mc5","sec":150,"q":"行政指導に関する次の記述のうち、正しいものはどれか。","choices":["行政指導はその相手方の任意の協力によってのみ実現されるものであり、行政指導に従わなかったことを理由として不利益な取扱いをしてはならない。","行政指導は国民の権利義務に直接影響を及ぼす事実行為であるから、これを行うには個別の法律の根拠が必要である。","建築主が建築確認処分の留保に対しもはや同意していないことが明確になった後も、行政指導を理由に確認を留保し続けることは、当然には違法とならない。","行政指導が口頭でされた場合において、その相手方から当該行政指導の趣旨等を記載した書面の交付を求められたときであっても、行政機関はこれに応ずる必要はない。","地方公共団体の機関がする行政指導には、その根拠が法律に置かれているものに限り、行政手続法の行政指導に関する規定が適用される。"],"a":0,"each":["正しい。行政手続法32条2項の定めるところである。行政指導の一般原則として最も問われる条文である。","誤り。行政指導は非権力的事実行為であり、組織法上の根拠があれば足り、作用法上の個別の根拠は不要と解されている。","誤り。品川マンション事件（最判昭60.7.16）は、相手方が不協力の意思を真摯かつ明確に表明した場合、特段の事情がない限り確認の留保は違法となるとした。","誤り。行政手続法35条3項は、行政上特別の支障がない限り書面を交付しなければならないと定める。","誤り。行政手続法3条3項により、地方公共団体の機関がする行政指導は根拠のいかんを問わず一律に適用除外である。"],"read":"地方公共団体への行政手続法の適用は、処分と届出は根拠が法律なら適用、行政指導と命令等は一律に適用除外。この一行を覚えるだけで毎年1肢が確実に切れる。","ref":"行政手続法32条・35条・3条3項","field":"5肢択一（憲法・行政法）"},{"id":"G5A-010","topic":"行政手続法の適用範囲","type":"mc5","sec":150,"q":"行政手続法の適用範囲に関する次の記述のうち、正しいものはどれか。","choices":["地方公共団体の機関がする処分のうち、その根拠となる規定が条例に置かれているものについても、行政手続法の処分に関する規定が適用される。","地方公共団体の機関がする行政指導については、その根拠となる規定が法律に置かれているものに限り、行政手続法が適用される。","行政手続法は、処分、行政指導、届出および命令等を定める手続のほか、行政契約の締結手続についても共通的事項を定めている。","国の機関または地方公共団体もしくはその機関に対する処分で、これらの機関等がその固有の資格において相手方となるものについては、行政手続法の規定は適用されない。","地方公共団体は、行政手続法の規定が適用されない処分、行政指導および届出に関する手続について、同法の趣旨にのっとり必要な措置を講ずる法的義務を負う。"],"a":3,"each":["誤り。行政手続法3条3項により、根拠が条例・規則に置かれている処分には適用されない。","誤り。地方公共団体の機関がする行政指導は、根拠のいかんを問わず一律に適用除外である。","誤り。行政手続法1条1項が対象とするのは処分・行政指導・届出・命令等制定手続の4つであり、行政契約、行政計画、行政調査の手続は含まない。","正しい。行政手続法4条1項の定めるいわゆる固有資格の適用除外である。","誤り。行政手続法46条は「必要な措置を講ずるよう努めなければならない」と定めており、努力義務である。"],"read":"行政手続法は適用除外（3条・4条）が最頻出。『法的義務』『努めなければならない』の語尾を先に見て、義務と努力義務の入替えを探す。","ref":"行政手続法1条・3条・4条・46条","field":"5肢択一（憲法・行政法）"},{"id":"G5A-011","topic":"申請に対する処分","type":"mc5","sec":150,"q":"行政手続法が定める申請に対する処分に関する次の記述のうち、正しいものはどれか。","choices":["行政庁は標準処理期間を定めなければならず、これを定めたときは事務所における備付けその他の適当な方法により公にしておかなければならない。","行政庁は審査基準を定めるにあたり、許認可等の性質に照らしてできる限り具体的なものとしなければならない。","申請がその形式上の要件に適合しないものであるときは、行政庁は当該申請を受理しないで申請者に返戻することができる。","行政庁は、申請により求められた許認可等を拒否する処分をする場合には、処分後相当の期間内にその理由を示せば足りる。","行政庁は、申請者以外の者の利害を考慮すべきことが法令において許認可等の要件とされているものを行う場合には、公聴会を開催しなければならない。"],"a":1,"each":["誤り。標準処理期間の設定は努力義務であり（行政手続法6条）、定めた場合の公表が義務である。審査基準は設定も公表も義務（5条）という違いが問われる。","正しい。行政手続法5条2項の定めるところである。","誤り。行政手続法7条は到達主義を採り、申請が到達したときは遅滞なく審査を開始しなければならない。補正を求めるか拒否処分をするかのいずれかとなる。","誤り。行政手続法8条1項は原則として処分と同時に理由を示すべきものとする。処分後でよいのは不利益処分で差し迫った必要がある場合（14条）である。","誤り。行政手続法10条は「公聴会の開催その他の適当な方法により……意見を聴く機会を設けるよう努めなければならない」と定める努力義務である。"],"read":"申請に対する処分は、審査基準（義務・義務）、標準処理期間（努力義務・義務）、公聴会（努力義務）の3点セット。この組合せ表を頭に置き、肢の語尾だけ照合する。","ref":"行政手続法5条〜10条","field":"5肢択一（憲法・行政法）"},{"id":"G5A-012","topic":"不利益処分","type":"mc5","sec":150,"q":"行政手続法が定める不利益処分に関する次の記述のうち、正しいものはどれか。","choices":["行政庁は、不利益処分をするかどうかを判断するために必要とされる処分基準を定め、かつこれを公にしておかなければならない。","許認可等を取り消す不利益処分をしようとする場合には、弁明の機会の付与の手続によらなければならない。","不利益処分をする場合、行政庁は原則として処分と同時にその理由を示さなければならないが、理由を示さないで処分をすべき差し迫った必要がある場合は、処分後相当の期間内に示せば足りる。","弁明は、行政庁が書面ですることを認めたときを除き、口頭で行うものとされている。","行政庁は、聴聞を経てされた不利益処分についても、名あて人に対し審査請求をすることができる旨を書面で教示しなければならない。"],"a":2,"each":["誤り。処分基準の設定も公表も努力義務である（行政手続法12条1項）。審査基準が義務であるのと対照的である。","誤り。許認可等を取り消す不利益処分は聴聞によらなければならない（行政手続法13条1項1号イ）。","正しい。行政手続法14条1項ただし書および2項の定めるところである。ただし処分後に理由を示すのは、その処分を書面でするときに限られない点にも注意する。","誤り。行政手続法29条1項は、行政庁が口頭ですることを認めたときを除き弁明書の提出によるものと定めており、書面主義が原則である。","誤り。聴聞を経てされた不利益処分については審査請求をすることができないため（行政手続法27条）、教示の対象とならない。"],"read":"不利益処分は「聴聞か弁明か」を最初に判定する。許認可等の取消し、資格・地位のはく奪、役員等の解任命令の3つが聴聞。それ以外が弁明。これで2肢は瞬時に処理できる。","ref":"行政手続法12条〜14条・27条・29条","field":"5肢択一（憲法・行政法）"},{"id":"G5A-013","topic":"聴聞","type":"mc5","sec":150,"q":"行政手続法が定める聴聞に関する次の記述のうち、正しいものはどれか。","choices":["聴聞は、当該不利益処分の原因となる事実について調査を担当した職員のうちから行政庁が指名する者が主宰する。","当事者は、聴聞の期日に出頭して意見を述べ証拠書類等を提出することができるほか、主宰者の許可を得て行政庁の職員に対し質問を発することができる。","当事者は聴聞の終結の時までいつでも文書等の閲覧を求めることができ、行政庁はいかなる理由があってもこれを拒むことができない。","聴聞の当事者は、代理人を選任して手続に関与させることができない。","主宰者が作成する調書および報告書は行政庁を拘束し、行政庁はこれに反する内容の不利益処分をすることができない。"],"a":1,"each":["誤り。行政手続法19条2項は、当該不利益処分に係る事案について調査を行った者等を主宰者となることができない者として列挙している。","正しい。行政手続法20条2項。質問は主宰者に対してではなく、主宰者の許可を得て行政庁の職員に対して発する点が問われる。","誤り。行政手続法18条1項ただし書により、第三者の利益を害するおそれがあるときその他正当な理由があるときは拒むことができる。","誤り。行政手続法16条1項は代理人の選任を認めている。","誤り。行政手続法26条は、行政庁は調書の内容および報告書に記載された主宰者の意見を「十分に参酌して」処分の決定をしなければならないと定めるにとどまる。"],"read":"『いかなる理由があっても』『一切』『できない』という強い言い切りの肢は、例外規定の存在を見落とさせる罠であることが多い。語尾の強さを手がかりに優先的に疑う。","ref":"行政手続法16条〜26条","field":"5肢択一（憲法・行政法）"},{"id":"G5A-014","topic":"意見公募手続","type":"mc5","sec":150,"q":"行政手続法が定める意見公募手続に関する次の記述のうち、正しいものはどれか。","choices":["命令等制定機関は、命令等を定めようとする場合には、原則として命令等の案および関連資料をあらかじめ公示し、30日以上の意見提出期間を定めて広く一般の意見を求めなければならない。","意見公募手続の対象となる命令等には政令および省令が含まれるが、審査基準、処分基準および行政指導指針は含まれない。","命令等制定機関は、提出された意見を十分に考慮しなければならないが、考慮した結果およびその理由を公示する必要はない。","命令等制定機関が意見公募手続を実施しないで命令等を定めた場合には、その旨および理由を公示する必要はない。","意見提出期間は、やむを得ない理由があるときであっても30日を下回って定めることができない。"],"a":0,"each":["正しい。行政手続法39条1項・3項の定めるところである。","誤り。行政手続法2条8号は命令等に審査基準、処分基準、行政指導指針を含めている。","誤り。行政手続法43条1項は、命令等の公布と同時期に、提出意見および提出意見を考慮した結果とその理由を公示しなければならないと定める。","誤り。行政手続法43条4項・5項により、実施しなかった旨および理由の公示が必要である。","誤り。行政手続法40条1項により、30日以上の期間を定めることができないやむを得ない理由があるときは、理由を明らかにして短縮することができる。"],"read":"意見公募手続は数字が1つ（30日）しかない。あとは「公示しなければならない」が原則で、『必要はない』と書いてある肢はまず誤りと当たりをつけてよい。","ref":"行政手続法39条〜43条","field":"5肢択一（憲法・行政法）"},{"id":"G5B-001","topic":"審査請求","type":"mc5","sec":150,"q":"行政不服審査法が定める審査請求に関する次の記述のうち、正しいものはどれか。","choices":["処分についての審査請求は、正当な理由があるときを除き、処分があったことを知った日の翌日から起算して6か月を経過したときはすることができない。","行政庁の不作為についての審査請求は、当該不作為に係る処分について利害関係を有する者であれば誰でもすることができる。","審査請求は、他の法律または条例に口頭ですることができる旨の定めがある場合を除き、書面でしなければならない。","処分庁に上級行政庁がない場合には、審査請求をすることができず、直ちに取消訴訟を提起しなければならない。","再調査の請求および再審査請求は、法律に定めがない場合であっても、審査請求人の選択によりすることができる。"],"a":2,"each":["誤り。行政不服審査法18条1項は3か月と定める。6か月は行政事件訴訟法14条1項の取消訴訟の出訴期間である。","誤り。行政不服審査法3条により、不作為についての審査請求ができるのは法令に基づき申請をした者に限られる。","正しい。行政不服審査法19条1項の定める書面主義である。","誤り。行政不服審査法4条1号により、上級行政庁がない場合は当該処分庁が審査庁となる。","誤り。再調査の請求（5条）も再審査請求（6条）も、法律に定めがある場合にのみすることができる。"],"read":"不服審査と取消訴訟は期間を取り違えさせる問題が毎年出る。3か月・1年が不服審査、6か月・1年が取消訴訟。数字を見た瞬間にどちらの法律の話か判定する。","ref":"行政不服審査法3条・4条・18条・19条","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-002","topic":"審理手続と裁決","type":"mc5","sec":150,"q":"行政不服審査法が定める審理手続および裁決に関する次の記述のうち、正しいものはどれか。","choices":["審査庁は、審査請求がされたときは、審査庁に所属する職員のうち当該処分に関与した者を審理員として指名しなければならない。","審査請求人または参加人の申立てがあったときは、審理員は原則としてその者に口頭で意見を述べる機会を与えなければならず、申立人は審理員の許可を得て処分庁等に質問を発することができる。","審査請求が不適法である場合、審査庁は裁決で当該審査請求を棄却する。","審査庁は、審査請求に理由があると認めるときは、常に処分を取り消さなければならず、これを変更することはできない。","審査請求人または参加人は、提出書類等の閲覧を求めることはできるが、その写しの交付を求めることはできない。"],"a":1,"each":["誤り。行政不服審査法9条2項により、審査請求に係る処分に関与した者を審理員に指名することはできない。","正しい。行政不服審査法31条1項・5項。平成26年改正で導入された対審的な仕組みである。","誤り。不適法な審査請求は却下裁決となる（45条1項）。理由がない場合が棄却（同条2項）である。","誤り。審査庁が処分庁の上級行政庁または処分庁である場合は処分を変更することもできる（46条1項）。ただし不利益変更は禁止される（48条）。","誤り。平成26年改正により、写しの交付を求めることもできるようになった（38条1項）。"],"read":"不服審査は平成26年の全部改正で何が変わったかを問う問題が多い。審理員・行政不服審査会・写しの交付・質問権はすべて改正で入ったもの。『できない』と書いてあれば改正前の記述を疑う。","ref":"行政不服審査法9条・31条・38条・45条・46条","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-003","topic":"執行停止","type":"mc5","sec":150,"q":"執行停止に関する次の記述のうち、正しいものはどれか。","choices":["行政不服審査法および行政事件訴訟法のいずれにおいても、審査請求または取消訴訟の提起は処分の効力を当然に停止させる。","取消訴訟の提起があった場合、裁判所は申立てがなくても職権で執行停止をすることができる。","処分庁の上級行政庁でも処分庁でもない審査庁は、審査請求人の申立てがあった場合に限り執行停止をすることができ、職権で執行停止をすることはできない。","内閣総理大臣は、執行停止の決定があった後においては、裁判所に対し異議を述べることができない。","仮の義務付けおよび仮の差止めは、重大な損害を避けるため緊急の必要があるときに認められる。"],"a":2,"each":["誤り。いずれも執行不停止の原則を採る（行政不服審査法25条1項、行政事件訴訟法25条1項）。","誤り。行政事件訴訟法25条2項により、執行停止は申立てによる。職権による執行停止は認められない。","正しい。行政不服審査法25条3項。この審査庁は、処分の効力等以外の措置をとることもできない。","誤り。行政事件訴訟法27条1項は、執行停止の決定があった後においても異議を述べることができると定める。","誤り。仮の義務付け・仮の差止めの要件は「償うことのできない損害」である（行政事件訴訟法37条の5）。執行停止の「重大な損害」より厳しい。"],"read":"仮の救済は損害要件の言葉が決め手。執行停止は重大な損害、仮の義務付け・仮の差止めは償うことのできない損害。この2語の入替えが頻出の罠である。","ref":"行政不服審査法25条、行政事件訴訟法25条・27条・37条の5","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-004","topic":"処分性","type":"mc5","sec":150,"q":"抗告訴訟の対象となる処分性に関する次の記述のうち、最高裁判所の判例に照らし、妥当でないものはどれか。","choices":["土地区画整理事業の事業計画の決定は、施行地区内の宅地所有者等の法的地位に直接的な影響を及ぼすものであり、処分性が認められる。","病院開設中止の勧告は、行政指導として定められているものであるが、これに従わない場合には相当程度の確実さで保険医療機関の指定を受けられなくなることから、処分性が認められる。","市町村が行う地区計画の決定は、特定の個人に対する具体的な権利変動を生じさせるものであり、処分性が認められる。","食品衛生法に基づく検疫所長の食品輸入届出に対する不適合通知は、輸入許可を受けられなくなるという法的効果を有し、処分性が認められる。","関税定率法に基づく税関長の輸入禁制品該当の通知は、輸入が許されないことを法律上明らかにするものであり、処分性が認められる。"],"a":2,"each":["妥当。最大判平20.9.10が青写真判決を変更して処分性を認めた。","妥当。最判平17.7.15。行政指導の形式をとっていても実質的な法的効果を重視した。","妥当でない。最判平6.4.22は、地区計画の決定は一般的抽象的なものにとどまるとして処分性を否定した。これが正解肢である。","妥当。最判平16.4.26。","妥当。最判昭54.12.25。"],"read":"処分性は肯定例と否定例の二分暗記に尽きる。否定の代表は地区計画・用途地域指定・協議の不同意・交通反則金の通告。この4つに当たる肢が出たら否定側である。","ref":"最判平6.4.22ほか","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-005","topic":"取消訴訟の訴訟要件","type":"mc5","sec":150,"q":"取消訴訟に関する次の記述のうち、正しいものはどれか。","choices":["処分の取消しの訴えは、当該処分をした行政庁を被告として提起しなければならない。","取消訴訟は、法律に審査請求に対する裁決を経た後でなければ提起できない旨の定めがあるときを除き、審査請求をすることができる場合であっても直ちに提起することができる。","処分の取消しの訴えとその処分についての審査請求を棄却した裁決の取消しの訴えとを提起できる場合、裁決の取消しの訴えにおいて処分の違法を理由として取消しを求めることができる。","建築確認の取消しを求める訴えは、当該建築工事が完了した後においても訴えの利益が失われない。","処分の相手方以外の者の原告適格を判断するにあたっては、当該処分の根拠となる法令の規定の文言のみによって判断しなければならない。"],"a":1,"each":["誤り。平成16年改正により、処分をした行政庁の所属する国または公共団体を被告とする（行政事件訴訟法11条1項）。","正しい。行政事件訴訟法8条1項の自由選択主義である。","誤り。行政事件訴訟法10条2項の原処分主義により、裁決取消訴訟では裁決固有の瑕疵のみを主張できる。","誤り。最判昭59.10.26は、工事完了後は建築確認の法的効果が消滅するとして訴えの利益を否定した。","誤り。行政事件訴訟法9条2項は、法令の趣旨目的や考慮されるべき利益の内容性質をも考慮するものとしている。"],"read":"取消訴訟の訴訟要件は6つ（処分性・原告適格・訴えの利益・被告適格・出訴期間・裁判管轄）。肢がどの要件の話かを分類してから、その要件の条文を1つだけ思い出す。","ref":"行政事件訴訟法8条〜14条","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-006","topic":"抗告訴訟の類型","type":"mc5","sec":150,"q":"抗告訴訟の類型に関する次の記述のうち、正しいものはどれか。","choices":["申請型義務付け訴訟は、不作為の違法確認の訴えまたは拒否処分の取消訴訟等を併合して提起しなければならない。","非申請型（直接型）義務付け訴訟は、重大な損害を生ずるおそれがあれば、他に適当な方法があるときでも提起することができる。","差止めの訴えは、処分がされた後であっても、その効果が継続している限り提起することができる。","不作為の違法確認の訴えは、処分についての申請をした者のほか、当該処分につき法律上の利益を有する第三者も提起することができる。","公法上の法律関係に関する確認の訴えは、行政事件訴訟法上の抗告訴訟に含まれる。"],"a":0,"each":["正しい。行政事件訴訟法37条の3第3項の定めるところである。義務付け訴訟単独では提起できない。","誤り。行政事件訴訟法37条の2第1項は、重大な損害を生ずるおそれがあり、かつその損害を避けるため他に適当な方法がないときに限るとしている。","誤り。差止めの訴えは処分がされようとしている段階のものであり、処分後は取消訴訟によることになる。","誤り。行政事件訴訟法37条は、不作為の違法確認の訴えを提起できるのは処分または裁決についての申請をした者に限るとしている。","誤り。平成16年改正で4条に明記された当事者訴訟である。抗告訴訟ではない。"],"read":"訴訟類型は、まず抗告訴訟6類型か当事者訴訟かを仕分ける。義務付けは申請型と非申請型で要件が違い、非申請型だけが『他に適当な方法がない』という補充性を要求する。","ref":"行政事件訴訟法3条・37条・37条の2・37条の3","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-007","topic":"国家賠償法1条","type":"mc5","sec":150,"q":"国家賠償法1条に関する次の記述のうち、最高裁判所の判例に照らし、妥当でないものはどれか。","choices":["公務員が職務を行うにつき違法に他人に損害を加えた場合、被害者は当該公務員個人に対しても直接損害賠償を請求することができる。","公務員が主観的には自己の利益を図る意図で職務行為の外形を備える行為をした場合であっても、国または公共団体は損害賠償責任を負う。","国会議員の立法行為は、立法の内容が憲法の一義的な文言に違反するにもかかわらずあえて立法を行うというような例外的な場合でない限り、国家賠償法上違法の評価を受けない。","裁判官がした争訟の裁判について国家賠償法上の違法が認められるには、裁判官が違法または不当な目的をもって裁判をしたなど特別の事情が必要である。","規制権限の不行使は、その権限を定めた法令の趣旨目的に照らし著しく合理性を欠くと認められるときは、国家賠償法1条1項の適用上違法となる。"],"a":0,"each":["妥当でない。最判昭30.4.19等は、公務員個人は被害者に対し直接責任を負わないとしている。これが正解肢である。","妥当。最判昭31.11.30の外形標準説である。","妥当。在宅投票制度廃止事件（最判昭60.11.21）の枠組みである。","妥当。最判昭57.3.12。","妥当。筑豊じん肺訴訟（最判平16.4.27）、関西水俣病訴訟（最判平16.10.15）など。"],"read":"国家賠償で最も問われるのは公務員個人の責任の否定。肢に『公務員個人に対しても請求できる』とあれば、ほぼ例外なく誤りである。ここだけで1肢切れる。","ref":"最判昭30.4.19ほか","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-008","topic":"国家賠償法2条と損失補償","type":"mc5","sec":150,"q":"営造物責任および損失補償に関する次の記述のうち、最高裁判所の判例に照らし、正しいものはどれか。","choices":["国家賠償法2条1項の責任が認められるには、営造物の設置管理者に過失があったことを要する。","道路の管理に瑕疵があった場合において、その改修に要する予算が不足していたことは、管理者の免責事由となる。","営造物が供用目的に沿って利用されることにより周辺住民に被害を生じさせる場合にも、設置管理の瑕疵が認められることがある。","法令に損失補償に関する規定がない場合には、憲法29条3項を直接の根拠として補償を請求することはできない。","ため池の堤とうでの耕作を条例で禁止することにより損失が生じた場合、憲法29条3項に基づく損失補償が必要である。"],"a":2,"each":["誤り。営造物責任は無過失責任と解されている（最判昭45.8.20）。","誤り。高知落石事件（最判昭45.8.20）は、予算措置に困却するという事情は賠償責任を否定する理由とならないとした。","正しい。大阪国際空港訴訟（最大判昭56.12.16）の機能的瑕疵（供用関連瑕疵）である。国道43号線訴訟（最判平7.7.7）も同様。","誤り。河川附近地制限令事件（最大判昭43.11.27）は、憲法29条3項に基づき補償請求をする余地があるとした。","誤り。奈良県ため池条例事件（最大判昭38.6.26）は、災害防止のためのやむを得ない制約であり、補償を要しないとした。"],"read":"国賠2条は無過失責任、予算不足は免責にならない、の2点でほぼ決まる。損失補償は河川附近地（補償の余地あり）とため池条例（補償不要）の対比で覚える。","ref":"最判昭45.8.20ほか","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-009","topic":"住民の直接参政","type":"mc5","sec":150,"q":"地方自治法が定める住民の権利に関する次の記述のうち、正しいものはどれか。","choices":["条例の制定改廃の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって行うが、地方税の賦課徴収に関するものは請求できない。","事務の監査請求は、選挙権を有する者の総数の3分の1以上の者の連署をもって監査委員に対して行う。","住民監査請求は、当該普通地方公共団体の住民であることのほか、選挙権を有することが必要である。","住民訴訟は、住民監査請求を経ることなく直ちに提起することができる。","議会の解散の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって行う。"],"a":0,"each":["正しい。地方自治法74条1項。地方税の賦課徴収ならびに分担金、使用料および手数料の徴収に関するものは除外される。","誤り。事務の監査請求も50分の1以上で足りる（75条1項）。3分の1以上を要するのは議会の解散、議員・長の解職、主要公務員の解職である。","誤り。住民監査請求（242条）は住民であれば足り、選挙権の有無、国籍、年齢、法人格を問わない。1人でもできる。","誤り。地方自治法242条の2第1項は監査請求前置主義を採る。","誤り。議会の解散請求は原則として3分の1以上である（76条1項）。"],"read":"直接請求は分母の暗記で解ける。50分の1は条例制定改廃と事務監査（軽い方）、3分の1は解散と解職（人を辞めさせる方）。人を辞めさせるものは重い、と結びつける。","ref":"地方自治法74条〜76条・242条","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5B-010","topic":"議会と長","type":"mc5","sec":150,"q":"普通地方公共団体の議会と長の関係に関する次の記述のうち、正しいものはどれか。","choices":["議会の議決について異議があるときは、長は理由を示してこれを再議に付すことができるが、条例の制定改廃に関する議決を再議に付した場合、議会が出席議員の過半数で再び同じ議決をしたときはその議決が確定する。","議会において長の不信任の議決がされたときは、長は通知を受けた日から10日以内に議会を解散することができる。","長は、議会が成立しないときであっても、議会の議決すべき事件を専決処分することはできない。","長が専決処分について議会の承認を求めたが承認が得られなかったときは、当該専決処分は遡って効力を失う。","議会の議決が法令に違反すると認めるときであっても、長はこれを再議に付す義務を負わない。"],"a":1,"each":["誤り。条例の制定改廃または予算に関する議決の再議では、出席議員の3分の2以上の同意による再議決を要する（地方自治法176条3項）。","正しい。地方自治法178条1項。解散しないとき、または解散後初めて招集された議会で再び不信任の議決があったときは失職する。","誤り。地方自治法179条1項は、議会が成立しないときなどに長が専決処分をすることができると定める。","誤り。承認が得られなくても専決処分の効力に影響はない。条例・予算に関するものについては、長は速やかに必要と認める措置を講じ議会に報告する（179条4項）。","誤り。地方自治法176条4項により、法令に違反すると認めるときは再議に付さなければならない（義務的再議）。"],"read":"議会と長は数字と義務／裁量の2軸。再議は一般が過半数、条例予算が3分の2、法令違反が義務的。不信任は10日以内の解散。数字だけ拾えば足りる。","ref":"地方自治法176条・178条・179条","field":"5肢択一（行政救済法・地方自治）"},{"id":"G5C-001","topic":"意思表示","type":"mc5","sec":150,"q":"意思表示に関する次の記述のうち、民法の規定に照らし、正しいものはどれか。","choices":["錯誤による意思表示は無効であり、第三者も当該無効を主張することができる。","相手方に対する意思表示について第三者が詐欺を行った場合、相手方がその事実を知り、または知ることができたときに限り、表意者は意思表示を取り消すことができる。","第三者が強迫を行った場合、相手方が強迫の事実を知らなかったときは、表意者は意思表示を取り消すことができない。","相手方と通じてした虚偽の意思表示の無効は、善意の第三者に対しても対抗することができる。","表意者が真意ではないことを知ってした意思表示は、相手方がそれを知っていた場合であっても有効である。"],"a":1,"each":["誤り。平成29年改正により錯誤の効果は取消しとなった（民法95条1項）。取消権者は表意者等に限られる。","正しい。民法96条2項。第三者詐欺は相手方の悪意または有過失が要件である。","誤り。第三者強迫の場合は相手方の善意悪意を問わず取り消すことができる。詐欺より強く保護される。","誤り。民法94条2項により、通謀虚偽表示の無効は善意の第三者に対抗することができない。","誤り。民法93条1項ただし書により、相手方が知りまたは知ることができたときは無効となる。"],"read":"意思表示は「無効か取消しか」と「第三者保護の要件（善意／善意無過失）」の2点だけ。表にして覚え、肢ごとにどのマスの話かを当てはめる。読み込む必要はない。","ref":"民法93条〜96条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-002","topic":"代理","type":"mc5","sec":150,"q":"代理に関する次の記述のうち、民法の規定および判例に照らし、正しいものはどれか。","choices":["代理人が本人のためにすることを示さないでした意思表示は、常に本人に対して効力を生ずる。","代理人が自己または第三者の利益を図る目的で代理権の範囲内の行為をした場合、相手方がその目的を知りまたは知ることができたときは、その行為は無権代理行為とみなされる。","任意代理人は、本人の許諾がなくても、いつでも自己の責任で復代理人を選任することができる。","無権代理人の相手方は、本人が追認しない間は、契約の時に代理権がないことを知っていた場合でも契約を取り消すことができる。","無権代理人が本人を単独で相続した場合、無権代理人は本人の資格において追認を拒絶することができる。"],"a":1,"each":["誤り。民法100条により、原則として代理人自身のためにしたものとみなされる。相手方が知りまたは知ることができたときに限り本人に効力が生ずる。","正しい。民法107条の代理権の濫用である。平成29年改正で明文化された。","誤り。民法104条により、任意代理人は本人の許諾を得たときまたはやむを得ない事由があるときでなければ復代理人を選任できない。自己の責任で選任できるのは法定代理人（105条）である。","誤り。民法115条ただし書により、契約の時に代理権がないことを知っていた相手方は取消しができない。催告権（114条）は善意悪意を問わない点と区別する。","誤り。最判昭40.6.18は、本人自ら法律行為をしたのと同様の地位を生じ、追認拒絶は信義則上許されないとした。"],"read":"代理は、顕名・復代理・無権代理・表見代理の4ブロック。相手方の主観要件（善意／善意無過失／不問）がどれかを即答できるようにする。催告は不問、取消しは善意、というペアが頻出。","ref":"民法100条〜117条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-003","topic":"物権変動","type":"mc5","sec":150,"q":"不動産の物権変動に関する次の記述のうち、判例に照らし、正しいものはどれか。","choices":["不動産の二重譲渡において、第一の譲受人は、第二の譲受人が単なる悪意者である場合には、登記なくして所有権取得を対抗することができる。","背信的悪意者は民法177条の第三者に当たらず、これに対しては登記なくして所有権取得を対抗することができる。","不動産の取得時効が完成した後に原所有者から当該不動産を譲り受けて登記を備えた者に対しては、時効取得者は登記なくして時効取得を対抗することができる。","不動産の取得時効が完成する前に原所有者から当該不動産を譲り受けた者に対しては、時効取得者は登記がなければ時効取得を対抗することができない。","相続放棄をした者の債権者が、放棄前に相続財産である不動産を差し押さえて登記を備えた場合、他の相続人は登記なくしてこれに対抗することができない。"],"a":1,"each":["誤り。単なる悪意者は民法177条の第三者に含まれ、登記がなければ対抗できない。","正しい。最判昭43.8.2。信義則に反する背信的悪意者は第三者として保護されない。","誤り。時効完成後の第三者との関係は対抗問題となり、登記がなければ対抗できない（最判昭33.8.28）。","誤り。時効完成前の第三者に対しては、当事者の関係に立つため登記なくして対抗できる（最判昭41.11.22）。","誤り。相続放棄の効力は絶対的であり、放棄者の債権者が差押えをしても、他の相続人は登記なくして対抗できる（最判昭42.1.20）。遺産分割の場合（登記必要）と対比する。"],"read":"177条の問題は「対抗問題か否か」を先に決める。対抗問題なら登記が要る。当事者関係・背信的悪意者・相続放棄は対抗問題にならない、と例外側を覚える方が速い。","ref":"民法177条、最判昭43.8.2ほか","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-004","topic":"抵当権","type":"mc5","sec":150,"q":"抵当権に関する次の記述のうち、民法の規定および判例に照らし、正しいものはどれか。","choices":["抵当権の効力は、抵当権設定当時に抵当不動産に付加して一体となっていた物のほか、その従物にも及ぶ。","抵当権者は、抵当不動産の賃料債権に対して物上代位権を行使することができない。","更地に抵当権を設定した後に抵当地上に建物が築造された場合、競売により土地と建物の所有者を異にするに至ったときは法定地上権が成立する。","抵当権の被担保債権の範囲を元本確定前に変更するには、後順位抵当権者の承諾を得なければならない。","抵当建物の賃借人は、賃貸借が抵当権に対抗できない場合、買受人の買受けの時に直ちに建物を明け渡さなければならない。"],"a":0,"each":["正しい。民法370条および最判昭44.3.28。従物にも効力が及ぶ。","誤り。最判平元.10.27は賃料債権への物上代位を認めている（民法372条・304条）。","誤り。法定地上権の成立には抵当権設定当時に建物が存在することを要する（民法388条）。更地に設定した場合は成立しない。","誤り。元本確定前の被担保債権の範囲の変更には後順位抵当権者等の承諾を要しない（民法398条の4第2項）。承諾が必要なのは極度額の変更（398条の5）である。","誤り。民法395条により、買受けの時から6か月を経過するまでは引渡しが猶予される。"],"read":"抵当権は法定地上権の4要件（設定時に建物が存在・土地建物が同一所有者・抵当権設定・競売で所有者が分かれる）を即答できるかで決まる。更地と出たら成立しない、と反射で処理する。","ref":"民法370条・372条・388条・395条・398条の4","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-005","topic":"債務不履行と解除","type":"mc5","sec":150,"q":"債務不履行および契約の解除に関する次の記述のうち、民法の規定に照らし、正しいものはどれか。","choices":["契約を解除するには、債務者の責めに帰すべき事由があることを要する。","債務の不履行が債権者の責めに帰すべき事由によるものであるときは、債権者は契約を解除することができない。","債務の履行が不能である場合であっても、債権者は履行を請求することができる。","催告による解除において、催告期間を経過した時における債務の不履行が軽微であるときでも、債権者は契約を解除することができる。","当事者双方の責めに帰することができない事由によって債務の履行が不能となったときは、債権者は反対給付の履行を拒むことができない。"],"a":1,"each":["誤り。平成29年改正により、解除に債務者の帰責事由は不要となった。解除は債権者を契約の拘束力から解放する制度と位置づけられた。","正しい。民法543条の定めるところである。","誤り。民法412条の2第1項により、履行が不能であるときは履行を請求することができない。","誤り。民法541条ただし書により、不履行が軽微であるときは解除することができない。","誤り。民法536条1項により、債権者は反対給付の履行を拒むことができる。"],"read":"債権法改正は「帰責事由が要るか要らないか」の入替えが出題の中心。解除は不要、損害賠償は必要。この一行を軸に全肢を判定する。","ref":"民法412条の2・536条・541条・543条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-006","topic":"契約不適合責任","type":"mc5","sec":150,"q":"売買の契約不適合責任に関する次の記述のうち、民法の規定に照らし、正しいものはどれか。","choices":["引き渡された目的物が種類または品質に関して契約の内容に適合しない場合、買主はその不適合を知った時から1年以内にその旨を売主に通知しなければ、原則として履行の追完の請求等をすることができない。","買主は履行の追完を請求することなく、直ちに代金の減額を請求することができる。","買主が履行の追完を請求できるのは代替物の引渡しに限られ、目的物の修補を請求することはできない。","数量に関する契約不適合については、買主は不適合を知った時から1年以内に通知しなければ権利を失う。","契約不適合が買主の責めに帰すべき事由によるものであっても、買主は履行の追完を請求することができる。"],"a":0,"each":["正しい。民法566条の定めるところである。売主が引渡しの時に不適合を知り、または重大な過失により知らなかったときはこの限りでない。","誤り。民法563条1項により、相当の期間を定めて履行の追完の催告をし、その期間内に追完がない場合に代金減額請求ができる。","誤り。民法562条1項は、目的物の修補、代替物の引渡しまたは不足分の引渡しのいずれも認めている。","誤り。1年の通知期間の制限は種類または品質の不適合についてのものであり、数量の不適合および権利の不適合には適用されない。","誤り。民法562条2項により、買主の責めに帰すべき事由による不適合の場合は追完請求ができない。"],"read":"契約不適合は「種類・品質」と「数量・権利」で扱いが分かれる。1年の通知義務があるのは種類・品質だけ。肢にどちらが書いてあるかを最初に見る。","ref":"民法562条〜566条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-007","topic":"不法行為","type":"mc5","sec":150,"q":"不法行為に関する次の記述のうち、民法の規定および判例に照らし、正しいものはどれか。","choices":["不法行為による損害賠償請求権は、被害者が損害および加害者を知った時から3年間行使しないときは時効によって消滅するが、人の生命または身体を害する不法行為の場合は5年となる。","不法行為における過失相殺は、債務不履行の場合と同様に、裁判所が必ず考慮しなければならない。","使用者責任が認められる場合、使用者は被用者に対して全額の求償をすることができる。","土地の工作物の設置または保存の瑕疵により損害が生じた場合、所有者は必要な注意をしたことを証明すれば責任を免れる。","共同不法行為者のうちいずれの者が損害を加えたかを知ることができないときは、いずれの者も責任を負わない。"],"a":0,"each":["正しい。民法724条および724条の2。20年の除斥期間的な期間も時効期間と明確化された。","誤り。不法行為の過失相殺は裁量的であり（民法722条2項）、債務不履行の必要的過失相殺（418条）と異なる。また賠償額の減額にとどまり責任の免除まではできない。","誤り。最判昭51.7.8は、損害の公平な分担の見地から信義則上相当と認められる限度に求償が制限されるとした。","誤り。民法717条1項ただし書により免責されるのは占有者である。所有者の責任は無過失責任である。","誤り。民法719条1項後段により、この場合も各自が連帯して責任を負う。"],"read":"不法行為は期間（3年・5年・20年）、過失相殺（裁量的）、工作物責任（占有者は免責あり・所有者は無過失）の3点が核。肢を見たらこの3つのどれかに割り振る。","ref":"民法715条・717条・719条・722条・724条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-008","topic":"相続","type":"mc5","sec":150,"q":"相続に関する次の記述のうち、民法の規定に照らし、正しいものはどれか。","choices":["配偶者と直系尊属が相続人であるときの法定相続分は、配偶者が4分の3、直系尊属が4分の1である。","相続の放棄をした者は初めから相続人とならなかったものとみなされ、その者の子が代襲して相続人となることもない。","限定承認は、相続人が数人あるときは各相続人が単独ですることができる。","兄弟姉妹の代襲相続については、再代襲が認められる。","遺留分を侵害された者は、受遺者または受贈者に対し、目的物そのものの返還を請求することができる。"],"a":1,"each":["誤り。配偶者と直系尊属の場合は配偶者3分の2、直系尊属3分の1である（民法900条2号）。4分の3は配偶者と兄弟姉妹の場合である。","正しい。民法939条。相続放棄は代襲原因とならない点が重要である。","誤り。民法923条により、相続人が数人あるときは共同相続人の全員が共同してのみ限定承認をすることができる。","誤り。兄弟姉妹の代襲は一代限りであり、甥姪の子には代襲しない（民法889条2項）。","誤り。令和元年7月1日施行の改正により、遺留分侵害額に相当する金銭の支払請求権となった（民法1046条）。"],"read":"相続は法定相続分の3パターン（子と2分の1、直系尊属と3分の2、兄弟姉妹と4分の3）を数字で即答する。ここが合っていれば半分の肢は処理できる。","ref":"民法889条・900条・923条・939条・1046条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-009","topic":"会社法の機関","type":"mc5","sec":150,"q":"株式会社の機関に関する次の記述のうち、会社法の規定に照らし、正しいものはどれか。","choices":["取締役会設置会社においては、株主総会は会社法に規定する事項および定款で定めた事項に限り決議をすることができる。","公開会社においては、取締役の任期を定款により10年まで伸長することができる。","監査役は、取締役または支配人その他の使用人を兼ねることができる。","株主代表訴訟を提起するには、公開会社であるか否かを問わず、6か月前から引き続き株式を有していることが必要である。","定款の変更、事業の全部の譲渡および資本金の額の減少は、いずれも株主総会の普通決議によって行う。"],"a":0,"each":["正しい。会社法295条2項。取締役会を設置しない会社では一切の事項を決議できる（同条1項）。","誤り。任期を10年まで伸長できるのは非公開会社（監査等委員会設置会社および指名委員会等設置会社を除く）である（会社法332条2項）。","誤り。会社法335条2項により兼任は禁止される。","誤り。公開会社でない株式会社では6か月の保有期間要件は不要である（会社法847条2項）。","誤り。いずれも特別決議事項である（会社法309条2項）。"],"read":"会社法は「公開会社か非公開会社か」で結論が変わる論点が大半。肢の冒頭でどちらの話かを確認し、該当しない方の記述なら切る。これで5問中3問は処理できる。","ref":"会社法295条・309条・332条・335条・847条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"G5C-010","topic":"行政書士法と個人情報保護法","type":"mc5","sec":120,"q":"行政書士法および個人情報保護法に関する次の記述のうち、正しいものはどれか。","choices":["行政書士は、その業務を行うための事務所を二以上設けることができる。","行政書士は、正当な理由がなく業務上取り扱った事項について知り得た秘密を漏らしてはならないが、行政書士でなくなった後はこの義務を負わない。","行政書士が作成した官公署に提出する書類に係る許認可等に関する審査請求の手続の代理は、日本行政書士会連合会が実施する研修課程を修了した行政書士に限り行うことができる。","要配慮個人情報には、人種、信条、社会的身分、病歴のほか、本籍地が含まれる。","個人情報取扱事業者は、あらかじめ本人の同意を得なくても、オプトアウトの手続により要配慮個人情報を第三者に提供することができる。"],"a":2,"each":["誤り。行政書士法8条3項により、行政書士は二以上の事務所を設けてはならない。","誤り。行政書士法12条は「行政書士でなくなつた後も、また同様とする」と定める。","正しい。行政書士法1条の3第2項のいわゆる特定行政書士である。","誤り。本籍地は要配慮個人情報に含まれない（個人情報保護法2条3項）。国籍も同様である。","誤り。要配慮個人情報はオプトアウトによる第三者提供ができない（個人情報保護法27条2項）。"],"read":"基礎知識は足切りがあるので落とせない。行政書士法は事務所1つ・守秘義務は資格喪失後も・特定行政書士の3点、個人情報は要配慮個人情報の範囲が定番。ここは暗記で確実に取る。","ref":"行政書士法1条の3・8条・12条、個人情報保護法2条・27条","field":"5肢択一（民法・商法・基礎知識）"},{"id":"KTO-001","topic":"執行停止","type":"talk","sec":60,"cat":"行政法","q":"行政事件訴訟法上の執行停止について、要件と内容を声に出して説明してください。","points":["申立てが必要で職権ではできない","処分により生ずる重大な損害を避けるため緊急の必要があること","公共の福祉に重大な影響を及ぼすおそれがないこと","本案について理由がないとみえるときでないこと","処分の効力の停止は、執行や手続の続行の停止で目的を達せられる場合はできない"],"model":"執行停止は、取消訴訟を提起しても処分の効力が止まらないという執行不停止の原則を修正する制度です。裁判所が申立てにより決定し、職権ではできません。積極要件は、処分により生ずる重大な損害を避けるため緊急の必要があること。消極要件は、公共の福祉に重大な影響を及ぼすおそれがあるとき、または本案について理由がないとみえるときでないことです。効力の停止は、執行の停止や手続の続行の停止で目的を達することができる場合にはできません。","ref":"行政事件訴訟法25条","field":"口頭再現"},{"id":"KTO-002","topic":"取消訴訟の訴訟要件","type":"talk","sec":60,"cat":"行政法","q":"取消訴訟の訴訟要件を、思いつく限り口に出して列挙してください。","points":["処分性","原告適格","狭義の訴えの利益","被告適格","出訴期間","裁判管轄","審査請求前置が法定されている場合はその充足"],"model":"取消訴訟の訴訟要件は、処分性、原告適格、狭義の訴えの利益、被告適格、出訴期間、裁判管轄の6つです。加えて、個別法に審査請求前置が定められている場合はそれを経ていることが必要になります。処分性は、公権力の主体たる国または公共団体が行う行為のうち、直接国民の権利義務を形成しまたはその範囲を確定することが法律上認められているものをいいます。","ref":"行政事件訴訟法8条〜14条","field":"口頭再現"},{"id":"KTO-003","topic":"行政代執行の要件","type":"talk","sec":45,"cat":"行政法","q":"行政代執行の要件を3つ、声に出して言ってください。","points":["法律により直接命ぜられ、または法律に基づき行政庁により命ぜられた代替的作為義務であること","他の手段によってその履行を確保することが困難であること","その不履行を放置することが著しく公益に反すると認められること"],"model":"第一に、法律により直接命ぜられ、または法律に基づき行政庁により命ぜられた行為であって、他人が代わってなすことのできる代替的作為義務であること。第二に、他の手段によってその履行を確保することが困難であること。第三に、その不履行を放置することが著しく公益に反すると認められることです。手続としては、戒告、代執行令書による通知を経て実施し、費用は国税滞納処分の例により徴収します。","ref":"行政代執行法2条・3条","field":"口頭再現"},{"id":"KTO-004","topic":"聴聞と弁明","type":"talk","sec":60,"cat":"行政法","q":"聴聞によるべき不利益処分と弁明の機会の付与によるべき不利益処分の違いを説明してください。","points":["許認可等を取り消す不利益処分は聴聞","名あて人の資格または地位を直接はく奪する処分は聴聞","法人の役員等の解任を命ずる処分は聴聞","行政庁が相当と認めるときも聴聞","それ以外は弁明の機会の付与","聴聞は口頭主義、弁明は書面主義が原則"],"model":"聴聞によるのは、許認可等を取り消す不利益処分、名あて人の資格または地位を直接はく奪する処分、法人の役員等の解任を命ずる処分、そのほか行政庁が相当と認めるときです。これ以外は弁明の機会の付与となります。聴聞は期日に出頭して口頭で意見を述べる口頭主義が基本で、文書等の閲覧請求や職員への質問も認められます。弁明は、行政庁が口頭を認めたときを除き弁明書の提出による書面主義です。","ref":"行政手続法13条","field":"口頭再現"},{"id":"KTO-005","topic":"審査基準と処分基準","type":"talk","sec":45,"cat":"行政法","q":"行政手続法における審査基準、標準処理期間、処分基準の、設定と公表が義務か努力義務かを整理して言ってください。","points":["審査基準は設定が義務、公表も義務","標準処理期間は設定が努力義務、定めた場合の公表が義務","処分基準は設定も公表も努力義務"],"model":"審査基準は、設定が義務で、公にしておくことも義務です。標準処理期間は、定めることは努力義務ですが、定めたときは公にしておくことが義務になります。処分基準は、定めることも公にしておくことも、いずれも努力義務にとどまります。申請に対する処分の方が不利益処分より基準の拘束が強い、という形で覚えます。","ref":"行政手続法5条・6条・12条","field":"口頭再現"},{"id":"KTO-006","topic":"審査請求の期間と審査庁","type":"talk","sec":45,"cat":"行政法","q":"審査請求の期間と、誰が審査庁になるかを説明してください。","points":["処分があったことを知った日の翌日から3か月","処分があった日の翌日から1年","正当な理由があるときは例外","上級行政庁がないときは処分庁","上級行政庁があるときは最上級行政庁","不作為についての審査請求に期間制限はない"],"model":"処分についての審査請求は、処分があったことを知った日の翌日から起算して3か月、かつ処分があった日の翌日から起算して1年以内にしなければなりません。正当な理由があるときは例外です。審査庁は、処分庁に上級行政庁がないときは処分庁自身、上級行政庁があるときは原則として最上級行政庁になります。不作為についての審査請求には期間の制限がありません。","ref":"行政不服審査法4条・18条","field":"口頭再現"},{"id":"KTO-007","topic":"国家賠償法1条","type":"talk","sec":60,"cat":"行政法","q":"国家賠償法1条の要件と、公務員個人の責任について説明してください。","points":["公権力の行使に当たる公務員であること","職務を行うについてされたこと","故意または過失があること","違法であること","損害の発生と因果関係","公務員個人は被害者に対し直接責任を負わない","故意または重過失があるときは国等が求償できる"],"model":"要件は、公権力の行使に当たる公務員が、その職務を行うについて、故意または過失によって違法に他人に損害を加えたことです。公権力の行使には行政指導のような非権力的作用も含まれますが、私経済作用と2条の営造物管理作用は除かれます。被害者は公務員個人に対して直接賠償を請求することはできず、国または公共団体が責任を負います。公務員に故意または重大な過失があったときに限り、国等が求償できます。","ref":"国家賠償法1条","field":"口頭再現"},{"id":"KTO-008","topic":"営造物責任","type":"talk","sec":45,"cat":"行政法","q":"国家賠償法2条の設置管理の瑕疵について、判例の立場を説明してください。","points":["通常有すべき安全性を欠いていること","無過失責任である","予算不足は免責事由とならない","供用関連瑕疵（機能的瑕疵）も含まれる"],"model":"設置または管理の瑕疵とは、営造物が通常有すべき安全性を欠いていることをいい、その責任は過失を要しない無過失責任と解されています。高知落石事件では、改修の予算に困却するという事情は賠償責任を否定する理由にならないとされました。また大阪国際空港訴訟のように、営造物が供用目的に沿って利用されることで第三者に被害を及ぼす場合、いわゆる機能的瑕疵も設置管理の瑕疵に含まれます。","ref":"国家賠償法2条、最判昭45.8.20","field":"口頭再現"},{"id":"KTO-009","topic":"行政行為の取消しと撤回","type":"talk","sec":45,"cat":"行政法","q":"行政行為の職権取消しと撤回の違いを説明してください。","points":["取消しは原始的瑕疵が理由","撤回は後発的事情が理由","取消しは遡及効","撤回は将来効","撤回は処分庁のみができる","授益的行為の撤回に明文の根拠は不要という判例がある"],"model":"職権取消しは、行政行為に当初から瑕疵があったことを理由に、その効力を行為の時に遡って失わせるものです。撤回は、当初は適法であった行政行為について、その後に生じた事情を理由に、将来に向かって効力を失わせるものです。取消しは処分庁のほか上級行政庁もなしうると解されますが、撤回は処分庁のみができます。菊田医師事件では、授益的行政行為の撤回に法令上の明文の根拠は不要とされました。","ref":"行政行為の取消しと撤回","field":"口頭再現"},{"id":"KTO-010","topic":"義務付け訴訟","type":"talk","sec":60,"cat":"行政法","q":"申請型義務付け訴訟と非申請型義務付け訴訟の違いを説明してください。","points":["申請型は法令に基づく申請をした者が提起する","申請型は不作為の違法確認訴訟または拒否処分取消訴訟等の併合提起が必要","非申請型は申請を前提としない","非申請型は重大な損害を生ずるおそれが要件","非申請型は他に適当な方法がないという補充性が要件"],"model":"申請型は、法令に基づく申請をした者が、その申請に対する処分がされないとき、または拒否されたときに提起するもので、不作為の違法確認の訴えまたは拒否処分の取消訴訟等を併合して提起しなければなりません。非申請型は申請を前提とせず、一定の処分がされないことにより重大な損害を生ずるおそれがあり、かつその損害を避けるため他に適当な方法がないときに限り提起できます。非申請型にだけ補充性の要件がある点が重要です。","ref":"行政事件訴訟法37条の2・37条の3","field":"口頭再現"},{"id":"KTO-011","topic":"処分性の定義","type":"talk","sec":45,"cat":"行政法","q":"処分性の定義を判例の言い回しで言い、処分性が否定された例を2つ挙げてください。","points":["公権力の主体たる国または公共団体が行う行為","直接国民の権利義務を形成しまたはその範囲を確定することが法律上認められているもの","否定例：用途地域の指定、地区計画の決定、開発許可に関する協議の不同意、交通反則金の通告"],"model":"処分とは、公権力の主体たる国または公共団体が行う行為のうち、その行為によって直接国民の権利義務を形成しまたはその範囲を確定することが法律上認められているものをいいます。否定された例としては、用途地域の指定、地区計画の決定、公共施設管理者の協議の不同意、交通反則金の納付通告などがあります。逆に肯定されたものには、土地区画整理事業の事業計画決定、病院開設中止の勧告、輸入禁制品該当の通知があります。","ref":"最判昭39.10.29ほか","field":"口頭再現"},{"id":"KTO-012","topic":"住民監査請求と住民訴訟","type":"talk","sec":45,"cat":"行政法","q":"住民監査請求と住民訴訟の関係、および請求権者の違いを説明してください。","points":["住民監査請求は住民であれば1人でもできる","国籍、年齢、選挙権の有無、法人格を問わない","原則として行為のあった日または終わった日から1年以内","住民訴訟は監査請求を経ていることが必要（監査請求前置）","住民訴訟は民衆訴訟であり財務会計上の行為が対象"],"model":"住民監査請求は、当該普通地方公共団体の住民であれば1人でもでき、国籍、年齢、選挙権の有無、法人であるかを問いません。原則として当該行為のあった日または終わった日から1年を経過したときはできません。住民訴訟は、この監査請求を経ていなければ提起できず、監査請求前置主義が採られています。住民訴訟は自己の法律上の利益にかかわらない資格で提起する民衆訴訟で、財務会計上の行為または怠る事実が対象です。","ref":"地方自治法242条・242条の2","field":"口頭再現"},{"id":"KTO-013","topic":"意思表示の瑕疵","type":"talk","sec":60,"cat":"民法","q":"心裡留保、通謀虚偽表示、錯誤、詐欺、強迫の効果と第三者保護を整理して説明してください。","points":["心裡留保は原則有効、相手方が悪意または有過失なら無効","通謀虚偽表示は無効","錯誤は取消し","詐欺は取消し","強迫は取消し","心裡留保・虚偽表示・錯誤・詐欺は善意（錯誤と詐欺は善意無過失）の第三者に対抗できない","強迫は第三者にも対抗できる"],"model":"心裡留保は原則有効ですが、相手方が真意でないことを知りまたは知ることができたときは無効です。通謀虚偽表示は無効。錯誤、詐欺、強迫はいずれも取消しです。第三者保護については、心裡留保と虚偽表示は善意の第三者に、錯誤と詐欺は善意でかつ過失がない第三者に対抗できません。強迫だけは第三者保護規定がなく、取消しを善意の第三者にも対抗できます。強迫の被害者が最も厚く保護される、と押さえます。","ref":"民法93条〜96条","field":"口頭再現"},{"id":"KTO-014","topic":"債権者代位権と詐害行為取消権","type":"talk","sec":60,"cat":"民法","q":"債権者代位権と詐害行為取消権の要件の違いを説明してください。","points":["いずれも債務者の無資力が原則として必要","代位権は裁判外でも行使できる","詐害行為取消権は必ず裁判上の行使による","代位権は一身専属権と差押禁止債権には及ばない","詐害行為取消訴訟の被告は受益者または転得者で、債務者には訴訟告知をする","期間制限は知った時から2年、行為の時から10年"],"model":"いずれも責任財産を保全する制度で、原則として債務者の無資力を要します。債権者代位権は裁判外でも行使でき、債務者の一身に専属する権利と差押えを禁じられた権利には及びません。被代位権利が可分なときは自己の債権額の限度でのみ行使できます。詐害行為取消権は必ず訴えによる必要があり、被告は受益者または転得者で、債務者を被告とはせず訴訟告知をします。期間は、債権者が詐害行為を知った時から2年、行為の時から10年です。","ref":"民法423条・424条・426条","field":"口頭再現"},{"id":"KTO-015","topic":"法定地上権","type":"talk","sec":45,"cat":"民法","q":"法定地上権の成立要件を4つ挙げてください。","points":["抵当権設定当時に土地の上に建物が存在すること","抵当権設定当時に土地と建物が同一の所有者に属すること","土地または建物の一方または双方に抵当権が設定されたこと","競売により土地と建物の所有者が異なるに至ったこと"],"model":"第一に、抵当権設定当時に土地の上に建物が存在すること。更地に設定した場合は成立しません。第二に、抵当権設定当時に土地と建物が同一の所有者に属すること。第三に、土地または建物の一方または双方に抵当権が設定されたこと。第四に、競売の結果、土地と建物の所有者が異なるに至ったこと。この4つが揃うと、建物のために地上権が設定されたものとみなされます。","ref":"民法388条","field":"口頭再現"},{"id":"KTO-016","topic":"契約不適合責任","type":"talk","sec":60,"cat":"民法","q":"売買の目的物が契約内容に適合しない場合に買主が取りうる手段を順に説明してください。","points":["履行の追完請求（修補・代替物引渡し・不足分引渡し）","相当期間を定めて催告したうえで代金減額請求","損害賠償請求","契約の解除","種類・品質の不適合は知った時から1年以内の通知が必要","買主に帰責事由があるときは追完請求できない"],"model":"まず履行の追完請求ができ、目的物の修補、代替物の引渡し、不足分の引渡しのいずれかを求めます。追完がされないときは、相当の期間を定めて催告したうえで代金の減額を請求できます。これに加えて損害賠償請求と契約の解除も可能です。種類または品質に関する不適合については、買主は不適合を知った時から1年以内に売主に通知しなければ権利を失います。数量や権利の不適合にはこの制限はありません。","ref":"民法562条〜566条","field":"口頭再現"},{"id":"KTO-017","topic":"不法行為の期間制限","type":"talk","sec":40,"cat":"民法","q":"不法行為による損害賠償請求権の消滅時効について説明してください。","points":["損害および加害者を知った時から3年","不法行為の時から20年","人の生命または身体を害する不法行為は主観的起算点から5年","いずれも消滅時効であり除斥期間ではないと明確化された"],"model":"被害者またはその法定代理人が損害および加害者を知った時から3年間行使しないとき、または不法行為の時から20年を経過したときに時効消滅します。人の生命または身体を害する不法行為による損害賠償請求権については、主観的起算点からの期間が5年に伸長されます。改正により、20年の期間も除斥期間ではなく消滅時効であることが明確になりました。","ref":"民法724条・724条の2","field":"口頭再現"},{"id":"KTO-018","topic":"相続の承認と放棄","type":"talk","sec":45,"cat":"民法","q":"相続の単純承認、限定承認、放棄について、期間と手続を説明してください。","points":["自己のために相続の開始があったことを知った時から3か月の熟慮期間","限定承認は相続人全員が共同してする","放棄は各相続人が単独でできる","放棄した者は初めから相続人とならなかったものとみなされる","放棄は代襲原因とならない"],"model":"相続人は、自己のために相続の開始があったことを知った時から3か月以内に、単純承認、限定承認または放棄をしなければなりません。限定承認は相続人が数人あるときは全員が共同してする必要があります。放棄は各相続人が単独でできます。放棄をした者は初めから相続人とならなかったものとみなされ、その子が代襲相続することもありません。熟慮期間内に何もしないと単純承認したものとみなされます。","ref":"民法915条・923条・939条","field":"口頭再現"},{"id":"KTO-019","topic":"配偶者居住権","type":"talk","sec":45,"cat":"民法","q":"配偶者居住権の要件と内容を説明してください。","points":["相続開始の時に被相続人所有の建物に居住していたこと","遺産分割、遺贈または死因贈与により取得する","原則として終身","無償で使用および収益ができる","登記することができ、登記があれば第三者に対抗できる","譲渡することはできない"],"model":"被相続人の配偶者が、相続開始の時に被相続人所有の建物に居住していた場合に、遺産分割、遺贈または死因贈与によって取得できる権利です。存続期間は原則として終身で、その建物の全部について無償で使用および収益をすることができます。登記をすることができ、登記を備えれば第三者に対抗できます。譲渡はできず、所有者の承諾なく増改築や第三者への使用収益をさせることもできません。","ref":"民法1028条〜1036条","field":"口頭再現"},{"id":"KTO-020","topic":"時効の完成猶予と更新","type":"talk","sec":45,"cat":"民法","q":"債権の消滅時効の期間と、完成猶予と更新の違いを説明してください。","points":["権利を行使できることを知った時から5年","権利を行使することができる時から10年","人の生命身体の侵害による損害賠償請求権は10年ではなく20年","完成猶予は時効の完成を一時的に止める","更新はそれまでの期間がリセットされ新たに進行する","裁判上の請求は完成猶予、確定判決で権利確定すれば更新"],"model":"債権は、債権者が権利を行使することができることを知った時から5年、または権利を行使することができる時から10年で時効消滅します。人の生命または身体の侵害による損害賠償請求権は、客観的起算点からの期間が20年になります。完成猶予は、一定の事由がある間は時効が完成しないというもので、更新は、それまで経過した期間がリセットされて新たにゼロから進行するものです。裁判上の請求は完成猶予事由で、確定判決等により権利が確定すれば更新されます。","ref":"民法147条・166条・167条","field":"口頭再現"},{"id":"KTO-021","topic":"検閲の定義","type":"talk","sec":45,"cat":"憲法","q":"憲法21条2項の検閲の定義を、判例の言い回しで声に出して言ってください。","points":["行政権が主体となること","思想内容等の表現物を対象とすること","全部または一部の発表の禁止を目的とすること","網羅的一般的に発表前に審査すること","不適当と認めるものの発表を禁止すること","検閲の禁止は絶対的で例外を認めない"],"model":"検閲とは、行政権が主体となって、思想内容等の表現物を対象とし、その全部または一部の発表の禁止を目的として、対象とされる表現物を網羅的一般的に発表前に審査したうえ、不適当と認めるものの発表を禁止することを、その特質として備えるものを指します。憲法21条2項前段は、検閲の禁止について一切の例外を認めない趣旨です。主体が行政権に限られるため、裁判所による事前差止めは検閲に当たりません。","ref":"最大判昭59.12.12","field":"口頭再現"},{"id":"KTO-022","topic":"違憲審査権","type":"talk","sec":40,"cat":"憲法","q":"わが国の違憲審査制の性格と、統治行為論について説明してください。","points":["付随的審査制である","具体的事件を離れた抽象的審査はできない","警察予備隊違憲訴訟","統治行為論は高度に政治性のある国家行為に審査権が及ばないとする","苫米地事件、砂川事件"],"model":"わが国の違憲審査制は、具体的な争訟事件を前提として、その解決に必要な限りで法令の合憲性を判断する付随的審査制です。警察予備隊違憲訴訟で、具体的事件を離れて抽象的に法律等の合憲性を判断する権限はないとされました。また統治行為論により、衆議院の解散のように直接国家統治の基本に関する高度に政治性のある国家行為には審査権が及ばないとされます。苫米地事件がその代表で、砂川事件も一見極めて明白に違憲無効でない限り司法審査の範囲外としました。","ref":"最大判昭27.10.8ほか","field":"口頭再現"},{"id":"KTO-023","topic":"法の下の平等","type":"talk","sec":45,"cat":"憲法","q":"最高裁が法令を違憲とした判例を、分野を問わず思いつく限り挙げてください。","points":["尊属殺重罰規定","薬事法距離制限","森林法共有林分割制限","衆参の議員定数不均衡（違憲状態を含む）","郵便法の免責規定","在外邦人選挙権制限","国籍法の準正要件","非嫡出子相続分","再婚禁止期間の100日超過部分","在外国民審査権","性同一性障害特例法の生殖不能要件"],"model":"尊属殺重罰規定、薬事法の距離制限、森林法の共有林分割制限、議員定数不均衡、郵便法の免責規定、在外邦人の選挙権制限、国籍法の準正要件、非嫡出子の相続分、再婚禁止期間の100日を超える部分、在外国民の審査権、性同一性障害特例法の生殖不能要件などがあります。法令違憲は数が限られるので、全部言えるようにしておくと択一で確実に得点できます。","ref":"法令違憲判決","field":"口頭再現"},{"id":"KTO-024","topic":"行政書士の業務と義務","type":"talk","sec":45,"cat":"基礎知識","q":"行政書士の業務と主な義務を声に出して説明してください。","points":["官公署に提出する書類、権利義務または事実証明に関する書類の作成","提出手続の代理、契約書等の代理人としての作成、相談","不服申立ての代理は特定行政書士に限る","事務所は二以上設けられない","依頼に応ずる義務","守秘義務は資格を失った後も続く","帳簿の備付けと2年間の保存","報酬額の掲示"],"model":"行政書士は、他人の依頼を受け報酬を得て、官公署に提出する書類、その他権利義務または事実証明に関する書類を作成することを業とします。あわせて、提出手続の代理、契約その他書類を代理人として作成すること、これらに関する相談に応ずることができます。審査請求等の不服申立ての代理は、研修課程を修了した特定行政書士に限られます。義務としては、事務所を二以上設けないこと、正当な事由がなければ依頼を拒めないこと、守秘義務は資格を失った後も続くこと、帳簿を閉鎖後2年間保存すること、報酬額を掲示することがあります。","ref":"行政書士法1条の2・1条の3・8条〜12条","field":"口頭再現"},{"id":"KMB-001","topic":"行政罰","type":"combo","sec":180,"q":"行政罰に関する次のア〜オの記述のうち、妥当なものの組合せはどれか。","items":["ア　行政刑罰は刑法に刑名のある罰であり、原則として刑事訴訟法の手続によって科される。","イ　秩序罰としての過料は、法令に基づくものであっても、必ず裁判所が科さなければならない。","ウ　同一の行為に対して行政刑罰と秩序罰としての過料を併科することは、二重処罰を禁ずる憲法39条に違反する。","エ　条例違反に対する過料は、地方公共団体の長が行政処分として科す。","オ　行政上の秩序罰は、行政上の義務違反に対する制裁であり、直接的に行政上の義務の履行を強制する手段ではない。"],"choices":["ア・イ・ウ","ア・エ・オ","イ・ウ・エ","イ・エ・オ","ウ・オ"],"a":1,"each":["ア　妥当。行政刑罰は死刑、拘禁刑、罰金等の刑法上の刑名を用い、刑事訴訟法の手続による。","イ　妥当でない。法律に基づく過料は非訟事件手続法により裁判所が科すが、条例・規則違反の過料は地方公共団体の長が科す（地方自治法149条3号）。","ウ　妥当でない。最判昭39.6.5は、両者は目的・性質を異にするとして併科を認めている。","エ　妥当。地方自治法14条3項・15条2項の過料は、長が行政処分として科す。","オ　妥当。秩序罰は過去の義務違反に対する制裁であり、将来の履行を強制する執行罰とは異なる。"],"read":"組合せ問題は5肢すべてを判定する必要はない。確実に切れる肢を1つ見つけ、それを含む選択肢を消す。ここではイかウのどちらかが分かれば、選択肢は2つに絞れる。","ref":"地方自治法14条・149条、最判昭39.6.5","field":"組合せ形式"},{"id":"KMB-002","topic":"差止めの訴え","type":"combo","sec":180,"q":"処分の差止めの訴えに関する次のア〜オの記述のうち、法令および最高裁判所の判例に照らし、妥当なものの組合せはどれか。","items":["ア　差止めの訴えは、一定の処分がされることにより重大な損害を生ずるおそれがある場合に限り提起することができる。","イ　重大な損害を生ずるおそれがある場合であっても、その損害を避けるため他に適当な方法があるときは提起することができない。","ウ　重大な損害を生ずるか否かの判断においては、損害の回復の困難の程度を考慮するものとされている。","エ　差止めの訴えは、処分がされた後であっても、その処分の効果が継続している限り提起することができる。","オ　差止めの訴えを提起した者は、償うことのできない損害を避けるため緊急の必要があるときは、仮の差止めを申し立てることができる。"],"choices":["ア・イ・エ","ア・ウ・エ","ア・イ・ウ・オ","イ・エ・オ","ウ・エ・オ"],"a":2,"each":["ア　妥当。行政事件訴訟法37条の4第1項本文。","イ　妥当。同項ただし書の補充性の要件である。","ウ　妥当。同条2項。損害の性質・程度および処分の内容・性質をも勘案する。","エ　妥当でない。差止めの訴えは処分がされようとしている段階のものであり、処分後は取消訴訟によることになる。","オ　妥当。行政事件訴訟法37条の5第2項。要件が「償うことのできない損害」である点が執行停止と異なる。"],"read":"差止めと義務付けは要件の語が決め手。重大な損害、他に適当な方法がない、償うことのできない損害の3語を、どの制度のどこに置くかで正誤が決まる。","ref":"行政事件訴訟法37条の4・37条の5","field":"組合せ形式"},{"id":"KMB-003","topic":"国家賠償法1条","type":"combo","sec":180,"q":"国家賠償法1条に関する次のア〜オの記述のうち、最高裁判所の判例に照らし、妥当なものの組合せはどれか。","items":["ア　公権力の行使には、行政指導のような非権力的な作用も含まれる。","イ　加害公務員が特定されない場合であっても、損害が公務員の行為によることが明らかであれば、国または公共団体が責任を負うことがある。","ウ　公務員に故意または重大な過失があったときは、被害者は当該公務員個人に対して直接損害賠償を請求することができる。","エ　非番の警察官が制服を着用して職務執行を装い他人に損害を加えた場合、国または公共団体は損害賠償責任を負わない。","オ　規制権限の不行使は、その権限を定めた法令の趣旨目的に照らし著しく合理性を欠くときは違法となる。"],"choices":["ア・イ・オ","ア・ウ・エ","イ・ウ・オ","イ・エ・オ","ウ・エ"],"a":0,"each":["ア　妥当。判例・通説は広義説を採り、公立学校の教育活動や行政指導も含める。","イ　妥当。最判昭57.4.1は、一連の行為のいずれかに故意過失があれば足りるとした。","ウ　妥当でない。公務員個人は被害者に対し直接責任を負わない（最判昭30.4.19）。故意重過失があるときに国等が求償できるにとどまる。","エ　妥当でない。外形標準説により責任を負う（最判昭31.11.30）。","オ　妥当。筑豊じん肺訴訟（最判平16.4.27）など。"],"read":"国家賠償は、公務員個人への直接請求を認める肢が出たら必ず切る。これが含まれる選択肢を全部消すと、たいてい2つまで絞れる。","ref":"国家賠償法1条、最判昭30.4.19ほか","field":"組合せ形式"},{"id":"KMB-004","topic":"国の関与","type":"combo","sec":180,"q":"普通地方公共団体に対する国または都道府県の関与に関する次のア〜エの記述のうち、妥当なものの組合せはどれか。","items":["ア　国の関与は、法律またはこれに基づく政令によらなければ行うことができない。","イ　国の関与は、その目的を達成するために必要な最小限度のものとし、地方公共団体の自主性および自立性に配慮しなければならない。","ウ　自治事務の処理について、各大臣は、法令違反がある場合に限らず、適当でないと認めるときは常に是正の指示をすることができる。","エ　国の関与に不服がある普通地方公共団体の長その他の執行機関は、国地方係争処理委員会に審査の申出をすることができる。"],"choices":["ア・イ・ウ","ア・イ・エ","ア・ウ・エ","イ・ウ・エ","ウ・エ"],"a":1,"each":["ア　妥当。地方自治法245条の2の関与の法定主義である。","イ　妥当。地方自治法245条の3第1項の関与の基本原則である。","ウ　妥当でない。是正の要求・指示は法令違反または著しく適正を欠き明らかに公益を害している場合に限られる（245条の5、245条の7）。「常に」とする点が誤り。","エ　妥当。地方自治法250条の13。審査結果に不服があるときは高等裁判所に訴えを提起できる。"],"read":"地方自治の関与は「法定主義」「必要最小限度」「係争処理委員会」の3本柱。これらを述べる肢はまず妥当。『常に』『いかなる場合も』が付いたら疑う。","ref":"地方自治法245条の2・245条の3・250条の13","field":"組合せ形式"},{"id":"KMB-005","topic":"代理","type":"combo","sec":180,"q":"代理に関する次のア〜オの記述のうち、民法の規定および判例に照らし、妥当なものの組合せはどれか。","items":["ア　代理人が本人のためにすることを示さないでした意思表示は、相手方が本人のためにすることを知り、または知ることができたときは、本人に対して直接効力を生ずる。","イ　制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができないのが原則である。","ウ　任意代理人は、本人の許諾を得なくても、いつでも自己の責任で復代理人を選任することができる。","エ　同一の法律行為について相手方の代理人としてした行為は、本人があらかじめ許諾した場合を除き、代理権を有しない者がした行為とみなされる。","オ　無権代理人の相手方は、契約の時に代理権がないことを知っていた場合であっても、本人に対し相当の期間を定めて追認するかどうかを催告することができる。"],"choices":["ア・イ・ウ","ア・イ・エ・オ","ア・ウ・オ","イ・ウ・エ","ウ・エ・オ"],"a":1,"each":["ア　妥当。民法100条ただし書。","イ　妥当。民法102条本文。ただし制限行為能力者が他の制限行為能力者の法定代理人としてした行為は取り消しうる（同条ただし書）。","ウ　妥当でない。民法104条により、任意代理人は本人の許諾を得たときまたはやむを得ない事由があるときでなければ復代理人を選任できない。","エ　妥当。民法108条1項の自己契約・双方代理の規定である。","オ　妥当。民法114条の催告権は相手方の善意悪意を問わない。取消権（115条）が善意に限られるのと異なる。"],"read":"組合せ問題は、明らかに誤りの肢を1つ特定できれば勝ち。ここではウの復代理が最も判定しやすい。ウを含む選択肢を全部消すと、残りは2つになる。","ref":"民法100条・102条・104条・108条・114条","field":"組合せ形式"},{"id":"KMB-006","topic":"即時取得","type":"combo","sec":180,"q":"即時取得に関する次のア〜オの記述のうち、民法の規定および判例に照らし、妥当なものの組合せはどれか。","items":["ア　即時取得が成立するには、取引行為によって動産の占有を取得したことを要する。","イ　占有の取得が占有改定による場合であっても、即時取得は成立する。","ウ　即時取得が成立するには、占有の取得が平穏かつ公然であり、取得者が善意かつ無過失であることを要する。","エ　即時取得の対象となる動産には、登録を受けた自動車は含まれない。","オ　占有物が盗品または遺失物であるときは、被害者または遺失者は、盗難または遺失の時から10年間、占有者に対しその物の回復を請求することができる。"],"choices":["ア・イ・ウ","ア・ウ・エ","ア・エ・オ","イ・ウ・オ","イ・エ・オ"],"a":1,"each":["ア　妥当。相続のような包括承継では即時取得は成立しない。","イ　妥当でない。最判昭35.2.11は、占有改定による占有取得では即時取得は成立しないとした。","ウ　妥当。民法192条。平穏・公然・善意は186条により推定され、無過失も188条により推定される（最判昭41.6.9）。","エ　妥当。登録を受けた自動車は登録が対抗要件であり、即時取得の対象とならない（最判昭62.4.24）。","オ　妥当でない。民法193条の回復請求期間は盗難または遺失の時から2年である。"],"read":"民法の組合せ問題は数字と例外がねらわれる。即時取得なら、占有改定では成立しないことと、盗品遺失物は2年、この2点が定番の切り札になる。","ref":"民法192条・193条、最判昭35.2.11","field":"組合せ形式"},{"id":"KMB-007","topic":"聴聞","type":"combo","sec":180,"q":"行政手続法が定める聴聞に関する次のア〜オの記述のうち、妥当なものの組合せはどれか。","items":["ア　許認可等を取り消す不利益処分をしようとするときは、聴聞の手続を執らなければならない。","イ　当事者は、聴聞の期日への出頭に代えて、主宰者に対し陳述書および証拠書類等を提出することができる。","ウ　当事者は、聴聞の通知があった時から聴聞が終結する時までの間、行政庁に対し当該事案についての調書等の閲覧を求めることができ、行政庁はいかなる場合もこれを拒むことができない。","エ　主宰者は、当事者の全部または一部が正当な理由なく聴聞の期日に出頭しないときは、これらの者に対し改めて意見を述べる機会を与えることなく聴聞を終結することができる。","オ　聴聞を経てされた不利益処分については、行政不服審査法による審査請求をすることができる。"],"choices":["ア・イ・エ","ア・イ・オ","ア・ウ・エ","イ・ウ・オ","ウ・エ・オ"],"a":0,"each":["ア　妥当。行政手続法13条1項1号イ。","イ　妥当。行政手続法21条1項。","ウ　妥当でない。行政手続法18条1項ただし書により、第三者の利益を害するおそれがあるときその他正当な理由があるときは拒むことができる。","エ　妥当。行政手続法23条1項。","オ　妥当でない。行政手続法27条により、聴聞を経てされた不利益処分については審査請求をすることができない。"],"read":"行政手続法の組合せは、『いかなる場合も』『一切』という強い言い切りの肢がほぼ誤り。そこから消すと速い。","ref":"行政手続法13条・18条・21条・23条・27条","field":"組合せ形式"},{"id":"KMB-008","topic":"行政書士法","type":"combo","sec":150,"q":"行政書士法に関する次のア〜エの記述のうち、妥当でないものの組合せはどれか。","items":["ア　行政書士は、その業務を行うための事務所を、必要に応じて二以上設けることができる。","イ　行政書士は、正当な事由がある場合でなければ、依頼を拒むことができない。","ウ　行政書士が、この法律に基づく都道府県知事の処分に違反したときは、都道府県知事は戒告、2年以内の業務の停止または業務の禁止の処分をすることができる。","エ　行政書士は、業務上取り扱った事項について知り得た秘密を保持する義務を負うが、行政書士でなくなった後はこの義務を免れる。"],"choices":["ア・イ","ア・ウ","ア・エ","イ・ウ","ウ・エ"],"a":2,"each":["ア　妥当でない。行政書士法8条3項により、二以上の事務所を設けてはならない。","イ　妥当。行政書士法11条の依頼に応ずる義務である。","ウ　妥当。行政書士法14条の懲戒である。業務の停止または禁止には聴聞を要する。","エ　妥当でない。行政書士法12条は「行政書士でなくなつた後も、また同様とする」と定める。"],"read":"設問が「妥当でないものの組合せ」であることを最初に丸で囲む。妥当なものを探してしまう取り違えが、この形式で最も多い失点である。","ref":"行政書士法8条・11条・12条・14条","field":"組合せ形式"},{"id":"KMB-009","topic":"戸籍法・住民基本台帳法","type":"combo","sec":150,"q":"戸籍法および住民基本台帳法に関する次のア〜オの記述のうち、妥当でないものの組合せはどれか。","items":["ア　出生の届出は、出生の日から3日以内にしなければならない。","イ　死亡の届出は、届出義務者が死亡の事実を知った日から7日以内にしなければならない。","ウ　転入をした者は、転入をした日から14日以内に転入届を市町村長に提出しなければならない。","エ　転出をしようとする者は、転出をした日から14日以内に転出届を提出しなければならない。","オ　婚姻は、戸籍法の定めるところにより届け出ることによって効力を生ずる。"],"choices":["ア・イ","ア・エ","イ・ウ","ウ・オ","エ・オ"],"a":1,"each":["ア　妥当でない。戸籍法49条1項により、出生の届出は出生の日から14日以内（国外で出生したときは3か月以内）である。","イ　妥当。戸籍法86条1項。","ウ　妥当。住民基本台帳法22条。","エ　妥当でない。住民基本台帳法24条により、転出届はあらかじめ（転出をする前に）提出する。","オ　妥当。民法739条1項の届出婚主義である。"],"read":"戸籍と住基の数字は出生14日、死亡7日、転入転居14日、転出は事前。この4点だけ暗記すれば基礎知識の1問が確実に取れる。足切りのある科目なので落とさない。","ref":"戸籍法49条・86条、住民基本台帳法22条〜24条","field":"組合せ形式"},{"id":"KMB-010","topic":"株式","type":"combo","sec":180,"q":"株式会社の株式に関する次のア〜オの記述のうち、会社法の規定に照らし、正しいものの組合せはどれか。","items":["ア　株式会社は、その発行する全部の株式の内容として、譲渡による取得について当該会社の承認を要する旨を定款で定めることができる。","イ　株式会社は、剰余金の配当を受ける権利および残余財産の分配を受ける権利の全部を株主に与えない旨を定款で定めることができる。","ウ　株券発行会社における株式の譲渡は、当該株式に係る株券を交付しなければ効力を生じない。","エ　株主名簿の名義書換は、株式会社その他の第三者に対する対抗要件であるが、株券発行会社においては株券の占有のみで会社に対抗できる。","オ　公開会社でない株式会社は、剰余金の配当を受ける権利について株主ごとに異なる取扱いを行う旨を定款で定めることができる。"],"choices":["ア・ウ・オ","ア・イ・エ","イ・ウ・エ","イ・エ・オ","ウ・エ・オ"],"a":0,"each":["ア　正しい。会社法107条1項1号の譲渡制限株式である。","イ　誤り。会社法105条2項により、剰余金配当請求権と残余財産分配請求権の全部を与えない旨の定款の定めは無効である。","ウ　正しい。会社法128条1項。","エ　誤り。会社法130条2項により、株券発行会社においても会社その他の第三者への対抗には株主名簿の名義書換を要する。","オ　正しい。会社法109条2項のいわゆる属人的定めで、公開会社でない株式会社に限り認められる。"],"read":"会社法の組合せは、公開会社か非公開会社かで結論が変わる肢が必ず入る。肢の冒頭でどちらの話かを確認し、該当しない記述を切る。","ref":"会社法105条・107条・109条・128条・130条","field":"組合せ形式"},{"id":"HON-001","topic":"空欄補充の組合せ・国会","type":"mc5","sec":180,"lead":"憲法は、国会について［ア］制を採用し、内閣がその召集を実質的に決定する権限を有する。国会の会期には常会、臨時会および特別会があり、常会は毎年［イ］回召集される。いずれかの議院の総議員の［ウ］以上の要求があったときは、内閣は臨時会の召集を決定しなければならない。また、衆議院が解散されたときは参議院は同時に閉会となるが、内閣は国に緊急の必要があるときは参議院の［エ］を求めることができる。","q":"上の文章の空欄ア〜エに当てはまる語句の組合せとして、妥当なものはどれか。","choices":["ア 会期　イ 一　ウ 四分の一　エ 緊急集会","ア 会期　イ 二　ウ 三分の一　エ 緊急集会","ア 通年　イ 一　ウ 四分の一　エ 特別会","ア 会期　イ 一　ウ 三分の一　エ 特別会","ア 通年　イ 二　ウ 四分の一　エ 緊急集会"],"a":0,"each":["正しい。会期制、常会は毎年1回（憲法52条）、臨時会は総議員の4分の1以上の要求（53条）、参議院の緊急集会（54条2項）。","誤り。常会は毎年1回。臨時会の要求は4分の1以上である。","誤り。憲法は通年制ではなく会期制を採る。エも緊急集会である。","誤り。臨時会の要求は3分の1ではなく4分の1以上である。","誤り。会期制であり、常会は年1回である。"],"read":"空欄補充の組合せは、確実に分かる空欄を1つ決めて選択肢を絞るのが鉄則。ここではウの4分の1が分かれば3つに減り、イの1回で1つに決まる。全部埋めようとしない。","ref":"憲法52条〜54条","field":"本試験型"},{"id":"HON-002","topic":"空欄補充の組合せ・行政裁量","type":"mc5","sec":180,"lead":"行政事件訴訟法30条は、行政庁の裁量処分については、裁量権の範囲をこえまたはその［ア］があった場合に限り、裁判所がその処分を取り消すことができる旨を定める。裁量統制の手法のうち、行政庁が考慮すべき事項を考慮せず、考慮すべきでない事項を考慮したかを問うものを［イ］統制といい、その代表例が［ウ］である。他方、処分が社会通念上著しく妥当性を欠くかを問うものを社会観念審査といい、その代表例が［エ］である。","q":"上の文章の空欄ア〜エに当てはまる語句の組合せとして、妥当なものはどれか。","choices":["ア 逸脱　イ 手続　ウ 個人タクシー事件　エ マクリーン事件","ア 濫用　イ 判断過程　ウ 日光太郎杉事件　エ 神戸税関事件","ア 濫用　イ 判断過程　ウ 伊方原発訴訟　エ 個人タクシー事件","ア 逸脱　イ 実体　ウ 神戸税関事件　エ 日光太郎杉事件","ア 濫用　イ 手続　ウ 個人タクシー事件　エ 伊方原発訴訟"],"a":1,"each":["誤り。条文は「裁量権の範囲をこえ又はその濫用があった場合」である。","正しい。判断過程統制の代表例が日光太郎杉事件（東京高判昭48.7.13）、社会観念審査の代表例が神戸税関事件（最判昭52.12.20）である。","誤り。伊方原発訴訟は原子炉設置許可の専門技術的裁量に関する判断過程審査だが、社会観念審査の代表例に個人タクシー事件を置くのは誤り。","誤り。アが条文の文言と合わず、ウとエも入れ替わっている。","誤り。イは手続ではなく判断過程である。"],"read":"事件名を問う空欄は、判例名と結論の対応表を思い出すだけで足りる。日光太郎杉は判断過程、神戸税関は社会観念、と対で覚える。","ref":"行政事件訴訟法30条","field":"本試験型"},{"id":"HON-003","topic":"会話形式・審査請求と再調査の請求","type":"mc5","sec":180,"lead":"学生Ａ：行政不服審査法では、処分に不服があるとき、まず再調査の請求をしなければならないのですか。\n教員Ｂ：いいえ。［ア］再調査の請求は、法律に定めがある場合にのみすることができます。\n学生Ａ：再調査の請求ができる場合は、必ずそちらを先にするのですか。\n教員Ｂ：［イ］再調査の請求をすることができる場合であっても、原則として直ちに審査請求をすることもできます。\n学生Ａ：再調査の請求をした場合、その決定を待たずに審査請求はできますか。\n教員Ｂ：［ウ］再調査の請求をしたときは、原則としてその決定を経た後でなければ審査請求はできません。\n学生Ａ：再調査の請求の期間は審査請求と同じですか。\n教員Ｂ：［エ］再調査の請求は、処分があったことを知った日の翌日から起算して1か月以内です。","q":"上の会話の下線部ア〜エのうち、妥当なものの組合せはどれか。","choices":["ア・イ・ウ","ア・イ・エ","ア・ウ・エ","イ・ウ・エ","ウ・エ"],"a":0,"each":["ア・イ・ウが妥当。アは行政不服審査法5条1項本文、イは同項の選択の自由、ウは同項ただし書の決定経由原則である。","—","—","—","エが妥当でない。再調査の請求の期間は、処分があったことを知った日の翌日から起算して3か月以内である（行政不服審査法54条1項）。1か月ではない。"],"read":"会話形式は見た目が長いだけで、問われているのは各下線部の正誤。会話の流れは読まず、下線部だけを順に判定する。地の文は飛ばしてよい。","ref":"行政不服審査法5条・54条","field":"本試験型"},{"id":"HON-004","topic":"会話形式・訴訟類型の選択","type":"mc5","sec":180,"lead":"学生Ａ：営業許可の申請をしたのに、半年たっても何の応答もありません。どうすればよいですか。\n教員Ｂ：［ア］まず不作為の違法確認の訴えが考えられます。これは申請をした者だけが提起できます。\n学生Ａ：違法だと確認されれば、許可はもらえるのですか。\n教員Ｂ：［イ］いいえ。確認判決だけでは許可は出ません。そこで申請型義務付け訴訟を併合して提起します。\n学生Ａ：併合しなくても義務付け訴訟だけを出すことはできませんか。\n教員Ｂ：［ウ］できます。申請型義務付け訴訟は単独でも提起できます。\n学生Ａ：判決が出るまで時間がかかります。何か手はありますか。\n教員Ｂ：［エ］仮の義務付けを申し立てる方法があります。償うことのできない損害を避けるため緊急の必要があることが要件です。","q":"上の会話の下線部ア〜エのうち、妥当でないものはどれか。","choices":["ア","イ","ウ","エ","妥当でないものはない"],"a":2,"each":["アは妥当。行政事件訴訟法37条により、不作為の違法確認の訴えは申請をした者に限り提起できる。","イは妥当。確認判決には処分を命ずる効力がないため、義務付け訴訟の併合が必要になる。","ウが妥当でない。行政事件訴訟法37条の3第3項により、申請型義務付け訴訟は不作為の違法確認の訴えまたは拒否処分の取消訴訟等を併合して提起しなければならない。","エは妥当。行政事件訴訟法37条の5第1項。要件は「償うことのできない損害」である。","—"],"read":"設問が「妥当でないもの」であることを最初に確認する。会話形式でも問われ方は同じで、1か所だけ誤りを仕込むのが定石である。","ref":"行政事件訴訟法37条・37条の3・37条の5","field":"本試験型"},{"id":"HON-005","topic":"条文提示型・出訴期間","type":"mc5","sec
