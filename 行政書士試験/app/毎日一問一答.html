":180,"lead":"行政事件訴訟法14条1項\n「取消訴訟は、処分又は裁決があつたことを知つた日から六箇月を経過したときは、提起することができない。ただし、正当な理由があるときは、この限りでない。」","q":"上の規定に関する次の記述のうち、法令および最高裁判所の判例に照らし、妥当なものはどれか。","choices":["「処分又は裁決があつたことを知つた日」とは、処分の内容を具体的に了知した日をいい、処分があったことを現実に知らなくても、知りうべき状態に置かれただけでは足りない。","本項の期間を経過した場合であっても、処分または裁決の日から1年を経過していなければ、なお取消訴訟を提起することができる。","本項の期間は不変期間であり、「正当な理由」による例外は認められていない。","審査請求をした場合であっても、本項の期間は処分があったことを知った日から進行し、裁決があったことを知った日から起算されることはない。","処分が個別の通知によらず告示によって多数人に対して行われる場合、「知つた日」は原則として告示があった日と解される。"],"a":4,"each":["妥当でない。判例は、処分があったことを現実に知った日をいうとしつつ、社会通念上知りうべき状態に置かれたときは特段の事情がない限り知ったものと推定するとしている。","妥当でない。14条2項の1年は別個の期間制限であり、1項の6か月を経過すれば1年以内でも提起できない。","妥当でない。ただし書が「正当な理由があるときは、この限りでない」と定めている。","妥当でない。14条3項により、審査請求をした場合は裁決があったことを知った日から6か月、裁決の日から1年となる。","妥当。最判平14.10.24は、告示により多数の関係権利者に画一的に告知される場合、告示があった日に処分があったことを知ったものと解すべきとした。"],"read":"条文提示型は、掲げられた条文の外にある関連条項を問うのが定番。ここでは14条2項と3項を知っているかが分かれ目になる。提示された1項だけ読んでも解けない。","ref":"行政事件訴訟法14条、最判平14.10.24","field":"本試験型"},{"id":"HON-006","topic":"条文提示型・理由の提示","type":"mc5","sec":180,"lead":"行政手続法14条1項\n「行政庁は、不利益処分をする場合には、その名あて人に対し、同時に、当該不利益処分の理由を示さなければならない。ただし、当該理由を示さないで処分をすべき差し迫った必要がある場合は、この限りでない。」","q":"上の規定および理由の提示に関する次の記述のうち、法令および最高裁判所の判例に照らし、妥当なものはどれか。","choices":["ただし書により理由を示さないで処分をした場合、行政庁は事後に理由を示す必要はない。","理由の提示の趣旨は、行政庁の判断の慎重と合理性を担保してその恣意を抑制するとともに、処分の理由を名あて人に知らせて不服申立ての便宜を与えることにある。","処分基準が設定され公にされている場合であっても、処分の原因となる事実と根拠法条を示せば、処分基準の適用関係を示す必要はない。","申請に対する拒否処分については、理由の提示は努力義務にとどまる。","理由の提示を欠く処分であっても、処分の実体的な適法性に影響しない以上、当該処分が違法となることはない。"],"a":1,"each":["妥当でない。14条2項により、処分後相当の期間内に理由を示さなければならない（名あて人の所在が判明しない場合等を除く）。","妥当。最判昭60.1.22等が示す理由提示の趣旨である。","妥当でない。一級建築士免許取消事件（最判平23.6.7）は、処分基準の適用関係が示されなければ理由提示として不十分であるとした。","妥当でない。行政手続法8条1項により、申請拒否処分の理由提示も義務である。","妥当でない。判例は理由提示の不備を理由に処分を取り消している。手続の瑕疵が独立の取消事由となる。"],"read":"理由提示は、趣旨（恣意抑制と不服申立ての便宜）と、一級建築士免許取消事件（処分基準の適用関係まで必要）の2つが論点の軸。この2つを押さえれば大半の肢が切れる。","ref":"行政手続法8条・14条、最判平23.6.7","field":"本試験型"},{"id":"HON-007","topic":"事例型・債権譲渡","type":"mc5","sec":180,"lead":"Ａは、Ｂに対して有する売買代金債権（以下「本件債権」という。）をＣに譲渡し、Ａから確定日付のある証書によってＢに通知がされた。その後、ＡはさらにＤにも本件債権を譲渡し、同じく確定日付のある証書によってＢに通知がされた。","q":"この事例に関する次の記述のうち、民法の規定および判例に照らし、妥当なものはどれか。","choices":["ＣとＤの優劣は、確定日付の先後によって決せられる。","ＣとＤの優劣は、確定日付のある通知がＢに到達した日時の先後によって決せられる。","Ｂは、ＣとＤのいずれに弁済しても免責される。","ＡＣ間の譲渡に譲渡制限の意思表示が付されていた場合、その譲渡は無効となる。","Ｃが本件債権を取得するには、Ｂの承諾を得ることが必要である。"],"a":1,"each":["妥当でない。最判昭49.3.7は、確定日付の先後ではなく通知の到達の先後によるとした。","妥当。到達時説である。同時に到達した場合は、各譲受人が債務者に全額の弁済を請求できる（最判昭55.1.11）。","妥当でない。優劣が確定している以上、劣後する者への弁済は原則として免責されない。","妥当でない。民法466条2項により、譲渡制限の意思表示がされても譲渡の効力は妨げられない。","妥当でない。債権譲渡は譲渡人と譲受人の合意で効力を生じ、債務者の承諾は対抗要件の一つにすぎない。"],"read":"事例型は登場人物を図にする時間が惜しい。本問のように論点が1つ（到達時説）なら、事実関係は読み流し、選択肢から論点を逆算する方が速い。","ref":"民法466条・467条、最判昭49.3.7","field":"本試験型"},{"id":"HON-008","topic":"事例型・連帯債務","type":"mc5","sec":180,"lead":"ＡとＢは、Ｃから連帯して600万円を借り入れた。ＡとＢの負担部分は各300万円である。","q":"この事例に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。","choices":["ＣがＡに対して履行を請求した場合、その効力はＢにも及び、Ｂについても時効の完成が猶予される。","ＣがＡに対して債務の全部を免除した場合、Ｂの債務も全部消滅する。","ＡがＣに対して有する反対債権で相殺をした場合、その効力はＢにも及ぶ。","ＡについてＣとの間で混同が生じた場合、Ｂの債務も消滅する。","Ａについて時効が完成した場合、Ｂの債務も当然に消滅する。"],"a":2,"each":["妥当でない。平成29年改正により履行の請求は相対効となった（民法441条）。","妥当でない。免除も相対効である。Ｂは全額の債務を負ったままで、Ａに対し負担部分の求償ができる。","妥当。相殺は絶対効を有する（民法439条1項）。","妥当でない。混同はＡの債務についてのみ弁済があったものとみなされ、Ｂの債務が全部消滅するわけではない（民法440条）。Ｂは残額について責任を負う。","妥当でない。時効の完成も相対効である（民法441条）。"],"read":"連帯債務は絶対効の3つ（更改・相殺・混同）だけ覚え、それ以外は相対効と割り切る。改正で請求・免除・時効が相対効に変わった点が狙われる。","ref":"民法438条〜441条","field":"本試験型"},{"id":"HON-009","topic":"事例型・建築確認","type":"mc5","sec":180,"lead":"Ｘは、自己の所有地に建築物を建てるためにＹ市の建築主事に建築確認を申請したところ、建築基準法の制限に適合しないとして確認を拒否する処分を受けた。Ｘはこれを争いたいと考えている。","q":"この事例に関する次の記述のうち、法令および最高裁判所の判例に照らし、妥当なものはどれか。","choices":["Ｘは、拒否処分の取消訴訟を提起すれば足り、建築確認の義務付けを求める訴えを併合する必要はない。","Ｘは、拒否処分の取消訴訟と申請型義務付け訴訟を併合して提起することができる。","建築確認は行政指導にすぎないから、拒否は処分に当たらず取消訴訟を提起できない。","Ｘが取消訴訟で勝訴した場合、その判決により当然に建築確認がされたものとみなされる。","Ｘは、建築確認を受けないまま工事に着手し、是正命令を受けた段階で争うほかない。"],"a":1,"each":["妥当でない。取消訴訟だけでは確認を得られない。確認を得るには義務付け訴訟の併合提起が必要である。","妥当。行政事件訴訟法37条の3第1項2号・3項2号。拒否処分型の申請型義務付け訴訟である。","妥当でない。建築確認は処分であり、取消訴訟の対象となる。","妥当でない。取消判決には拘束力（33条）があるが、確認がされたとみなされるわけではない。","妥当でない。拒否処分を直接争うことができる。"],"read":"事例型の行政救済は、求めている結果から訴訟類型を逆算する。許認可がほしいなら義務付け、されたくないなら差止め、効力を消したいなら取消し。この対応だけで解ける問題が多い。","ref":"行政事件訴訟法37条の3","field":"本試験型"},{"id":"HON-010","topic":"時事型・生成AIと偽情報","type":"mc5","sec":120,"lead":"","q":"生成AIおよびインターネット上の偽情報に関する次の記述のうち、妥当でないものはどれか。","choices":["ディープフェイクとは、AI技術を用いて人物の画像や音声を本物らしく合成したものをいい、著名人だけでなく一般人も被害を受けうる。","実在の人物になりすました広告によって投資を勧誘する詐欺が問題となっており、被害額が高額化する傾向が指摘されている。","他人の肖像を無断で合成した動画を公開する行為は、名誉毀損やプライバシー侵害として民事上の責任を生じさせることがある。","生成AIが学習に用いた著作物の利用については、著作権法に一定の権利制限規定が置かれている。","日本では、生成AIにより作成されたすべてのコンテンツに対し、AI生成である旨の表示を義務づける法律が施行されている。"],"a":4,"each":["妥当。ディープフェイクの定義として正しく、被害は著名人に限られない。","妥当。SNS型投資詐欺・ロマンス詐欺として社会問題化している。","妥当。肖像権、名誉権、プライバシー権の侵害として不法行為責任を生じうる。","妥当。著作権法30条の4などの権利制限規定が情報解析のための利用を一定の範囲で認めている。","妥当でない。一律にAI生成表示を義務づける法律は施行されていない。基礎知識の時事問題は、こうした「全面的に義務づけられている」という言い切りが誤りであることが多い。"],"read":"基礎知識の時事問題は、細かい数字ではなく常識的な判断で解ける。『すべて』『一律に』『義務づけられている』という断定は、日本の法制度では例外が多く、まず誤りと疑ってよい。","ref":"著作権法30条の4ほか","field":"本試験型"}]}</script>

function daysLeft(){var t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((EXAM-t)/86400000));}
function dayDone(k){var d=S.done[k];return d&&((d.m&&d.m.length)||(d.e&&d.e.length));}
function streak(){var d=new Date(),n=0;if(!dayDone(today()))d.setDate(d.getDate()-1);
  for(;;){if(!dayDone(ymd(d)))break;n++;d.setDate(d.getDate()-1);}return n;}
function restDays(){var n=0,d=new Date();
  if(!Object.keys(S.done).length)return 0;
  if(dayDone(today()))return 0;
  for(;;){d.setDate(d.getDate()-1);if(dayDone(ymd(d)))break;n++;if(n>60)break;}return n;}
function rate(list){var ok=0,n=0;list.forEach(function(q){var h=S.hist[q.id];if(h){ok+=h.ok;n+=h.n;}});
  return n?ok/n:null;}
function seenCount(){var n=0;for(var k in S.hist)n++;return n;}
function isKiso(f){return KISO.indexOf(f)>=0;}
function sim(){
  var hOx=[],kOx=[];
  DATA.questions.forEach(function(q){
    if(q.type==="ox"||q.type==="mc"||q.type==="mc5"){
      if(q.field==="5肢択一（民法・商法・基礎知識）"){ (q.topic.indexOf("行政書士")>=0?kOx:hOx).push(q); }
      else if(isKiso(q.field)) kOx.push(q); else hOx.push(q);
    }});
  var rh=rate(hOx),rk=rate(kOx),rm=rate(BYT.multi||[]);
  var kw=0,kn=0;
  (BYT.desc||[]).forEach(function(q){var h=S.hist[q.id];if(h&&h.kw!=null){kw+=h.kw;kn++;}});
  var rd=kn?kw/kn:null;
  var a=rh==null?null:Math.round(rh*40)*4;
  var b=rk==null?null:Math.round(rk*14)*4;
  var c=rm==null?null:Math.round(rm*12)*2;
  var d=rd==null?null:Math.round(rd*60);
  var any=[a,b,c,d].some(function(x){return x!=null;});
  return {h:a,k:b,m:c,d:d,
    tot:any?((a||0)+(b||0)+(c||0)+(d||0)):null,
    hourei:any?((a||0)+(c||0)+(d||0)):null};
}
function wrongList(){return DATA.questions.filter(function(q){var h=S.hist[q.id];return h&&h.last==="x";});}
function record(q,ok,ms,extra){
  var h=S.hist[q.id]||{n:0,ok:0,last:"",ms:0};
  h.n++;if(ok)h.ok++;h.last=ok?"o":"x";
  if(ms)h.ms=Math.round(((h.ms||0)*(h.n-1)+ms)/h.n);
  if(extra)for(var k in extra)h[k]=extra[k];
  S.hist[q.id]=h;
}

function speakBtn(text){

  b.addEventListener("click",function(){

    var u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=1.05;

function pick(pool,n,mode){
  var a=pool.slice();
  a.sort(function(x,y){return pri(x)-pri(y);});
  var head=a.slice(0,Math.max(n,Math.min(n*3,a.length)));
  for(var i=head.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=head[i];head[i]=head[j];head[j]=t;}
  return head.slice(0,n);
}
function pri(q){var h=S.hist[q.id];if(!h)return 0;if(h.last==="x")return 1;return 2+h.ok/Math.max(1,h.n);}

function ansLine(q){
  if(q.type==="ox")return "答　"+(q.a?"〇":"×");
  if(q.type==="mc"||q.type==="mc5"||q.type==="combo")return "答　"+(q.a+1)+"．"+q.choices[q.a];

    return "答　"+q.a.map(function(i,k){return lb[k]+"＝"+q.choices[i];}).join("　");}

function makePad(host){
  var wrap=el("div","pad");
  var cv=document.createElement("canvas");
  wrap.appendChild(cv);host.appendChild(wrap);
  var bar=el("div","padbar");
  var undo=el("button",null,"1つ戻す");
  var clear=el("button",null,"全部消す");
  var hint=el("span","hint","40マス　Apple Pencil対応");
  bar.appendChild(undo);bar.appendChild(clear);bar.appendChild(hint);
  host.appendChild(bar);

  var strokes=[],cur=null,dpr=Math.max(1,window.devicePixelRatio||1);
  var cols,rows,cell,W,H;
  function layout(){
    W=wrap.clientWidth||320;
    cols=10; rows=4;
    cell=Math.floor(W/cols); W=cell*cols; H=cell*rows;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+"px"; cv.style.height=H+"px";
    var g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  function grid(g){
    var cs=getComputedStyle(document.body);
    g.clearRect(0,0,W,H);
    g.fillStyle=cs.getPropertyValue("--sheet")||"#fff";
    g.fillRect(0,0,W,H);
    g.strokeStyle=cs.getPropertyValue("--line-soft")||"#e4e8ee";
    g.lineWidth=1;
    for(var c=0;c<=cols;c++){g.beginPath();g.moveTo(c*cell+.5,0);g.lineTo(c*cell+.5,H);g.stroke();}
    for(var r=0;r<=rows;r++){g.beginPath();g.moveTo(0,r*cell+.5);g.lineTo(W,r*cell+.5);g.stroke();}
  }
  function redraw(){
    var g=cv.getContext("2d");
    grid(g);
    g.strokeStyle=getComputedStyle(document.body).getPropertyValue("--ink")||"#161a21";
    g.lineCap="round";g.lineJoin="round";
    strokes.forEach(function(st){
      if(st.length<2)return;
      g.beginPath();g.lineWidth=st[0].w;
      g.moveTo(st[0].x,st[0].y);
      for(var i=1;i<st.length;i++){g.lineTo(st[i].x,st[i].y);}
      g.stroke();
    });
  }
  function pos(e){
    var r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top,
      w:(e.pointerType==="pen"&&e.pressure>0)?(0.8+e.pressure*2.6):2.1};
  }
  cv.addEventListener("pointerdown",function(e){
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    cur=[pos(e)];strokes.push(cur);
  });
  cv.addEventListener("pointermove",function(e){
    if(!cur)return;e.preventDefault();
    cur.push(pos(e));redraw();
  });
  function end(e){if(cur){cur=null;redraw();}}
  cv.addEventListener("pointerup",end);
  cv.addEventListener("pointercancel",end);
  cv.addEventListener("pointerleave",end);
  undo.addEventListener("click",function(){strokes.pop();redraw();});
  clear.addEventListener("click",function(){strokes=[];redraw();});
  window.addEventListener("resize",layout);
  setTimeout(layout,0);
  return {empty:function(){return !strokes.length;},clear:function(){strokes=[];redraw();}};
}

function cheer(){
  var st=streak(),sn=seenCount(),rest=restDays(),s=sim();
  var left=daysLeft();
  if(rest>=2)return null;
  if(sn===0)return ["今日が1日目","371日あります。まず1問。それだけで今日は達成です。"];
  if(st===0&&sn>0)return ["今日の分はこれから","昨日までの積み上げは消えません。1問開けば今日も続きます。"];
  if(st===1)return ["1日目","いちばん難しい日を越えました。明日も同じ時刻に開くだけです。"];
  if(st===2)return ["2日続いた","3日目が最初の壁です。明日を越えれば形になります。"];
  if(st===3)return ["3日続いた","最初の壁を越えました。ここから楽になります。"];
  if(st===7)return ["1週間","習慣になりかけています。この7日は確実に前回との差です。"];
  if(st===14)return ["2週間","ここまで来た人は多くありません。淡々と続けてください。"];
  if(st===30)return ["1か月","1か月分の差がつきました。残りは"+left+"日です。"];
  if(st>=100)return [st+"日連続","もう崩れません。本試験まで"+left+"日。"];
  if(st>=50)return [st+"日連続","習慣として定着しています。"];
  if(s.d!=null&&s.d>=20)return ["記述が"+s.d+"点","前回0点だった科目です。ここが一番大きい前進です。"];
  if(sn>=200)return ["通算"+sn+"問","解いた数は裏切りません。"];
  if(sn>=50)return ["通算"+sn+"問","積み上がっています。今日の分もどうぞ。"];
  return [st+"日続いている","今日の1問目を開いてください。"];
}

var LS=null;
function startListen(hostName,ids,onDone){
  LS={ids:ids,i:0,host:hostName,onDone:onDone};
  renderListen();
}
function renderListen(){
  var host=document.getElementById("view-"+LS.host);
  if(LS.i>=LS.ids.length){
    if(window.speechSynthesis)speechSynthesis.cancel();
    var f=LS.onDone;LS=null;if(f)f();return;
  }
  var q=QS[LS.ids[LS.i]];
  host.innerHTML="";
  var sh=el("div","sheet");
  var head=el("div","sheet-head");
  head.appendChild(el("span","tag","聴く "+(LS.i+1)+"／"+LS.ids.length));
  head.appendChild(el("span","tag field",q.cat||q.field));
  head.appendChild(el("span","tag",q.topic));
  sh.appendChild(head);
  sh.appendChild(el("p","qtype","聴いたあと、同じことを自分の言葉で言ってみてください"));
  sh.appendChild(el("p","qtext",q.q));
  sh.appendChild(el("div","grade",q.model));
  var text=q.q+"。"+q.model;
  var act=el("div","actions");
  var play=el("button","btn ghost","もう一度聴く");
  var next=el("button","btn",LS.i===LS.ids.length-1?"終わる":"次を聴く");
  function say(){
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=1.05;
    speechSynthesis.speak(u);
  }
  play.addEventListener("click",say);
  next.addEventListener("click",function(){
    if(window.speechSynthesis)speechSynthesis.cancel();
    LS.i++;renderListen();window.scrollTo(0,0);});
  act.appendChild(play);act.appendChild(next);
  sh.appendChild(act);
  if(!window.speechSynthesis){
    sh.appendChild(el("p","note","この端末では読み上げが使えません。文章を声に出して読んでください。"));
  }
  host.appendChild(sh);
  say();
}

/* ===== 今日 ===== */
function poolFor(mode){
  if(mode==="desc")return BYT.desc||[];
  if(mode==="talk")return BYT.talk||[];
  if(mode==="mc5")return (BYT.mc5||[]).concat(BYT.combo||[]);
  if(mode==="multi")return BYT.multi||[];
  if(mode==="ox"||mode==="fast")return (BYT.ox||[]).concat(BYT.mc||[]);
  if(mode==="wrong")return wrongList();
  return [];
}
function weakField(){
  var best=null,br=2;
  FIELDS.forEach(function(f){
    if(f.indexOf("文章理解")>=0||f.indexOf("口頭")>=0||f==="記述式"||f==="多肢選択式")return;
    var r=rate(BYF[f]);
    var v=(r==null)?0.5:r;
    if(v<br){br=v;best=f;}
  });
  if(!best)return null;
  return best.replace(/^5肢択一（|^基礎知識（|）$/g,"").replace(/（.*?）/g,"");
}
function slotNow(){var h=new Date().getHours();return (h>=4&&h<13)?"m":"e";}
function doneSet(slot){var d=S.done[today()]||{};return d[slot]||[];}
function markDone(slot,k){
  var d=S.done[today()]||{m:[],e:[]};d.m=d.m||[];d.e=d.e||[];
  if(d[slot].indexOf(k)<0)d[slot].push(k);
  S.done[today()]=d;save();paintMeta();
}

  }
  var slots=[["m","朝の枠","5:00 − 7:00",P.m],["e","夜の枠","19:00 − 21:00",P.e]];

      var ti=el("span","ti");
      ti.appendChild(document.createTextNode(b.t+(b.mode==="video"?"":"　"+b.n+(b.mode==="talk"?"題":"問"))));
      if(b.d)ti.appendChild(el("em",null,b.d));
      btn.appendChild(ti);

      btn.addEventListener("click",function(){startBlock(key,b);});

    });

function startBlock(slot,b){
  if(b.mode==="video"){
    var host=document.getElementById("view-today");
    host.innerHTML="";
    var sh=el("div","sheet");
    sh.appendChild(el("p","eyebrow","インプット"));
    sh.appendChild(el("p","qtext","今日の単元を頭に入れる"));
    sh.appendChild(el("p","exp","動画はこのページの中では再生できません。外部の動画を埋め込めない仕組みのためです。下のリンクはYouTubeアプリかブラウザの別タブで開きます。見終えたらここに戻ってきて、同じ分野をすぐ解いてください。見るだけで終わらせないことがすべてです。"));
    videoPanel(sh);
    sh.appendChild(el("h3",null,"動画が見られないとき"));
    sh.appendChild(el("p","note","口頭再現の模範説明を読み上げます。画面を見ずに耳だけで進められます。"));
    var act=el("div","actions");
    var lb=el("button","btn","アプリの中で聴く");
    lb.addEventListener("click",function(){
      var pool=(BYT.talk||[]);
      var ids=pick(pool,Math.min(4,pool.length)).map(function(q){return q.id;});
      startListen("today",ids,function(){markDone(slot,b.k);viewToday();window.scrollTo(0,0);});
    });
    var d1=el("button","btn ghost","動画を見終えた");
    d1.addEventListener("click",function(){markDone(slot,b.k);viewToday();window.scrollTo(0,0);});
    var d2=el("button","btn ghost","とばす");
    d2.addEventListener("click",function(){markDone(slot,b.k);viewToday();window.scrollTo(0,0);});
    act.appendChild(lb);act.appendChild(d1);act.appendChild(d2);
    sh.appendChild(act);
    host.appendChild(sh);window.scrollTo(0,0);return;
  }
  var pool=poolFor(b.mode);
  if(!pool.length){
    if(b.mode==="wrong"){markDone(slot,b.k);viewToday();}
    return;
  }
  var ids=pick(pool,Math.min(b.n,pool.length)).map(function(q){return q.id;});
  run={host:"today"};
  startRun(ids,b.t,function(){markDone(slot,b.k);viewToday();window.scrollTo(0,0);},{fast:b.mode==="fast"});
  run.host="today";
  renderRun();
}

/* ===== 記録 ===== */
function viewRec(){
  var host=document.getElementById("view-rec");host.innerHTML="";
  var s=sim();
  host.appendChild(el("h2",null,"本試験の予想得点"));
  host.appendChild(el("p","note","いまの正答率がそのまま本試験で出た場合の目安です。合格は180点以上、かつ基礎知識24点以上が必要です。"));
  var sc=el("div","score");
  var tot=el("div","tot "+(s.tot!=null&&s.tot>=180?"pass":"fail"));
  tot.appendChild(document.createTextNode(s.tot==null?"—":String(s.tot)));
  tot.appendChild(el("small",null,"／300点"));
  sc.appendChild(tot);
  var gg=el("div","gauge"),gi=el("i");
  gi.style.width=Math.min(100,(s.tot||0)/300*100)+"%";gg.appendChild(gi);gg.appendChild(el("u"));
  sc.appendChild(gg);
  host.appendChild(sc);
  [["法令等 5肢択一（40問160点）",s.h],["多肢選択式（3問24点）",s.m],
   ["記述式（3問60点）",s.d],["基礎知識（14問56点）",s.k]].forEach(function(p){
    var r=el("div","sline");
    r.appendChild(el("span",null,p[0]));
    r.appendChild(el("b",null,p[1]==null?"—":p[1]+"点"));
    host.appendChild(r);
  });
  if(s.k!=null&&s.k<24){
    var a1=el("div","alert bad");
    a1.textContent="基礎知識が24点を下回っています。ここは足切りです。何点取っても他で挽回できません。行政書士法と個人情報保護法を先に固めてください。";
    host.appendChild(a1);
  }
  if(s.d!=null&&s.d<20){
    var a2=el("div","alert");
    a2.textContent="記述式が20点未満です。前回0点だった科目です。ここを20点に乗せるだけで合格可能性が大きく変わります。毎朝2問、必ず書いてください。";
    host.appendChild(a2);
  }

  host.appendChild(el("h2",null,"学習の記録"));
  var cal=el("div","cal"),now=new Date();
  for(var i=34;i>=0;i--){
    var d=new Date(now);d.setDate(d.getDate()-i);
    var k=ymd(d),rec=S.done[k]||{};
    var cell=el("div",i===0?"today":"");
    var im=el("i",(rec.m&&rec.m.length)?"m":"");
    var ie=el("i",(rec.e&&rec.e.length)?"e":"");
    cell.appendChild(im);cell.appendChild(ie);
    cell.title=k;cal.appendChild(cell);
  }
  host.appendChild(cal);
  var lg=el("div","legend");
  [["朝の枠","var(--kon)"],["夜の枠","var(--ok)"],["やっていない","var(--line-soft)"]].forEach(function(p){
    var s1=el("span"),b=el("b");b.style.background=p[1];s1.appendChild(b);
    s1.appendChild(document.createTextNode(p[0]));lg.appendChild(s1);});
  host.appendChild(lg);

  host.appendChild(el("h2",null,"分野別の到達度"));
  var rows=FIELDS.map(function(f){
    var qs=BYF[f],seen=0;qs.forEach(function(q){if(S.hist[q.id])seen++;});
    return {f:f,r:rate(qs),seen:seen,tot:qs.length};});
  rows.sort(function(a,b){return (a.r==null?9:a.r)-(b.r==null?9:b.r);});
  rows.forEach(function(x){
    var row=el("div","bar-row"),left=el("div");
    left.appendChild(el("div","bar-name",x.f));
    var tr=el("div","track"),fi=el("i");
    fi.style.width=(x.seen/x.tot*100).toFixed(1)+"%";
    if(x.r!=null&&x.r<0.6)fi.className="weak";
    tr.appendChild(fi);left.appendChild(tr);
    var num=el("div","bar-num");
    if(x.r==null)num.textContent="未着手";
    else{num.appendChild(el("em",null,Math.round(x.r*100)+"%"));
      num.appendChild(el("div",null,x.seen+"/"+x.tot));}
    row.appendChild(left);row.appendChild(num);host.appendChild(row);
  });

  var tally={},tn=0;
  for(var id in S.hist){var h=S.hist[id];if(h.why){tally[h.why]=(tally[h.why]||0)+1;tn++;}}
  if(tn){
    host.appendChild(el("h2",null,"間違いの原因"));
    host.appendChild(el("p","note","いちばん多い原因が、いま潰すべきものです。"));
    WHYS.forEach(function(p){
      var c=tally[p[0]]||0;
      var row=el("div","bar-row"),left=el("div");
      left.appendChild(el("div","bar-name",p[1]));
      var tr=el("div","track"),fi=el("i");fi.style.width=(c/tn*100)+"%";
      tr.appendChild(fi);left.appendChild(tr);
      var num=el("div","bar-num");num.appendChild(el("em",null,String(c)));
      row.appendChild(left);row.appendChild(num);host.appendChild(row);});
    if((tally.yomi||0)>=Math.max(1,tn*0.3)){
      var a3=el("div","alert");
      a3.textContent="読み違いが最も多くなっています。設問が「正しいもの」か「妥当でないもの」かを最初に確認する癖をつけてください。これだけで読み違いの半分は消えます。";
      host.appendChild(a3);
    }
  }
  var avg=0,an=0;
  (BYT.mc5||[]).forEach(function(q){var h=S.hist[q.id];if(h&&h.ms){avg+=h.ms;an++;}});
  if(an){
    host.appendChild(el("h2",null,"5肢択一の平均解答時間"));
    var r1=el("div","sline");
    r1.appendChild(el("span",null,"あなたの平均"));
    r1.appendChild(el("b",null,mmss(avg/an)));
    host.appendChild(r1);
    var r2=el("div","sline");
    r2.appendChild(el("span",null,"本番の目安（3時間60問）"));
    r2.appendChild(el("b",null,"2:30"));
    host.appendChild(r2);
    host.appendChild(el("p","note",avg/an>150000?
      "目標を超えています。全肢を精読しているのが原因です。語尾、数字、主語の順に見て、違和感のある肢だけ本文を読んでください。":
      "本番のペースに乗っています。この速度を維持してください。"));
  }
}

var TABS={today:["tab-today","view-today",viewToday],drill:["tab-drill","view-drill",viewDrill],
  rec:["tab-rec","view-rec",viewRec],plan:["tab-plan","view-plan",viewPlan]};
function selectTab(name){
  if(run&&run.host&&run.host!==name)run=null;
  if(LS&&LS.host!==name){LS=null;if(window.speechSynthesis)speechSynthesis.cancel();}
  Object.keys(TABS).forEach(function(k){
    var t=TABS[k],on=k===name;
    document.getElementById(t[0]).setAttribute("aria-selected",on?"true":"false");
    document.getElementById(t[1]).classList.toggle("hide",!on);});
  TABS[name][2]();
}
Object.keys(TABS).forEach(function(k){
  document.getElementById(TABS[k][0]).addEventListener("click",function(){selectTab(k);});});

document.getElementById("ver").textContent="収録 "+DATA.questions.length+" 問　データ更新 "+(DATA.generated||"")+"　このリンクは常に最新版を開きます。";

if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(x){
    if(!x)return;db=x;
    return db.doc("progress/v2").get().then(function(s){
      if(s&&s.exists&&weight(s.data)>weight(S)){S=Object.assign(S,s.data);paintMeta();selectTab("today");}
      else save();});
  }).catch(function(){});
  window.claude.use("sample").then(function(f){if(f)window.__sample=f;}).catch(function(){});
}
